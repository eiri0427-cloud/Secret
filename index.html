<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舊案重啟：雙人推理檔案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#13100e;--bg2:#1d1814;--line:#3a3029;--kraft:#c49a5c;--kraft2:#a77d43;--paper:#efe6d2;--ink:#2a2420;--red:#a3302a;--red2:#c8463c;--muted:#9d8f80}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#eadfce;font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,select,input,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 104px}
.eyebrow{letter-spacing:.3em;font-size:12px;color:var(--kraft)}
.title{font-family:"Noto Serif TC",serif;font-weight:900;font-size:40px;line-height:1.15;margin:10px 0 6px;color:#e9d3a8;text-shadow:0 2px 0 #000}
.subtitle{color:var(--muted);font-size:13.5px;line-height:1.7}
.cover{padding:28px 0 8px;text-align:center}
.folder{position:relative;margin:22px auto 6px;width:70%;max-width:280px;aspect-ratio:3/4;background:linear-gradient(160deg,#cfa86b,#a67c42);border-radius:4px 14px 6px 6px;box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(80,50,20,.35);transform:rotate(-2deg);color:#3b2a18}
.folder:before{content:"";position:absolute;top:-14px;left:16px;width:40%;height:18px;background:#c09858;border-radius:6px 6px 0 0}
.folder .lab{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#efe3c8;padding:4px 12px;font-size:11px;letter-spacing:.15em;white-space:nowrap;border-radius:2px}
.folder .no{position:absolute;top:26%;width:100%;text-align:center;font-family:"Noto Serif TC",serif;font-weight:700;font-size:28px}
.folder .nm{position:absolute;top:40%;width:100%;text-align:center;font-family:"Noto Serif TC",serif;font-size:17px;letter-spacing:.2em;font-weight:700}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:"Noto Serif TC",serif;font-weight:900;padding:2px 12px;letter-spacing:.3em;transform:rotate(-8deg);opacity:.88}
.folder .s1{position:absolute;top:56%;left:22%;font-size:20px}
.folder .s2{position:absolute;top:70%;left:38%;font-size:12px;border-width:2px;transform:rotate(-4deg)}
.folder .meta{position:absolute;bottom:12px;width:100%;text-align:center;font-size:10px;letter-spacing:.08em;opacity:.8}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card h3{margin:0 0 8px;font-family:"Noto Serif TC",serif;color:#e9d3a8;font-size:17px}
.card p{margin:6px 0;color:#cfc2b0;font-size:14px;line-height:1.75}
.case{display:flex;gap:14px;width:100%;text-align:left;background:linear-gradient(180deg,#261f19,#1e1814);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;color:#eadfce;align-items:stretch}
.case .mini{flex:0 0 74px;border-radius:3px 9px 4px 4px;background:linear-gradient(160deg,#cfa86b,#a67c42);color:#3b2a18;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Noto Serif TC",serif;transform:rotate(-2deg);box-shadow:0 6px 14px rgba(0,0,0,.5);padding:10px 0}
.case .mini b{font-size:22px}.case .mini i{font-style:normal;font-size:10px;letter-spacing:.2em}
.case .mini .stamp{font-size:10px;border-width:1.5px;padding:0 5px;margin-top:6px;letter-spacing:.15em}
.case h4{margin:0;font-family:"Noto Serif TC",serif;font-size:19px;color:#f0e2c6}
.case .s{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.case .tg{font-family:"Noto Serif TC",serif;font-size:13.5px;color:#d8c9a8;line-height:1.6}
.case .m{font-size:11.5px;color:var(--kraft);margin-top:8px}
.st{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.st.go{border-color:var(--kraft2);color:var(--kraft)}.st.done{border-color:#4d6b3f;color:#9fc48c}
.roles{display:grid;gap:10px;margin-top:10px}
.role{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:#241e19;border:1px solid var(--line);border-radius:12px;padding:14px;color:#eadfce}
.role .ic{flex:0 0 46px;height:46px;border-radius:10px;background:#2f261f;display:grid;place-items:center;color:var(--kraft)}
.role .ic svg{width:26px;height:26px}
.role b{display:block;font-size:16px;color:#f0e2c6}.role span span{font-size:12.5px;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:rgba(19,16,14,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;padding:10px 12px 8px;display:flex;align-items:center;gap:8px}
.top .bk{background:none;border:0;color:var(--muted);font-size:20px;padding:0 6px}
.top .t{font-family:"Noto Serif TC",serif;font-weight:700;color:#e9d3a8;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t small{display:block;font-family:"Noto Sans TC";font-weight:400;font-size:11px;color:var(--muted)}
.chip{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--kraft2);color:var(--kraft);white-space:nowrap;background:none}
.prog{display:flex;gap:6px;padding:0 16px 10px;max-width:560px;margin:0 auto}
.prog i{flex:1;height:4px;border-radius:4px;background:#3a3029}.prog i.on{background:var(--kraft)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#171310;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;color:var(--muted);padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px}
.tab.on{color:var(--kraft)}.tab svg{width:22px;height:22px}
.badge{display:inline-block;min-width:8px;height:8px;border-radius:8px;background:var(--red2);margin-left:2px;vertical-align:top}
.sect{margin:20px 0 8px;display:flex;align-items:center;gap:8px;color:var(--kraft);font-size:12.5px;letter-spacing:.12em}
.sect:after{content:"";flex:1;height:1px;background:var(--line)}
.doc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:linear-gradient(180deg,#2a221c,#231c17);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;color:#eadfce}
.doc .ic{flex:0 0 38px;height:38px;border-radius:8px;background:#efe6d2;color:#5a4330;display:grid;place-items:center}
.doc .ic svg{width:22px;height:22px}
.doc b{display:block;font-size:14.5px}.doc small{color:var(--muted);font-size:12px}
.doc .new{margin-left:auto;font-size:10px;color:#fff;background:var(--red);padding:2px 6px;border-radius:4px}
.doc.read{opacity:.78}.doc.bt .ic{background:#e7c9c4;color:#7a211c}
.doc .cd{display:inline-block;margin-top:4px;font-family:monospace;font-size:13px;letter-spacing:.15em;color:#f0c987;background:#3a2d1f;border-radius:6px;padding:1px 7px}
.locked{display:flex;gap:10px;align-items:center;border:1px dashed #4a3e34;border-radius:10px;padding:14px;color:var(--muted);font-size:13px;margin:8px 0}
.locked svg{width:22px;height:22px;flex:0 0 22px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,4,3,.86);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:block}
.modal .close{position:sticky;top:10px;margin:10px 10px 0 auto;display:block;background:#2a221c;border:1px solid var(--line);color:#eadfce;border-radius:99px;padding:6px 14px;font-size:13px;z-index:2}
.paper{position:relative;max-width:540px;margin:10px auto 60px;background:var(--paper);color:var(--ink);padding:26px 20px 30px;border-radius:3px;box-shadow:0 20px 50px rgba(0,0,0,.7);font-family:"Noto Serif TC",serif;line-height:1.9;font-size:15px;background-image:radial-gradient(circle at 20% 10%,rgba(150,110,60,.10),transparent 40%),radial-gradient(circle at 80% 90%,rgba(150,110,60,.12),transparent 45%)}
.paper .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #2a2420;padding-bottom:8px;margin-bottom:14px;gap:8px}
.paper .hd .org{font-size:11px;letter-spacing:.15em;color:#6b5a48}
.paper .hd h2{margin:4px 0 0;font-size:20px;line-height:1.35}
.paper .tag{font-family:"Noto Sans TC",sans-serif;font-size:11px;border:1.5px solid var(--red);color:var(--red);padding:1px 6px;white-space:nowrap;transform:rotate(3deg)}
.paper p{margin:8px 0}.paper .q{font-weight:700;margin-top:12px}.paper .a{padding-left:1.2em;text-indent:-1.2em}
.paper .note{background:rgba(163,48,42,.08);border-left:3px solid var(--red);padding:8px 10px;font-size:13.5px;margin:12px 0}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
.paper td,.paper th{border:1px solid #8c7a66;padding:5px 6px;vertical-align:top;text-align:left}
.paper th{background:rgba(120,90,50,.12)}
.paper .hand{color:#1e3a6e;font-size:15.5px}
.paper .sig{text-align:right;color:#6b5a48;font-size:12px;margin-top:16px}
.paper .redact{background:#2a2420;color:#2a2420;border-radius:2px;padding:0 4px}
.paper .photo{background:#d9cfbb;border:6px solid #f7f2e6;box-shadow:0 3px 10px rgba(0,0,0,.25);padding:14px;font-size:13px;color:#4a3d30;margin:12px 0;transform:rotate(-1deg)}
.paper .photo .ts{font-family:monospace;color:#d0521e;font-weight:700;float:right}
.paper svg{max-width:100%;height:auto;display:block;margin:8px auto}
.paper hr{border:0;border-top:1px dashed #8c7a66;margin:16px 0}
.paper .small{color:#6b5a48;font-size:12.5px}
.paper .codebar{font-family:"Noto Sans TC";background:#2a2420;color:#f0c987;border-radius:6px;padding:8px 10px;font-size:13px;margin:-6px 0 14px}
.paper .codebar b{font-family:monospace;font-size:17px;letter-spacing:.2em}
.ev{margin:12px 0;background:#d9cfbb;padding:6px;border:1px solid #b9ab8e;cursor:zoom-in}
.ev svg{width:100%;height:auto;display:block;margin:0}
.ev figcaption{font-family:"Noto Sans TC";font-size:12px;color:#5a4a3a;margin-top:6px;display:flex;justify-content:space-between;gap:8px;line-height:1.5}
.ev figcaption span{white-space:nowrap;color:#a3302a}
.tm{border-bottom:1.5px dashed #a3302a;cursor:pointer}
.zoom{position:fixed;inset:0;z-index:28;background:#0b0907;display:none}
.zoom.on{display:block}
.zbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#171310;border-bottom:1px solid var(--line);z-index:2}
.zbar button{background:#2a221c;border:1px solid var(--line);color:#eadfce;border-radius:99px;min-width:38px;height:34px;padding:0 12px}
.zbar #zl{min-width:40px;text-align:center;color:var(--kraft);font-family:monospace}
.zsc{position:absolute;top:52px;bottom:0;left:0;right:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.zin{width:100%}.zin svg{width:100%;height:auto;display:block}
.story{max-width:480px;margin:8vh auto 40px;padding:0 26px;font-family:"Noto Serif TC",serif;font-size:17px;line-height:2.1;color:#e9dcc4}
.story .ch{font-family:"Noto Sans TC";font-size:12px;letter-spacing:.3em;color:var(--kraft);margin-bottom:6px}
.story h2{font-size:30px;margin:0 0 22px;color:#e9d3a8}
.story p{margin:0 0 16px;opacity:0;animation:fi .9s forwards}
@keyframes fi{to{opacity:1}}
.story .btn{margin-top:16px;width:100%;padding:14px;font-size:16px}
.gate{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.gate.done{border-color:#3d5132;background:#1a1f16}
.gate h4{margin:0 0 4px;font-size:12px;letter-spacing:.2em;color:var(--kraft)}
.gate .qq{font-family:"Noto Serif TC",serif;font-size:16px;line-height:1.7;color:#f0e2c6;margin:4px 0 12px}
.row{display:flex;gap:8px}
.inp{flex:1;min-width:0;background:#0f0c0a;border:1px solid #4a3e34;border-radius:10px;color:#f4e9d6;font-size:22px;letter-spacing:.35em;padding:10px 12px;text-align:center;font-family:monospace}
.inp.txt{letter-spacing:.1em;font-family:inherit;font-size:18px}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:none;border:1px solid var(--line);color:#cfc2b0;font-weight:400}
.btn.small{padding:6px 10px;font-size:12.5px}
.msg{font-size:13.5px;margin-top:10px;line-height:1.7}.msg.err{color:#e07a6e}.msg.ok{color:#9fc48c}
.hint{font-size:13px;color:#d8c9a8;background:#2b241d;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.7}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.sus{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.sus .hdr{display:flex;gap:12px;align-items:center}
.av{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:"Noto Serif TC",serif;font-weight:900;font-size:22px;color:#241a10;background:#c49a5c}
.sus b{font-size:16px;color:#f0e2c6}.sus .d{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:2px}
.sus .acts{display:flex;gap:8px;margin-top:12px;align-items:center}
.tagb{border:1px solid var(--line);background:none;color:var(--muted);border-radius:99px;padding:5px 12px;font-size:12.5px}
.tagb.t1{border-color:var(--red2);color:#f0a59c;background:rgba(163,48,42,.15)}.tagb.t2{border-color:#4d6b3f;color:#9fc48c;text-decoration:line-through}
.sheet{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.7);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .box{background:#1d1814;border-top:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;margin:0 auto;max-height:82vh;overflow:auto;padding:16px 16px 28px}
.sheet h3{margin:0 0 6px;font-family:"Noto Serif TC",serif;color:#e9d3a8;font-size:17px}
.frm label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.fi,.frm select{width:100%;background:#0f0c0a;border:1px solid #4a3e34;border-radius:10px;color:#f4e9d6;padding:10px 12px;font-size:15px}
.frm .chk{display:flex;gap:8px;align-items:center;color:#cfc2b0;font-size:14px;margin-top:12px}
.fq{margin:16px 0}.fq .l{font-size:14.5px;color:#e9d3a8;margin-bottom:8px;font-family:"Noto Serif TC",serif;line-height:1.6}
.opts{display:grid;gap:7px}
.opt{text-align:left;background:#211b16;border:1px solid var(--line);color:#eadfce;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.opt.on{border-color:var(--kraft);background:#3a2d1f;color:#fff}
textarea.notes{width:100%;min-height:56vh;background:#efe6d2;color:#2a2420;border:0;border-radius:6px;padding:14px;font-family:"Noto Serif TC",serif;font-size:15px;line-height:1.9;background-image:repeating-linear-gradient(transparent,transparent 27.5px,rgba(120,90,50,.25) 28.5px);background-attachment:local}
.small{font-size:12.5px;color:var(--muted);line-height:1.7}
.seg{display:flex;background:#211b16;border:1px solid var(--line);border-radius:10px;padding:3px;margin:16px 0 10px}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:8px;border-radius:8px;font-size:14px}
.seg button.on{background:#3a2d1f;color:#f0e2c6}
.flt{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.flt button{flex:0 0 auto;border:1px solid var(--line);background:none;color:var(--muted);border-radius:99px;padding:4px 10px;font-size:12.5px}
.flt button.on{border-color:var(--kraft);color:var(--kraft)}
.tld{font-size:12px;color:var(--kraft);letter-spacing:.15em;margin:16px 0 4px}
.tli{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #2a221c;align-items:flex-start}
.tli .tt{flex:0 0 52px;font-family:monospace;font-size:15px;color:#f0e2c6;padding-top:1px}
.tli .tb{flex:1;font-size:14px;line-height:1.65;color:#d8cbb6;word-break:break-word}
.tli .who{font-weight:700;margin-right:6px}
.tli .src{display:inline-block;font-size:12px;color:var(--kraft);margin-left:4px;text-decoration:underline;cursor:pointer}
.tli .pt{font-size:11px;color:#9fc4e8;border:1px solid #3e5a74;border-radius:4px;padding:0 4px;margin-left:4px}
.tli .ta{display:flex;gap:2px}
.tli .ta button{background:none;border:0;color:var(--muted);font-size:16px;padding:0 4px}
.tli.star .tt,.tli.star .tb{color:#f6b29a}.tli .ta button.on{color:#f0a24a}
.room{background:#1c1a14;border:1px solid #4a3e2a;border-radius:12px;padding:12px 14px;margin:14px 0 4px}
.room .rc{font-family:monospace;font-size:24px;letter-spacing:.3em;color:#f0c987}
.room .rs{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6}
.room .rs i{display:inline-block;width:8px;height:8px;border-radius:8px;background:#6b5f54;margin-right:6px}
.room .rs.on i{background:#7fb069}.room .rs.wait i{background:var(--kraft)}
.rank{text-align:center;padding:18px}
.rank .g{font-family:"Noto Serif TC",serif;font-weight:900;font-size:64px;color:#e9d3a8;line-height:1}
.rank .n{color:var(--kraft);letter-spacing:.2em;font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.stats div{background:#241e19;border-radius:8px;padding:8px 2px;font-size:11px;color:var(--muted);text-align:center}
.stats b{display:block;font-size:16px;color:#f0e2c6}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:30;padding:20px}
.dialog.on{display:grid}
.dialog .box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:380px;width:100%;max-height:86vh;overflow:auto}
.dialog .who{font-family:"Noto Serif TC",serif;color:var(--kraft);font-size:13px;margin-bottom:6px}
.say{min-height:1.9em}
.dialog .say{font-family:"Noto Serif TC",serif;font-size:16px;line-height:1.9;color:#f0e2c6;margin:0 0 14px}
.code{font-family:monospace;font-size:26px;letter-spacing:.3em;color:#e9d3a8;text-align:center;background:#0f0c0a;border:1px dashed var(--kraft2);border-radius:10px;padding:8px;margin:8px 0 14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2f4426;color:#e8f3df;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
ol.db{padding-left:1.3em;margin:6px 0;color:#cfc2b0;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><button class="close" id="mclose" onclick="closeDoc()">✕ 收起文件</button><div id="paper"></div></div>
<div class="zoom" id="zoom"><div class="zbar"><button onclick="zClose()">✕</button><button onclick="zStep(-1)">－</button><span id="zl">1×</span><button onclick="zStep(1)">＋</button><span class="small">雙指或雙擊放大，拖曳移動</span></div><div class="zsc" id="zsc"><div class="zin" id="zin"></div></div></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="box" id="sheetBox"></div></div>
<div class="dialog" id="dlg"><div class="box" id="dlgBox"></div></div>

<script>
var CASES=[{"id":"c1","key":"oldcase01_v2","no":"01","title":"最後一場","sub":"2005 南星大戲院命案","kind":"謀殺案","diff":"★★★★★","time":"約 2.5–3 小時","tagline":"那天晚上的電影，不是照順序放的。","days":["3/18","3/19","其他"],"people":["林振邦","吳永福","陳美玲","林子翔","張國輝","林王素月","其他"],"chapters":["散場之後","結婚紀念日","缺頁","第 119 張"],"prologue":"<p>2005 年 3 月 18 日，台南。</p><p>開了四十年的南星大戲院，放完最後一場《雨港之戀》。隔天早上，清潔員在二樓辦公室發現老闆林振邦倒在保險箱旁，錢不見了。</p><p>警方說，是散場後闖進來的強盜。沒有凶器，沒有嫌犯。</p><p>二十一年後，一封沒有署名的信寄到了你們桌上。寫信的人說，答案在放映室。</p><p>寫信的人，為什麼現在才說？</p>","chapterIntro":["<p>林振邦在 22:40 以前就已經死了。</p><p>23:12 那句話是假的。說假話的人，是那天晚上離他最近、而且錯過了一次換盤的人。</p><p>一切看起來都指向放映室，就像那封信說的一樣。</p><p>新的卷宗送到了：平面圖、記事本的謄本、死者妻子的筆錄。</p>","<p>保險箱是用結婚紀念日打開的。</p><p>開保險箱的人，和動手的人，一定是同一個嗎？</p><p>鑑識科重新翻拍了那本記事本，也重新看了一次傷口。現在可以去找當年的關係人當面談了。</p>","<p>22:24。攻擊發生的那一刻。</p><p>把每個人放回那一分鐘：誰在放映機旁邊？誰在路上？誰在廟裡？誰在二樓？</p><p>最後一批卷宗，從那封匿名信開始。</p>","<p>第 119 張。</p><p>那天晚上，這張票從來沒有賣出去。</p><p>請兩位討論後，提交結案報告。</p>"],"docs":[{"id":"S0","role":"S","stage":1,"icon":"note","title":"調查委託信","sub":"2026 年・匿名來件","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組・收件紀錄</div><h2>調查委託</h2></div><span class=\"tag\">優先</span></div><p>2026 年 10 月，小組收到一個沒有寄件人的信封，郵戳是台南。裡面有兩樣東西：一張南星大戲院的電影票（已送鑑識，報告稍後送達），以及一張用電腦打字、印表機列印的紙條：</p><p class=\"hand\">「那天晚上的電影，不是照順序放的。<br>答案一直都在放映室。」</p><div class=\"note\"><b>任務說明</b><br>兩人分屬<b>證詞組</b>與<b>鑑識組</b>，各自只拿到一半卷宗。請用通話或訊息交換資訊，<b>只能用說的或打字描述，不要截圖給對方</b>。<br>本案共四章，每章破解一道密碼才會開啟下一批卷宗。<br>照片類證物可以<b>點開放大</b>，有些細節只有放大才看得見。<br>卷宗裡出現的時間（例如 22:40）可以點一下，加入「線索板」的時間軸。<br>結案報告共九題，其中一題要自己填寫。</div><p class=\"small\">依 2019 年刑法修正，最重本刑為死刑之殺人罪已不受追訴期限制。本案仍可偵辦。</p>"},{"id":"S1","role":"S","stage":1,"icon":"folder","title":"案件摘要（2005 原專案組）","sub":"台南市警察局","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局 刑事警察大隊</div><h2>南星大戲院負責人命案　案件摘要</h2></div><span class=\"tag\">未破</span></div><table><tr><th style=\"width:26%\">被害人</th><td>林振邦，58 歲，南星大戲院負責人</td></tr><tr><th>發現</th><td>2005/3/19 08:40，清潔員郭秀琴於二樓經理辦公室發現死者倒臥於辦公桌與保險箱之間</td></tr><tr><th>死因</th><td>頭部遭鈍器重擊</td></tr><tr><th>財物</th><td>保險箱開啟，箱內現金失竊。售票員陳美玲稱當晚放在桌上之晚場票款袋亦不知去向。合計約 NT$86,000</td></tr><tr><th>凶器</th><td>未尋獲</td></tr></table><p><b>研判：</b>歹徒於晚場散場後（23:15 以後）潛入二樓，遭林振邦撞見後行兇，並洗劫現金。</p><p><b>依據：</b>放映師吳永福證稱 23:12 仍見林振邦在世。</p><p><b>關係人：</b>吳永福（放映師）、陳美玲（售票員）、林子翔（獨子）、張國輝（建商）、林王素月（妻）</p><p>2007 年 3 月列為懸案。2006 年南星大戲院結束營業，建物閒置至今。</p>"},{"id":"A1","role":"A","stage":1,"icon":"mic","title":"吳永福 筆錄","sub":"放映師・2005/3/19","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　調查筆錄</div><h2>關係人：吳永福（45 歲，放映師）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：你昨晚的工作情形？</p><p class=\"a\">答：我在南星放片子二十二年了。最後一場九點半，《雨港之戀》，五盤片，兩台機器輪流放，每二十分鐘換一次盤，一步都不能走開。十一點十分左右放完。</p><p class=\"q\">問：放得順利嗎？</p><p class=\"a\">答：中間有一次換盤慢了，片子跳了一下。老機器了，常有的事。</p><p class=\"q\">問：最後一次見到林老闆是什麼時候？</p><p class=\"a\">答：十一點十二分左右，片子剛放完，老闆從那扇內門走進放映室，交代我下禮拜換片的事，心情看起來還不錯。講了兩三分鐘，我十一點十五分從前面樓梯下樓。</p><p class=\"q\">問：之後呢？</p><p class=\"a\">答：去對面阿水那邊吃麵，吃完就回家了。</p><p class=\"q\">問：放映期間，有沒有聽到辦公室有什麼聲音？</p><p class=\"a\">答：放映機那麼吵，什麼都聽不到。</p><p class=\"q\">問：放映室裡可以聽收音機嗎？</p><p class=\"a\">答：不行，老闆規定的，怕分心錯過換盤。</p><p class=\"q\">問：老闆最近跟誰有過節？</p><p class=\"a\">答：那個建商張先生來好幾次了，上禮拜還在大廳吵起來。還有他兒子，常常回來要錢。</p><p class=\"q\">問：你知道保險箱密碼嗎？</p><p class=\"a\">答：不知道。</p><div class=\"sig\">受詢問人：吳永福</div>"},{"id":"A2","role":"A","stage":1,"icon":"mic","title":"林子翔 筆錄","sub":"死者獨子・2005/3/19","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　調查筆錄</div><h2>關係人：林子翔（28 歲，無業）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：3 月 18 日晚上你在哪裡？</p><p class=\"a\">答：在安平朋友阿凱家打麻將，從八點打到天亮，另外三個人都可以作證。</p><p class=\"q\">問：你和父親的關係？</p><p class=\"a\">答：還好啦。他念我念很多，說我不務正業。</p><p class=\"q\">問：有人說你在外面欠了不少錢？</p><p class=\"a\">答：一點點而已，我自己會處理。</p><p class=\"q\">問：你有戲院的鑰匙嗎？</p><p class=\"a\">答：有後門的鑰匙，從小就有。不過我很久沒去了。</p><p class=\"q\">問：你知道保險箱密碼嗎？</p><p class=\"a\">答：不知道。我爸不會跟我講這個。</p><p class=\"small\">（筆錄註：受詢問人到案時著紅色運動外套。）</p>"},{"id":"A3","role":"A","stage":1,"icon":"mic","title":"張國輝 筆錄","sub":"建商・2005/3/20","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　調查筆錄</div><h2>關係人：張國輝（52 歲，國輝建設董事長）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：你和林振邦是什麼關係？</p><p class=\"a\">答：生意上的事。南星那塊地在市中心，戲院早就不賺錢了，我出價很公道，他就是死腦筋。</p><p class=\"q\">問：上週你們在大廳起過爭執？</p><p class=\"a\">答：講話大聲一點而已，說不上吵架。</p><p class=\"q\">問：3 月 18 日晚上你在哪裡？</p><p class=\"a\">答：台南大飯店，我公司經理的喜宴。七點開席，我待到十一點半才走，一百多個人都看到我。</p><p class=\"q\">問：林振邦過世後，戲院有可能出售嗎？</p><p class=\"a\">答：那要問他兒子了。（笑）我想他兒子會比較好溝通。</p>"},{"id":"A4","role":"A","stage":1,"icon":"mic","title":"陳美玲 筆錄","sub":"售票員・2005/3/19","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　調查筆錄</div><h2>關係人：陳美玲（34 歲，售票員）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨晚的工作情形？</p><p class=\"a\">答：晚場九點半開演，我賣票到十點收亭，在售票亭對帳。晚場一百一十八張，票款兩萬三千多，零錢很多，一袋很重。</p><p class=\"q\">問：對完帳之後？</p><p class=\"a\">答：十點二十分左右，我拿票款袋上二樓要交給老闆。辦公室的門開著，燈亮著，裡面沒人。我聽到放映室那邊好像有人在大聲講話，放映機很吵，聽不清楚，我想說阿福大概在聽收音機。我把袋子放在老闆桌上，用菸灰缸壓著，就下樓了。</p><p class=\"q\">問：你幾點離開戲院？</p><p class=\"a\">答：十點三十三分打卡，打卡鐘有紀錄。走的時候觀眾在鼓譟，銀幕是黑的。</p><p class=\"q\">問：下樓到打卡之間做了什麼？</p><p class=\"a\">答：去了一樓廁所，然後收拾售票亭。</p><p class=\"q\">問：林老闆最近有什麼異狀？</p><p class=\"a\">答：上禮拜他還跑來售票亭，站在我後面看我賣票，看了一整場。我也不知道他在看什麼。</p>"},{"id":"A5","role":"A","stage":1,"icon":"mic","title":"黃阿水 筆錄","sub":"對面麵攤老闆・2005/3/19","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　調查筆錄</div><h2>關係人：黃阿水（61 歲，「阿水麵攤」負責人）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：林老闆昨晚有來吃麵嗎？</p><p class=\"a\">答：有啊，他幾乎天天來。八點二十分來的，一碗牛肉麵加一盤滷菜。他吃東西慢，坐了大概二十分鐘，說要回去趕九點半開演前對帳。他晚上不吃宵夜的。</p><p class=\"q\">問：吳永福呢？</p><p class=\"a\">答：阿福十一點二十五分來的，我正要收攤，有看時鐘。他一直跟我說「老闆剛剛還在跟我念下禮拜的片子」，同一句講了好幾遍。</p><p class=\"q\">問：還有看到其他人嗎？</p><p class=\"a\">答：十一點左右吧，有個穿紅色夾克的年輕人從戲院旁邊的後巷跑出來，往大馬路那邊去了。臉沒看清楚。</p><p class=\"q\">問：陳美玲呢？</p><p class=\"a\">答：十點半過一點，美玲走去公車站，經過的時候跟我揮手。她每天都搭那班。</p><p class=\"q\">問：晚場散場的情形？</p><p class=\"a\">答：十一點二十左右散場，好幾個人在罵片子放得亂七八糟。</p>"},{"id":"B1","role":"B","stage":1,"icon":"finger","title":"解剖報告（2005）","sub":"法醫研究所","body":"<div class=\"hd\"><div><div class=\"org\">法務部法醫研究所</div><h2>解剖鑑定報告書　死者：林振邦</h2></div><span class=\"tag\">鑑定</span></div><table><tr><th style=\"width:26%\">死因</th><td>顱骨骨折併顱內出血</td></tr><tr><th>致命傷</th><td>右後枕部挫裂創一處，長約 5 cm。創口周圍有<b>多處類圓形表皮剝脫</b>，直徑約 2.5–2.7 cm，部分重疊，邊緣可見細密的平行短紋。致傷物推定為「質量大、表面不規則之鈍器」。</td></tr><tr><th>創口異物</th><td>未檢出金屬碎屑、木屑或纖維。</td></tr><tr><th>其他</th><td>右手掌外側有新鮮擦傷，疑為倒地時撐地所致。左腕手錶玻璃破裂。無其他抵抗傷。</td></tr><tr><th>死亡時間</th><td>依屍溫及屍僵研判，3/18 22:00 至 3/19 00:00 之間。</td></tr><tr><th>胃內容物</th><td>麵條、牛肉片、滷豆干，部分消化。</td></tr></table>"},{"id":"B2","role":"B","stage":1,"icon":"finger","title":"現場勘察報告（2005）","sub":"二樓經理辦公室","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　鑑識課</div><h2>現場勘察報告</h2></div><span class=\"tag\">鑑識</span></div><p>證物標記：</p><table><tr><td style=\"width:10%\">1</td><td>遺體。俯臥，頭部朝保險箱，頭部下方血泊約 40×30 cm。</td></tr><tr><td>2</td><td>保險箱。開啟狀態，<b>密碼鎖無破壞痕跡</b>，研判以正確密碼開啟。箱內現金全數失竊。</td></tr><tr><td>3</td><td>辦公桌。桌面文件整齊，<b>未見票款袋</b>。</td></tr><tr><td>4</td><td>菸灰缸。菸蒂已滿，置於文件堆上，無血跡、無擦拭痕。</td></tr><tr><td>5</td><td>死者左腕手錶。玻璃破裂，指針停止。另行拍照（證物 E-05）。</td></tr><tr><td>6</td><td>血泊東側運動鞋鞋印，約 27 cm，鞋尖朝側門。鞋印處血跡邊緣半凝固、中心濕潤，推定<b>於出血後 20–40 分鐘踩踏</b>。</td></tr></table><p><b>門：</b>走廊門虛掩；通放映室之內門關閉未鎖；通後樓梯之側門未鎖。</p><div class=\"note\">放映室：本次未採證。一樓大廳及廁所：未勘察。</div>"},{"id":"B3","role":"B","stage":1,"icon":"photo","title":"現場照片（俯拍）","sub":"2005/3/19 09:12","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　鑑識課</div><h2>現場照片　經理辦公室（俯拍）</h2></div><span class=\"tag\">照片</span></div><figure class=\"ev\"><svg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Serif TC,serif\">\n<rect width=\"400\" height=\"300\" fill=\"#5e4a37\"/>\n<g stroke=\"#4c3b2b\" stroke-width=\"1\"><path d=\"M0 44H400\"/><path d=\"M0 64H400\"/><path d=\"M0 84H400\"/><path d=\"M0 104H400\"/><path d=\"M0 124H400\"/><path d=\"M0 144H400\"/><path d=\"M0 164H400\"/><path d=\"M0 184H400\"/><path d=\"M0 204H400\"/><path d=\"M0 224H400\"/><path d=\"M0 244H400\"/><path d=\"M0 264H400\"/><path d=\"M0 284H400\"/></g>\n<g stroke=\"#4c3b2b\" stroke-width=\".6\ \" font-size=\"10\" fill=\"#2a2420\"><rect x=\"10\" y=\"10\" width=\"320\" height=\"282\" fill=\"none\" stroke=\"#2a2420\" stroke-width=\"2.5\"/><text x=\"170\" y=\"24\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6b5a48\">（北側：觀眾廳挑高，放映窗口朝向銀幕）</text><rect x=\"20\" y=\"32\" width=\"140\" height=\"150\" fill=\"rgba(160,120,70,.10)\" stroke=\"#2a2420\" stroke-width=\"1.5\"/><text x=\"90\" y=\"50\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"12\">放映室</text><rect x=\"34\" y=\"34\" width=\"22\" height=\"6\" fill=\"#2a2420\"/><rect x=\"104\" y=\"34\" width=\"22\" height=\"6\" fill=\"#2a2420\"/><text x=\"45\" y=\"64\" text-anchor=\"middle\" font-size=\"8.5\">放映窗口</text><text x=\"115\" y=\"64\" text-anchor=\"middle\" font-size=\"8.5\">放映窗口</text><rect x=\"32\" y=\"70\" width=\"26\" height=\"34\" rx=\"3\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"45\" y=\"91\" text-anchor=\"middle\">機A</text><rect x=\"102\" y=\"70\" width=\"26\" height=\"34\" rx=\"3\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"115\" y=\"91\" text-anchor=\"middle\">機B</text><rect x=\"44\" y=\"130\" width=\"72\" height=\"20\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"80\" y=\"144\" text-anchor=\"middle\">倒片台</text><rect x=\"156\" y=\"96\" width=\"8\" height=\"26\" fill=\"#efe6d2\" stroke=\"#a3302a\" stroke-width=\"1.5\"/><text x=\"160\" y=\"136\" text-anchor=\"middle\" fill=\"#a3302a\" font-size=\"8.5\">內門</text><rect x=\"160\" y=\"32\" width=\"160\" height=\"150\" fill=\"none\" stroke=\"#2a2420\" stroke-width=\"1.5\"/><text x=\"240\" y=\"50\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"12\">經理辦公室</text><rect x=\"226\" y=\"66\" width=\"62\" height=\"28\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"257\" y=\"84\" text-anchor=\"middle\">辦公桌</text><rect x=\"290\" y=\"120\" width=\"22\" height=\"22\" fill=\"#2a2420\"/><text x=\"301\" y=\"155\" text-anchor=\"middle\" font-size=\"8.5\">保險箱</text><rect x=\"316\" y=\"160\" width=\"8\" height=\"18\" fill=\"#efe6d2\" stroke=\"#2a2420\"/><text x=\"300\" y=\"176\" text-anchor=\"end\" font-size=\"8.5\">側門→</text><rect x=\"20\" y=\"182\" width=\"300\" height=\"40\" fill=\"none\" stroke=\"#2a2420\" stroke-width=\"1\"/><text x=\"170\" y=\"206\" text-anchor=\"middle\">二樓走廊</text><rect x=\"70\" y=\"178\" width=\"24\" height=\"7\" fill=\"#efe6d2\" stroke=\"#2a2420\"/><text x=\"82\" y=\"176\" text-anchor=\"middle\" font-size=\"8\">門</text><rect x=\"210\" y=\"178\" width=\"24\" height=\"7\" fill=\"#efe6d2\" stroke=\"#2a2420\"/><text x=\"222\" y=\"176\" text-anchor=\"middle\" font-size=\"8\">門</text><g stroke=\"#2a2420\"><rect x=\"20\" y=\"230\" width=\"90\" height=\"50\" fill=\"none\"/><path d=\"M32 230v50M44 230v50M56 230v50M68 230v50M80 230v50M92 230v50\"/></g><text x=\"65\" y=\"308\" text-anchor=\"middle\" font-size=\"9\">前樓梯 → 一樓大廳、售票亭、廁所</text><g stroke=\"#2a2420\"><rect x=\"250\" y=\"230\" width=\"70\" height=\"50\" fill=\"none\"/><path d=\"M250 242h70M250 254h70M250 266h70\"/></g><text x=\"285\" y=\"308\" text-anchor=\"middle\" font-size=\"9\">後樓梯 → 後巷後門</text><text x=\"176\" y=\"250\" font-size=\"8.5\" fill=\"#6b5a48\">放映室 → 辦公室：約 4 公尺</text><text x=\"176\" y=\"263\" font-size=\"8.5\" fill=\"#6b5a48\">辦公室 → 前樓梯 → 大廳：約 40 秒</text><text x=\"176\" y=\"276\" font-size=\"8.5\" fill=\"#6b5a48\">辦公室 → 後巷：約 20 秒</text></svg><p class=\"small\">放映室與經理辦公室之間有內門相通；兩室各有一扇門通往二樓走廊。辦公室東側另有側門，經後樓梯直通後巷後門（需鑰匙）。一樓大廳有售票亭、打卡鐘、男女廁所。</p>"},{"id":"A7","role":"A","stage":2,"icon":"pen","title":"死者記事本 謄本","sub":"2005 年警方謄寫","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　證物謄本</div><h2>證物 E-07　死者記事本（三月份）謄本</h2></div><span class=\"tag\">謄本</span></div><p class=\"small\">記事本共 32 頁。<b>第 9 至 12 頁遭撕除</b>，僅餘裝訂處殘紙。以下為第 8、13 頁之謄寫。</p><table><tr><td style=\"width:16%\">3/2</td><td>張又來了。不賣就是不賣。</td></tr><tr><td>3/7</td><td>子翔又來要錢，給了一萬。跟他說這是最後一次。</td></tr><tr><td colspan=\"2\" style=\"text-align:center;color:#6b5a48\">（第 9–12 頁缺）</td></tr><tr><td>3/11</td><td>晚場　日報 121 張　我自己在後面數 163 人</td></tr><tr><td>3/14</td><td>散場後沒回家，在辦公室等。十二點多，後門有人。原來是他。</td></tr><tr><td>3/16</td><td>兩件事都對上了。二十二年，和六年。</td></tr><tr><td>3/18</td><td>今晚跟他講清楚。讓他自己把錢補回來，不然只好報警。</td></tr></table><div class=\"note\">原專案組研判：3/18 之「他」應指林子翔（3/7 要錢、3/18「把錢補回來」）。惟林子翔有牌友作證，未再追查。</div><div class=\"sig\">謄寫：刑事組　<span class=\"redact\">█████</span></div>"},{"id":"A8","role":"A","stage":2,"icon":"mic","title":"林王素月 筆錄","sub":"死者之妻・2005/3/21","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　調查筆錄</div><h2>關係人：林王素月（54 歲）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：保險箱密碼有誰知道？</p><p class=\"a\">答：只有我跟我先生。是我們結婚那天，月跟日，四個數字。他說這樣他一輩子都不會忘。</p><p class=\"q\">問：林先生有什麼生活習慣？</p><p class=\"a\">答：他的錶永遠撥快五分鐘，說做戲院的人不能遲到。我說過他好多次，他就是不改。</p><p class=\"q\">問：最近有什麼異狀？</p><p class=\"a\">答：晚上常常睡不著，說戲院裡有「內鬼」。我問是誰，他說：「不只一個。」等他確定了再講。</p><p class=\"q\">問：3 月 18 日晚上你在哪裡？</p><p class=\"a\">答：在大天后宮幫忙準備進香，十一點多才回家。</p><p class=\"q\">問：你覺得子翔有可能嗎？</p><p class=\"a\">答：他不會的。他只是愛玩，不懂事。</p>"},{"id":"A9","role":"A","stage":2,"icon":"folder","title":"戶籍、員工及保險資料","sub":"資料摘要","body":"<div class=\"hd\"><div><div class=\"org\">戶政事務所／南星大戲院人事資料／保險公司</div><h2>林家戶籍、員工及保險資料</h2></div><span class=\"tag\">摘要</span></div><p><b>林家戶籍</b></p><table><tr><th>關係</th><th>姓名</th><th>出生日期</th></tr><tr><td>戶長</td><td>林振邦</td><td>1946/10/2</td></tr><tr><td>配偶</td><td>林王素月</td><td>1950/9/3</td></tr><tr><td>長子（獨子）</td><td>林子翔</td><td>1977/6/11</td></tr></table><p><b>戲院員工（2005 年 3 月）</b></p><table><tr><th>姓名</th><th>職務</th><th>到職</th></tr><tr><td>吳永福</td><td>放映師</td><td>1983 年 1 月</td></tr><tr><td>陳美玲</td><td>售票員兼對帳</td><td>1999 年 4 月</td></tr><tr><td>郭秀琴</td><td>清潔員</td><td>1995 年 8 月</td></tr></table><p><b>壽險保單</b>：2004 年 8 月投保，被保險人林振邦，保額 500 萬元，受益人林王素月。</p>"},{"id":"B6","role":"B","stage":2,"icon":"note","title":"觀眾意見卡 ×3","sub":"戲院意見箱・3/19 回收","body":"<div class=\"hd\"><div><div class=\"org\">南星大戲院　觀眾意見箱（清潔員 3/19 早上回收）</div><h2>觀眾意見卡</h2></div><span class=\"tag\">原件</span></div><div class=\"photo\"><span class=\"hand\">晚場十點半左右，畫面突然黑掉，等了快四分鐘才又出來，結果一出來竟然是結局！男女主角在碼頭告別！放了一下又黑掉，再出來又變回中間的劇情。有夠扯，退錢！！</span></div><div class=\"photo\" style=\"transform:rotate(1.2deg)\"><span class=\"hand\">放映師是睡著了嗎？中間黑掉好久，大家都在吹口哨。結果拖到十一點二十才散場，末班公車都沒了。</span></div><div class=\"photo\"><span class=\"hand\">十點二十分左右畫面一直糊糊的，我回頭看放映窗口，放映師一直站在窗口邊轉鏡頭，轉了好幾分鐘，人都沒離開。我看錶，快十點半才終於清楚，結果清楚沒多久就黑掉了。服務真差。（坐最後一排）</span></div>"},{"id":"B7","role":"B","stage":2,"icon":"reel","title":"放映室物品清點表","sub":"2005/3/19・依例清點","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　刑事組</div><h2>放映室物品清點表（依例清點，未採證）</h2></div><span class=\"tag\">清點</span></div><table><tr><th>品項</th><th>數量</th><th>備註</th></tr><tr><td>35mm 放映機</td><td>2</td><td>A、B 機</td></tr><tr><td>倒片台</td><td>1</td><td></td></tr><tr><td>《雨港之戀》片盤</td><td>5</td><td>已收入片盒 1–5，<b>第 4、5 號片盒標籤對調</b></td></tr><tr><td>放映機防塵罩</td><td>2</td><td>深綠色帆布</td></tr><tr><td>菸灰缸</td><td>1</td><td>半滿</td></tr><tr><td>收音機</td><td>0</td><td>現場未見</td></tr><tr><td>內線電話</td><td>0</td><td>二樓電話僅設於辦公室</td></tr></table>"},{"id":"B8","role":"B","stage":2,"icon":"photo","title":"喜宴照片","sub":"張國輝提供・2005/3/22","body":"<div class=\"hd\"><div><div class=\"org\">證物 E-15　張國輝主動提供</div><h2>台南大飯店喜宴照片（2 張）</h2></div><span class=\"tag\">照片</span></div><div class=\"photo\"><span class=\"ts\">05 03 18　22:31</span><br><br>宴會廳主桌旁，張國輝舉杯向新人敬酒。</div><div class=\"photo\" style=\"transform:rotate(1deg)\"><span class=\"ts\">05 03 18　23:05</span><br><br>張國輝與新郎合照，手持紅包。</div><p>鑑識課確認相機時間誤差在 1 分鐘內。飯店經理證實張國輝約 23:30 離開。台南大飯店距南星大戲院車程約 25 分鐘。</p>"},{"id":"A10","role":"A","stage":3,"icon":"cash","title":"地下錢莊帳冊影本","sub":"2010 年另案扣押","body":"<div class=\"hd\"><div><div class=\"org\">臺南地檢署　另案扣押物（2010 年「金鑫當舖」案）</div><h2>帳冊影本（2005 年 3 月部分）</h2></div><span class=\"tag\">影本</span></div><table><tr><th>日期時間</th><th>姓名</th><th>摘要</th></tr><tr><td>3/05</td><td>林子翔</td><td>催收。本利 125,000。</td></tr><tr><td>3/12</td><td>林子翔</td><td>展延一週。</td></tr><tr><td>3/19 00:40</td><td>林子翔</td><td>還款 <b>60,000</b>（現金，鈔票纏「南星」點鈔紙帶）。尚欠 65,000。</td></tr></table>"},{"id":"A11","role":"A","stage":3,"icon":"reel","title":"盜版光碟工廠帳冊","sub":"2005/5 安南區查獲","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　保安大隊（2005 年 5 月）</div><h2>安南區盜版光碟工廠　扣押帳冊（節錄）</h2></div><span class=\"tag\">節錄</span></div><table><tr><th>日期</th><th>片名</th><th>母帶來源</th><th>付款</th></tr><tr><td>2004/11/20</td><td>（外片）</td><td>戲院 F</td><td>25,000</td></tr><tr><td>2005/1/15</td><td>（外片）</td><td>戲院 F</td><td>25,000</td></tr><tr><td>2005/3/08</td><td>雨港之戀</td><td>戲院 F</td><td>30,000</td></tr></table><p class=\"hand\">備註：F 只收現金，半夜十二點後在戲院後門交貨，交完拷貝當天早上就要拿回去。</p>"},{"id":"A12","role":"A","stage":3,"icon":"mic","title":"郭秀琴 2026 訪談","sub":"清潔員","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：郭秀琴（77 歲，前清潔員）</h2></div><span class=\"tag\">新事證</span></div><p class=\"q\">問：3 月 19 日早上的情形？</p><p class=\"a\">答：我八點到，先掃一樓，八點四十才上二樓，才看到老闆。</p><p class=\"q\">問：一樓有什麼不尋常？</p><p class=\"a\">答：一樓女廁的洗手台有淡淡的紅色水漬，排水孔卡著一個十塊錢硬幣。我以為是誰流鼻血，就擦掉了，十塊錢我放進零錢罐。後來警察只問二樓，我也沒想到要講。</p><p class=\"q\">問：晚上誰會用一樓女廁？</p><p class=\"a\">答：晚場的時候，就美玲跟女客人。</p><p class=\"q\">問：辦公室裡你有碰任何東西嗎？</p><p class=\"a\">答：沒有，我看到老闆就跑下樓打電話了。</p>"},{"id":"A13","role":"A","stage":3,"icon":"mic","title":"大天后宮委員 證詞","sub":"2026 年","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：大天后宮進香團委員 蔡○○</h2></div><span class=\"tag\">新事證</span></div><p>3 月 18 日晚上 7 點到 11 點零五分，林王素月和十多位信眾一起在廟裡摺金紙、準備隔天進香的物品，中間沒有離開過，大家一起吃了點心。她 11 點零五分和兩位委員一起搭計程車離開。</p>"},{"id":"A14","role":"A","stage":3,"icon":"cash","title":"售票日報表","sub":"2005 年 3 月・陳美玲製表","body":"<div class=\"hd\"><div><div class=\"org\">南星大戲院</div><h2>晚場售票日報表（節錄）</h2></div><span class=\"tag\">日報</span></div><table><tr><th>日期</th><th>起始票號</th><th>終止票號</th><th>張數</th><th>金額</th></tr><tr><td>3/11</td><td>003655</td><td>003775</td><td>121</td><td>24,200</td></tr><tr><td>3/14</td><td>003902</td><td>004018</td><td>117</td><td>23,400</td></tr><tr><td>3/18</td><td>004101</td><td>004218</td><td>118</td><td>23,600</td></tr></table><p class=\"small\">備註：票卷由售票員保管，依票號順序撕售。觀眾入場時由驗票員撕下<b>副券</b>，副券未撕之票即未入場使用。製表：陳美玲。</p>"},{"id":"B9","role":"B","stage":3,"icon":"pen","title":"記事本原件翻拍","sub":"2026 年重新拍攝","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組</div><h2>證物 E-07　死者記事本　第 13 頁原件翻拍</h2></div><span class=\"tag\">新事證</span></div><figure class=\"ev\"><svg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Serif TC,serif\">\n<rect width=\"400\" height=\"300\" fill=\"#2a231d\"/>\n<rect x=\"18\" y=\"10\" width=\"370\" height=\"282\" fill=\"#f2ead6\"/>\n<g stroke=\"#b9c8de\" stroke-width=\".7\"><path d=\"M30 34H380\"/><path d=\"M30 50H380\"/><path d=\"M30 66H380\"/><path d=\"M30 82H380\"/><path d=\"M30 98H380\"/><path d=\"M30 114H380\"/><path d=\"M30 130H380\"/><path d=\"M30 146H380\"/><path d=\"M30 162H380\"/><path d=\"M30 178H380\"/><path d=\"M30 194H380\"/><path d=\"M30 210H380\"/><path d=\"M30 226H380\"/><path d=\"M30 242H380\"/><path d=\"M30 258H380\"/><path d=\"M30 274H380\"/></g>\n<path d=\"M60 14V288\" stroke=\"#e3a9a3\" stroke-width=\".8\"/>\n<g fill=\"#efe6d2\" stroke=\"#c9bda3\" stroke-width=\".5\">\n<path d=\"M6 30l12 0 0 52-12 0 3-6-3-6 4-7-4-8 3-6-3-8 3-6z\"/><path d=\"M6 92l12 0 0 50-12 0 4-7-4-6 3-8-3-7 4-6-4-8 3-8z\"/>\n<path d=\"M6 152l12 0 0 52-12 0 3-7-3-6 4-7-4-8 3-6-3-9 3-5z\"/><path d=\"M6 214l12 0 0 50-12 0 4-6-4-8 3-7-3-6 4-8-4-7 3-8z\"/></g>\n<text x=\"372\" y=\"22\" text-anchor=\"end\" font-size=\"4\" fill=\"#8a7a66\">13</text>\n<g font-size=\"7.2\" fill=\"#1e2f5c\">\n<text x=\"34\" y=\"45\">3/11</text><text x=\"66\" y=\"45\">晚場　日報 121 張</text>\n<text x=\"66\" y=\"61\">我自己在後面數　163 人</text>\n<text x=\"34\" y=\"93\">3/14</text><text x=\"66\" y=\"93\">散場後沒回家，在辦公室等。</text>\n<text x=\"66\" y=\"109\">十二點多，後門有人。原來是他。</text>\n<text x=\"34\" y=\"141\">3/16</text><text x=\"66\" y=\"141\">兩件事都對上了。</text>\n<text x=\"66\" y=\"157\">二十二年，和六年。</text>\n<text x=\"34\" y=\"189\">3/18</text><text x=\"66\" y=\"189\">今晚跟她講清楚。</text>\n<text x=\"66\" y=\"205\">讓她自己把錢補回來，</text>\n<text x=\"66\" y=\"221\">不然只好報警。</text>\n</g>\n<path d=\"M150 196q30 4 52-2\" stroke=\"#1e2f5c\" stroke-width=\".5\" fill=\"none\"/>\n</svg><figcaption>第 13 頁。左側為裝訂處。<span>🔍 點擊放大</span></figcaption></figure><p class=\"small\">2005 年警方曾謄寫為文字稿，原件自此未再調閱。</p>"},{"id":"B10","role":"B","stage":3,"icon":"finger","title":"2026 傷口重新判讀","sub":"法醫研究所","body":"<div class=\"hd\"><div><div class=\"org\">法務部法醫研究所（2026 年）</div><h2>致命傷照片重新判讀</h2></div><span class=\"tag\">新事證</span></div><p>依 2005 年解剖照片高解析掃描重新判讀：</p><p>類圓形表皮剝脫直徑 <b>26 mm</b>，邊緣平行短紋間距約 0.5 mm，<b>與新台幣十元硬幣邊緣的齒紋相符</b>，且多枚重疊。</p><p><b>意見：</b>致傷物研判為「<b>裝有大量硬幣之軟質袋狀物</b>」，揮擊時硬幣隔著布料在皮膚上留下壓痕。此類物品無固定形狀，可攜離現場。</p>"},{"id":"B11","role":"B","stage":3,"icon":"cash","title":"銀行提款紀錄","sub":"2005/3/18","body":"<div class=\"hd\"><div><div class=\"org\">台南第一銀行　交易明細（調閱）</div><h2>林振邦帳戶　2005/3/18</h2></div><span class=\"tag\">明細</span></div><table><tr><th>時間</th><th>摘要</th><th>金額</th></tr><tr><td>14:10</td><td>臨櫃提款</td><td>62,000</td></tr></table><p>行員記得林振邦說：「明天要付片租，放在戲院保險箱比較方便。」</p>"},{"id":"B12","role":"B","stage":3,"icon":"mic","title":"陳凱文 2026 訪談","sub":"林子翔牌友","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：陳凱文（49 歲）</h2></div><span class=\"tag\">新事證</span></div><p class=\"q\">問：那天晚上林子翔一直在你家嗎？</p><p class=\"a\">答：沒有啦，當年我幫他圓了一下。他大概十點半說要出去一下，騎機車走的。</p><p class=\"q\">問：從你家到南星要多久？</p><p class=\"a\">答：我家在安平，那天下雨，騎再快也要十五、二十分鐘。</p><p class=\"q\">問：他幾點回來？</p><p class=\"a\">答：快一點。回來以後輸錢照付，很爽快，平常都要欠。</p>"},{"id":"B13","role":"B","stage":3,"icon":"photo","title":"證物 E-05 手錶","sub":"2005 年拍攝","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　鑑識課</div><h2>證物 E-05　死者左腕手錶</h2></div><span class=\"tag\">照片</span></div><figure class=\"ev\"><svg viewBox=\"0 0 300 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Serif TC,serif\">\n<rect width=\"300\" height=\"300\" fill=\"#2b2622\"/>\n<rect x=\"118\" y=\"0\" width=\"64\" height=\"70\" fill=\"#4a3424\"/><rect x=\"118\" y=\"230\" width=\"64\" height=\"70\" fill=\"#4a3424\"/>\n<circle cx=\"150\" cy=\"150\ oke-linecap=\"round\"/>\n<circle cx=\"150\" cy=\"150\" r=\"4\" fill=\"#1d1a16\"/>\n<path fill=\"none\" d=\"M90 96L150 150L232 118M150 150L122 236M150 150L76 176M150 150L196 214\" stroke=\"#fff\" stroke-width=\"1.2\" opacity=\".75\"/>\n<path fill=\"none\" d=\"M90 96L150 150L232 118M150 150L122 236M150 150L76 176M150 150L196 214\" stroke=\"#8a8478\" stroke-width=\".5\"/>\n<rect x=\"10\" y=\"262\" width=\"62\" height=\"26\" fill=\"#efe6d2\" transform=\"rotate(-6 41 275)\"/><text x=\"41\" y=\"279\" text-anchor=\"middle\" font-size=\"11\" fill=\"#a3302a\" transform=\"rotate(-6 41 275)\">E-05</text>\n</svg><figcaption>玻璃破裂，指針停止，日期窗顯示 18。<span>🔍 點擊放大</span></figcaption></figure><p class=\"small\">機芯經檢查無故障，研判因撞擊停止。</p>"},{"id":"A15","role":"A","stage":4,"icon":"note","title":"2026 年 9 月新聞剪報","sub":"中華日報","body":"<div class=\"hd\"><div><div class=\"org\">中華日報　2026 年 9 月 22 日　地方版</div><h2>市警局重啟二十件懸案　DNA 重驗年底送件</h2></div><span class=\"tag\">剪報</span></div><p>市警局宣布成立舊案重啟小組，將保存證物以新技術重新檢驗。名單包括 2005 年南星大戲院負責人命案，相關證物預計十二月送驗。</p>"},{"id":"A16","role":"A","stage":4,"icon":"folder","title":"吳永福 近況","sub":"2026 年","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組</div><h2>關係人現況</h2></div><span class=\"tag\">摘要</span></div><p>吳永福，66 歲。2026 年 8 月確診肺癌末期，現住安寧病房。院方表示，今年 9 月起有一位女性訪客來過三次，登記姓名「陳小姐」。</p>"},{"id":"B14","role":"B","stage":4,"icon":"photo","title":"匿名信所附票券鑑識","sub":"2026 年","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>匿名信所附電影票　鑑識報告</h2></div><span class=\"tag\">新事證</span></div><figure class=\"ev\"><svg viewBox=\"0 0 400 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Serif TC,serif\">\n<rect width=\"400\" height=\"170\" fill=\"#2a231d\"/>\n<rect x=\"12\" y=\"14\" width=\"290\" height=\"142\" fill=\"#e8dcbf\" stroke=\"#9b8a68\"/>\n<rect x=\"302\" y=\"14\" width=\"86\" height=\"142\" fill=\"#e2d5b6\" stroke=\"#9b8a68\"/>\n<path d=\"M302 16V154\" stroke=\"#7b6b4c\" stroke-dasharray=\"2 2.4\"/>\n<rect x=\"20\" y=\"22\" width=\"274\" height=\"126\" fill=\"none\" stroke=\"#a3302a\" stroke-width=\".8\"/>\n<text x=\"157\" y=\"48\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#5a2a20\" letter-spacing=\"3\">南星大戲院</text>\n<text x=\"157\" y=\"68\" text-anchor=\"middle\" font-size=\"10\" fill=\"#3b2e22\">雨港之戀　晚場 21:30</text>\n<text x=\"40\" y=\"96\" font-size=\"11\" fill=\"#2a2420\">樓下　G 排　7 號</text>\n<text x=\"40\" y=\"116\" font-size=\"8\" fill=\"#2a2420\">全票　200 元</text>\n<g transform=\"rotate(-14 238 108)\"><circle cx=\"238\" cy=\"108\" r=\"22\" fill=\"none\" stroke=\"#b0453b\" stroke-width=\"1.6\"/><text x=\"238\" y=\"111\" text-anchor=\"middle\" font-size=\"8\" fill=\"#b0453b\">94.3.18</text></g>\n<text x=\"290\" y=\"144\" text-anchor=\"end\" font-size=\"3.3\" fill=\"#3b2e22\">No. 004219</text>\n<text x=\"345\" y=\"44\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a2a20\">副　券</text>\n<text x=\"345\" y=\"66\" text-anchor=\"middle\" font-size=\"7\" fill=\"#3b2e22\">雨港之戀</text>\n<text x=\"345\" y=\"82\" text-anchor=\"middle\" font-size=\"7\" fill=\"#3b2e22\">G-7</text>\n<text x=\"345\" y=\"140\" text-anchor=\"middle\" font-size=\"3.3\" fill=\"#3b2e22\">No. 004219　入場時撕下</text>\n</svg><figcaption>匿名信附件：電影票一張（正面）<span>🔍 點擊放大</span></figcaption></figure><p>紙質、印刷與 2005 年南星大戲院票卷相符。表面經擦拭，無可用指紋。日期章為手蓋。<b>副券完整，未經撕除。</b></p>"},{"id":"B15","role":"B","stage":4,"icon":"folder","title":"南星結束營業清點表","sub":"2006 年","body":"<div class=\"hd\"><div><div class=\"org\">南星大戲院</div><h2>結束營業財產清點表（節錄）</h2></div><span class=\"tag\">清點</span></div><p>2005/3/19 起停業三週，4 月由林王素月接手經營，2006 年 6 月結束營業。</p><table><tr><th>品項</th><th>數量</th><th>處置</th></tr><tr><td>放映機</td><td>2</td><td>出售</td></tr><tr><td>座椅</td><td>412</td><td>報廢</td></tr><tr><td>剩餘空白票卷</td><td>3 捲</td><td>由售票員陳美玲帶回保管</td></tr></table>"},{"id":"X1","role":"S","stage":1,"lock":"x1","icon":"mic","title":"吳永福 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄（安寧病房）</div><h2>關係人：吳永福（66 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：記事本少了四頁。</p><p class=\"a\">答：是我撕的。那幾頁寫的是我。光碟的事，後門的事。</p><p class=\"q\">問：什麼時候撕的？</p><p class=\"a\">答：（很久）十點二十幾分。片子糊了，我在窗口調焦距，內門那邊有人在吵，一男一女。老闆的聲音我認得。女的……聽不清楚是誰，很尖。然後碰一聲，很重，就沒聲音了。</p><p class=\"q\">問：然後呢？</p><p class=\"a\">答：我把焦距調好，看錶，十點二十八。想說過去看一眼，一分鐘就回來。我推開內門，老闆趴在地上，頭後面都是血，叫他沒反應。桌上攤著那本記事本，旁邊是那片光碟。我腦子一片空白，只想到不能讓人看到那幾頁。</p><p class=\"q\">問：你看到那個女人了嗎？</p><p class=\"a\">答：沒有。走廊那扇門開著一條縫，在晃。</p><p class=\"q\">問：為什麼說 23:12 看到他？</p><p class=\"a\">答：我錯過換盤，整個銀幕黑掉，手抖到裝錯片盤。如果大家知道老闆十點半就死了，第一個被懷疑的就是不在機器旁邊的我。所以我說他十一點還活著。</p><p class=\"q\">問：為什麼不報警？</p><p class=\"a\">答：我怕。我做的那些事……我那時候兩個孩子還在念書。</p>"},{"id":"X2","role":"S","stage":1,"lock":"x2","icon":"mic","title":"林子翔 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：林子翔（49 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：錢莊帳冊上，3/19 凌晨你還了六萬。</p><p class=\"a\">答：……是保險箱的錢。</p><p class=\"q\">問：說吧。</p><p class=\"a\">答：那天十點半我從阿凱家騎車出來，想再跟我爸要一次。差不多十點五十五分從後門上去，辦公室燈亮著，我爸趴在地上，血都快乾了。……我用密碼打開保險箱。</p><p class=\"q\">問：你怎麼知道密碼？</p><p class=\"a\">答：我媽以前說過是結婚紀念日。辦公室牆上那張結婚照，下面就寫著日期。</p><p class=\"q\">問：桌上有沒有一個票款袋？</p><p class=\"a\">答：沒有。桌上只有文件跟菸灰缸。如果有錢袋，我那時候一定也會拿，我就是那種人。</p><p class=\"q\">問：你有看到什麼人嗎？</p><p class=\"a\">答：沒有。地上靠桌腳那邊有個十塊錢，我沒撿。我記得很清楚，因為我想，連十塊錢我都不配撿。</p>"},{"id":"X3","role":"S","stage":1,"lock":"x3","icon":"mic","title":"陳美玲 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：陳美玲（55 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：3 月 11 日，林老闆站在你後面看了一整場。</p><p class=\"a\">答：他是在數人頭吧。</p><p class=\"q\">問：日報寫 121 張，他數到 163 人。</p><p class=\"a\">答：有人沒買票混進來，常有的事。</p><p class=\"q\">問：3 月 18 日晚上，你上二樓的時候，老闆在不在辦公室？</p><p class=\"a\">答：（停頓）……在。他叫我坐下，說要對帳。我說要趕公車，把錢袋放在桌上就走了。我走的時候他好好的。</p><p class=\"q\">問：你在 2005 年說辦公室沒有人。</p><p class=\"a\">答：我那時候嚇壞了，不想被扯進去。</p><p class=\"q\">問：你們談了什麼？</p><p class=\"a\">答：就帳的事。我說我沒有，他說他要再查。我十點三十三分就打卡了，你們可以去查。</p>"},{"id":"X4","role":"S","stage":1,"lock":"x4","icon":"mic","title":"林王素月 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：林王素月（75 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：這是林先生的字嗎？</p><p class=\"a\">答：是。他寫字很用力，女字旁那一撇特別長。</p><p class=\"q\">問：他說戲院裡有內鬼，「不只一個」。</p><p class=\"a\">答：他後來跟我講過一句：「一個做了二十幾年，一個是女人家，我都不忍心。」我以為他在說同事家裡有困難。</p><p class=\"q\">問：當年為什麼沒說？</p><p class=\"a\">答：警察只問我密碼，還有子翔。</p>"}],"suspects":[{"id":"wu","name":"吳永福","desc":"前放映師，66 歲。肺癌末期，住在安寧病房。","deflect":["這跟那天晚上有什麼關係？","我能說的，二十年前都說了。","（他閉上眼睛，沒有回答。）"]},{"id":"chen","name":"陳美玲","desc":"前售票員，55 歲。在市場賣碗粿。","deflect":["這個我不懂啦。","我只是賣票的，樓上的事我不清楚。","你們去問阿福比較快。"]},{"id":"son","name":"林子翔","desc":"死者獨子，49 歲。在高雄開計程車。","deflect":["這個我不清楚。","你們又要懷疑我了嗎？","我爸的事……我真的不想再講。"]},{"id":"zhang","name":"張國輝","desc":"建商，73 歲。2008 年買下戲院土地，至今沒有開發。","deflect":["我的律師說，這種問題不用回答。","我人在喜宴，一百多個人看到。","年輕人，辦案要講證據。"]},{"id":"wife","name":"林王素月","desc":"死者遺孀，75 歲。獨居在戲院附近的老家。","deflect":["這個我看不懂。","我先生的事，我知道的都說了。","（她搖搖頭。）"]}],"bts":[{"id":"x1","sus":"wu","docs":["B9","A11"],"minGate":2,"code":"4471","reply":"他看著那幾條撕剩的紙邊，很久沒有說話。「……那四頁，是我撕的。」"},{"id":"x2","sus":"son","docs":["A10","B11"],"minGate":2,"code":"2706","reply":"他看了一眼數字，整個人垮在椅子上。「六萬二，我還了六萬。……剩下的兩千，我買了菸。」"},{"id":"x3","sus":"chen","docs":["B9","A14"],"minGate":2,"code":"8153","reply":"她盯著那頁的字，過了很久才開口。「……老闆那天，是有叫我進去講話。」"},{"id":"x4","sus":"wife","docs":["B9"],"minGate":2,"code":"6620","reply":"她把照片拿近，摀住了嘴。「……是女字旁。」"}],"gates":[{"q":"吳永福說林老闆 23:12 還活著。依照現有資料，林振邦<b>最晚在幾點以前</b>就已經死亡？（四位數，24 小時制，例如 2315）","hints":["2026 年的補充鑑定，是以某個時間點為基準推算的。","有人記得他那晚最後吃東西的情形。注意他「來的時間」和「吃了多久」不一樣。","先找出他吃完的時間，再套用鑑定的上限。"],"ok":"林老闆在 22:40 以前就已經死了。","h":["848136ac"]},{"q":"保險箱沒有被撬開，是用正確密碼打開的。<b>四位數密碼</b>是什麼？","hints":["密碼的規則，死者的妻子說過。","那個日期沒有寫在任何一份文字資料裡。","現場照片的牆上有一樣東西，放大看看。"],"ok":"保險箱是用結婚紀念日打開的。","h":["b6240435"]},{"q":"林振邦<b>遭到攻擊</b>的時間是幾點幾分？（四位數）","hints":["撞擊讓某樣東西停了下來。","那樣東西顯示的時間，不是真正的時間。","死者的妻子提過他的一個生活習慣。"],"ok":"22:24。手錶停在 22:29，而他的錶永遠快五分鐘。","h":["f94ad8e4"]},{"q":"假設匿名信那張票，是 3 月 18 日晚場那捲票接著撕下來的，它是當晚的<b>第幾張</b>？","hints":["票號很小，要放大才看得到。","當晚第一張票的號碼，在售票日報表上。","從起始票號開始數，起始那張算第 1 張。"],"ok":"第 119 張。日報上，那晚只賣了 118 張。這張票從來沒有賣出去，也從來沒有入場。","h":["3eb719f0"]}],"final":[{"k":"q1","l":"一、殺害林振邦的兇手是？","o":[["wu","吳永福（放映師）"],["chen","陳美玲（售票員）"],["son","林子翔（獨子）"],["zhang","張國輝（建商）"],["wife","林王素月（妻）"]],"h":["c5b1a05f"]},{"k":"q2","l":"二、凶器是？","o":[["reel","放映用的鋁製片盤"],["ash","辦公室的菸灰缸"],["bag","裝著大量硬幣的票款袋"],["safe","保險箱的門"],["stop","鐵製門擋"]],"h":["32661552"]},{"k":"q3","l":"三、行兇地點是？","o":[["office","二樓經理辦公室"],["booth","放映室"],["hall","一樓大廳"],["alley","後巷"]],"h":["2250f771"]},{"k":"q4","t":"num","l":"四、林振邦遭到攻擊的時間（四位數，24 小時制）","ph":"例如 2215","h":["b0558408"]},{"k":"q5","l":"五、打開保險箱、拿走箱內現金的人是？","o":[["son","林子翔"],["chen","陳美玲"],["wu","吳永福"],["wife","林王素月"],["robber","外來的強盜"]],"h":["52ee69b9"]},{"k":"q6","l":"六、22:30 銀幕變黑，是因為？","o":[["kill","吳永福離開放映室去辦公室行兇"],["check","吳永福聽到聲響過去查看，並拿走與自己有關的證據"],["broke","放映機故障"],["power","陳美玲關掉了電源"]],"h":["b30b97a0"]},{"k":"q7","l":"七、吳永福謊稱 23:12 見到老闆，是為了？","o":[["cover","掩護陳美玲"],["hide","讓人以為老闆死在他下班以後，掩蓋自己進過辦公室、拿走盜版證據"],["killer","掩飾自己就是兇手"],["mistake","他只是記錯時間"]],"h":["27bf55f9"]},{"k":"q8","l":"八、兇手的動機是？","o":[["piracy","盜拷影片的事被揭穿"],["skim","長期少報票款被發現，老闆要她補錢否則報警"],["money","繼承遺產、還清債務"],["land","戲院土地交易受阻"]],"h":["387d32de"]},{"k":"q9","l":"九、匿名信是誰寄的？為什麼？","o":[["chen","陳美玲：怕即將重驗證物、吳永福臨終說出那晚聽到的事，想先把嫌疑引向放映室"],["wu","吳永福：想在死前自首"],["son","林子翔：良心不安"],["wife","林王素月：想知道真相"]],"h":["30976307"]}],"confront":{"who":"陳美玲","title":"對質","intro":"<p>結案報告送出了。</p><p>陳美玲同意再談一次。她坐得很直，雙手放在桌上，看起來比二十一年前更鎮定。</p><p>她會一句一句否認。兩組卷宗已經合併，用證物拆掉她的每一句話。</p>","fail":["「這能證明什麼？」","「你們年輕人，辦案不能用猜的。」","「（她搖頭）這跟我講的話沒有關係。」"],"rounds":[{"say":"我十點二十分上去的時候，老闆好好的。我把錢袋放在桌上就下樓了，後來誰拿走了，我怎麼知道。","docs":["X2","A10","B11"],"hint":"錢袋如果真的留在桌上，最後是誰拿走的？算一算每個人手上的錢。","ok":"「……那一定還有別人進去過。強盜、子翔，誰都有可能。」"},{"say":"我在樓上的時候，放映室那邊有人在大聲講話。說不定是阿福在跟老闆吵架，誰知道。","docs":["X1","B6","A1","B7"],"hint":"那幾分鐘，放映師在哪裡、在做什麼？有人一直看著。","ok":"（她的手指絞在一起。）「我只是說我聽到的。」"},{"say":"就算我在辦公室多待了一下。我一個女人，拿什麼打死一個男人？你們連凶器都沒找到。","docs":["B10","B3","A12"],"hint":"她那天晚上，手上本來就提著一樣很重的東西。","ok":"「……那袋零錢有三公斤重。」她說得很小聲，像在自言自語。"},{"say":"我在南星做了六年，老闆待我很好。我有什麼理由？","docs":["B9","A14","X4"],"hint":"記事本上寫的，到底是「他」還是「她」？","ok":"「我女兒那年要開刀……我只是先借，我本來都會補回去的。他說要報警。我只是想讓他別說了。」"},{"say":"那封信不是我寄的。我為什麼要自己把案子翻出來？","docs":["B14","B15","A16","A15"],"hint":"那張票的副券從來沒撕過。誰手上會有整捲沒賣完的票？","ok":"（很久）「阿福快死了。我去看過他三次，他一直說那天聽到一個女人在吵。我怕他死前講出來。你們要重驗證物……我想，如果你們先去查放映室……」她沒有說完。"}]},"ending":"CjxwPjxiPuWFh+aJi++8mumZs+e+jueOsu+8iOWUruelqOWToe+8ieOAguWHtuWZqO+8muijneiRl+ehrOW5o+eahOelqOasvuiii+OAguWcsOm7nu+8mue2k+eQhui+puWFrOWupOOAgjwvYj48L3A+CjxwPjxiPuWLleapnzwvYj7jgIDpmbPnvo7njrLlnKjljZfmmJ/lgZrkuoblha3lubTvvIzplbfmnJ/lsJHloLHmmZrloLTnpajmlbjjgIIzIOaciCAxMSDml6XmnpfmjK/pgqbnq5nlnKjllK7npajkuq3lvozpnaLmlbjkurrpoK3vvJrml6XloLEgMTIxIOW8te+8jOWvpumamyAxNjMg5Lq644CC5LuW5Zyo6KiY5LqL5pys5a+r5LiL44CM5YWp5Lu25LqL44CN77ya5LiA5Lu25piv5YGa5LqG5LqM5Y2B5LqM5bm055qE5ZCz5rC456aP55uc5ou35b2x54mH77yM5LiA5Lu25piv5YGa5LqG5YWt5bm055qE6Zmz576O546y5L615Y2g56Wo5qy+44CC6K2m5pa555qE6KyE5pys5oqK44CM5aW544CN5oqE5oiQ5LqG44CM5LuW44CN44CCPC9wPgo8cD48Yj4yMjoyMDwvYj7jgIDlpbnmj5DokZfkuInlhazmlqTph43nmoTnpajmrL7ooovkuIrmqJPjgILmnpfmjK/pgqblnKjovqblhazlrqTnrYnlpbnvvIzopoHlpbnmiorpjKLoo5zlm57kvobvvIzlkKbliYfloLHorabjgILlhankurrniK3lkLXvvIzlkLPmsLjnpo/lnKjpmpTlo4HkuIDpgoroqr/nhKbot53kuIDpgorogb3opovjgII8L3A+CjxwPjxiPjIyOjI0PC9iPuOAgOael+aMr+mCpui9iei6q+imgeWOu+aJk+mbu+ipse+8jOWlueaOhOi1t+elqOasvuiii+eguOWQkeS7lueahOW+jOiFpuOAguWNgeWFg+ehrOW5o+malOiRl+W4huW4g+eVmeS4i+S4gOWciOWciOm9kue0i+OAguS7luWAkuWcsOaZguaJi+mMtuaSnueiju+8jOWBnOWcqCAyMjoyOe+8jOWboOeCuuS7lueahOmMtuawuOmBoOW/q+S6lOWIhumQmOOAguS4gOaemuehrOW5o+a7vuWIsOS6huahjOiFs+mCiuOAgjwvcD4KPHA+PGI+MjI6MjXigJMyMjozMzwvYj7jgIDlpbnmj5DokZfooovlrZDlvp7otbDlu4rploDkuIvmqJPvvIzlnKjkuIDmqJPlpbPlu4HmtJfmiYvvvIjmjpLmsLTlrZTljaHkvY/kuIDmnprljYHlhYPvvInvvIwyMjozMyDmiZPljaHvvIzotbDljrvlhazou4rnq5nmmYLpgoTot5/purXmlKTogIHpl4bmj67kuobmiYvjgILlpbnoqqrpjKLooovnlZnlnKjmoYzkuIrvvIzmmK/ng
