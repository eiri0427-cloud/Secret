<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舊案重啟：雙人推理檔案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#13100e;--bg2:#1d1814;--line:#3a3029;--kraft:#c49a5c;--kraft2:#a77d43;--paper:#efe6d2;--ink:#2a2420;--red:#a3302a;--red2:#c8463c;--muted:#9d8f80}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#eadfce;font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button{font:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 104px}
.eyebrow{letter-spacing:.3em;font-size:12px;color:var(--kraft)}
.title{font-family:"Noto Serif TC",serif;font-weight:900;font-size:40px;line-height:1.15;margin:10px 0 6px;color:#e9d3a8;text-shadow:0 2px 0 #000}
.subtitle{color:var(--muted);font-size:13.5px;line-height:1.7}
.cover{padding:28px 0 8px;text-align:center}
.folder{position:relative;margin:22px auto 6px;width:70%;max-width:280px;aspect-ratio:3/4;background:linear-gradient(160deg,#cfa86b,#a67c42);border-radius:4px 14px 6px 6px;box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(80,50,20,.35);transform:rotate(-2deg);color:#3b2a18}
.folder:before{content:"";position:absolute;top:-14px;left:16px;width:40%;height:18px;background:#c09858;border-radius:6px 6px 0 0}
.folder .lab{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#efe3c8;padding:4px 12px;font-size:11px;letter-spacing:.15em;white-space:nowrap;border-radius:2px}
.folder .no{position:absolute;top:26%;width:100%;text-align:center;font-family:"Noto Serif TC",serif;font-weight:700;font-size:28px}
.folder .nm{position:absolute;top:40%;width:100%;text-align:center;font-family:"Noto Serif TC",serif;font-size:17px;letter-spacing:.2em;font-weight:700}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:"Noto Serif TC",serif;font-weight:900;padding:2px 12px;letter-spacing:.3em;transform:rotate(-8deg);opacity:.88}
.folder .s1{position:absolute;top:56%;left:22%;font-size:20px}
.folder .s2{position:absolute;top:70%;left:38%;font-size:12px;border-width:2px;transform:rotate(-4deg)}
.folder .meta{position:absolute;bottom:12px;width:100%;text-align:center;font-size:10px;letter-spacing:.08em;opacity:.8}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card h3{margin:0 0 8px;font-family:"Noto Serif TC",serif;color:#e9d3a8;font-size:17px}
.card p{margin:6px 0;color:#cfc2b0;font-size:14px;line-height:1.75}
/* home */
.case{display:flex;gap:14px;width:100%;text-align:left;background:linear-gradient(180deg,#261f19,#1e1814);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;color:#eadfce;align-items:stretch}
.case .mini{flex:0 0 74px;border-radius:3px 9px 4px 4px;background:linear-gradient(160deg,#cfa86b,#a67c42);color:#3b2a18;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Noto Serif TC",serif;transform:rotate(-2deg);box-shadow:0 6px 14px rgba(0,0,0,.5);padding:10px 0}
.case .mini b{font-size:22px}.case .mini i{font-style:normal;font-size:10px;letter-spacing:.2em}
.case .mini .stamp{font-size:10px;border-width:1.5px;padding:0 5px;margin-top:6px;letter-spacing:.15em}
.case h4{margin:0;font-family:"Noto Serif TC",serif;font-size:19px;color:#f0e2c6}
.case .s{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.case .tg{font-family:"Noto Serif TC",serif;font-size:13.5px;color:#d8c9a8;line-height:1.6}
.case .m{font-size:11.5px;color:var(--kraft);margin-top:8px}
.st{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.st.go{border-color:var(--kraft2);color:var(--kraft)}.st.done{border-color:#4d6b3f;color:#9fc48c}
.roles{display:grid;gap:10px;margin-top:10px}
.role{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:#241e19;border:1px solid var(--line);border-radius:12px;padding:14px;color:#eadfce}
.role .ic{flex:0 0 46px;height:46px;border-radius:10px;background:#2f261f;display:grid;place-items:center;color:var(--kraft)}
.role .ic svg{width:26px;height:26px}
.role b{display:block;font-size:16px;color:#f0e2c6}.role span span{font-size:12.5px;color:var(--muted)}
/* top */
.top{position:sticky;top:0;z-index:5;background:rgba(19,16,14,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;padding:10px 12px 8px;display:flex;align-items:center;gap:8px}
.top .bk{background:none;border:0;color:var(--muted);font-size:20px;padding:0 6px}
.top .t{font-family:"Noto Serif TC",serif;font-weight:700;color:#e9d3a8;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t small{display:block;font-family:"Noto Sans TC";font-weight:400;font-size:11px;color:var(--muted)}
.chip{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--kraft2);color:var(--kraft);white-space:nowrap}
.prog{display:flex;gap:6px;padding:0 16px 10px;max-width:560px;margin:0 auto}
.prog i{flex:1;height:4px;border-radius:4px;background:#3a3029}.prog i.on{background:var(--kraft)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#171310;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;color:var(--muted);padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px}
.tab.on{color:var(--kraft)}.tab svg{width:22px;height:22px}
.badge{display:inline-block;min-width:8px;height:8px;border-radius:8px;background:var(--red2);margin-left:2px;vertical-align:top}
.sect{margin:20px 0 8px;display:flex;align-items:center;gap:8px;color:var(--kraft);font-size:12.5px;letter-spacing:.12em}
.sect:after{content:"";flex:1;height:1px;background:var(--line)}
.doc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:linear-gradient(180deg,#2a221c,#231c17);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;color:#eadfce}
.doc .ic{flex:0 0 38px;height:38px;border-radius:8px;background:#efe6d2;color:#5a4330;display:grid;place-items:center}
.doc .ic svg{width:22px;height:22px}
.doc b{display:block;font-size:14.5px}.doc small{color:var(--muted);font-size:12px}
.doc .new{margin-left:auto;font-size:10px;color:#fff;background:var(--red);padding:2px 6px;border-radius:4px}
.doc.read{opacity:.78}.doc.bt .ic{background:#e7c9c4;color:#7a211c}
.locked{display:flex;gap:10px;align-items:center;border:1px dashed #4a3e34;border-radius:10px;padding:14px;color:var(--muted);font-size:13px;margin:8px 0}
.locked svg{width:22px;height:22px;flex:0 0 22px}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,4,3,.86);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:block}
.modal .close{position:sticky;top:10px;margin:10px 10px 0 auto;display:block;background:#2a221c;border:1px solid var(--line);color:#eadfce;border-radius:99px;padding:6px 14px;font-size:13px;z-index:2}
.paper{position:relative;max-width:540px;margin:10px auto 60px;background:var(--paper);color:var(--ink);padding:26px 20px 30px;border-radius:3px;box-shadow:0 20px 50px rgba(0,0,0,.7);font-family:"Noto Serif TC",serif;line-height:1.9;font-size:15px;background-image:radial-gradient(circle at 20% 10%,rgba(150,110,60,.10),transparent 40%),radial-gradient(circle at 80% 90%,rgba(150,110,60,.12),transparent 45%)}
.paper .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #2a2420;padding-bottom:8px;margin-bottom:14px;gap:8px}
.paper .hd .org{font-size:11px;letter-spacing:.15em;color:#6b5a48}
.paper .hd h2{margin:4px 0 0;font-size:20px;line-height:1.35}
.paper .tag{font-family:"Noto Sans TC",sans-serif;font-size:11px;border:1.5px solid var(--red);color:var(--red);padding:1px 6px;white-space:nowrap;transform:rotate(3deg)}
.paper p{margin:8px 0}.paper .q{font-weight:700;margin-top:12px}.paper .a{padding-left:1.2em;text-indent:-1.2em}
.paper .note{background:rgba(163,48,42,.08);border-left:3px solid var(--red);padding:8px 10px;font-size:13.5px;margin:12px 0}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
.paper td,.paper th{border:1px solid #8c7a66;padding:5px 6px;vertical-align:top;text-align:left}
.paper th{background:rgba(120,90,50,.12)}
.paper .hand{color:#1e3a6e;font-size:15.5px}
.paper .sig{text-align:right;color:#6b5a48;font-size:12px;margin-top:16px}
.paper .redact{background:#2a2420;color:#2a2420;border-radius:2px;padding:0 4px}
.paper .photo{background:#d9cfbb;border:6px solid #f7f2e6;box-shadow:0 3px 10px rgba(0,0,0,.25);padding:14px;font-size:13px;color:#4a3d30;margin:12px 0;transform:rotate(-1deg)}
.paper .photo .ts{font-family:monospace;color:#d0521e;font-weight:700;float:right}
.paper svg{max-width:100%;height:auto;display:block;margin:8px auto}
.paper hr{border:0;border-top:1px dashed #8c7a66;margin:16px 0}
.paper .small{color:#6b5a48}
.story{max-width:480px;margin:8vh auto 40px;padding:0 26px;font-family:"Noto Serif TC",serif;font-size:17px;line-height:2.1;color:#e9dcc4}
.story .ch{font-family:"Noto Sans TC";font-size:12px;letter-spacing:.3em;color:var(--kraft);margin-bottom:6px}
.story h2{font-size:30px;margin:0 0 22px;color:#e9d3a8}
.story p{margin:0 0 16px;opacity:0;animation:fi .9s forwards}
.story .hand{color:#b9cdf0}
@keyframes fi{to{opacity:1}}
.story .btn{margin-top:16px;width:100%;padding:14px;font-size:16px}
/* gates */
.gate{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.gate.done{border-color:#3d5132;background:#1a1f16}
.gate h4{margin:0 0 4px;font-size:12px;letter-spacing:.2em;color:var(--kraft)}
.gate .qq{font-family:"Noto Serif TC",serif;font-size:16px;line-height:1.7;color:#f0e2c6;margin:4px 0 12px}
.row{display:flex;gap:8px}
.inp{flex:1;min-width:0;background:#0f0c0a;border:1px solid #4a3e34;border-radius:10px;color:#f4e9d6;font-size:22px;letter-spacing:.35em;padding:10px 12px;text-align:center;font-family:monospace}
.inp.txt{letter-spacing:.1em;font-family:inherit;font-size:18px}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:none;border:1px solid var(--line);color:#cfc2b0;font-weight:400}
.btn.small{padding:6px 10px;font-size:12.5px}
.msg{font-size:13.5px;margin-top:10px;line-height:1.7}.msg.err{color:#e07a6e}.msg.ok{color:#9fc48c}
.hint{font-size:13px;color:#d8c9a8;background:#2b241d;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.7}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* suspects */
.sus{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.sus .hdr{display:flex;gap:12px;align-items:center}
.av{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:"Noto Serif TC",serif;font-weight:900;font-size:22px;color:#241a10;background:#c49a5c}
.sus b{font-size:16px;color:#f0e2c6}.sus .d{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:2px}
.sus .acts{display:flex;gap:8px;margin-top:12px;align-items:center}
.tagb{border:1px solid var(--line);background:none;color:var(--muted);border-radius:99px;padding:5px 12px;font-size:12.5px}
.tagb.t1{border-color:var(--red2);color:#f0a59c;background:rgba(163,48,42,.15)}.tagb.t2{border-color:#4d6b3f;color:#9fc48c;text-decoration:line-through}
.sheet{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.7);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .box{background:#1d1814;border-top:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;margin:0 auto;max-height:78vh;overflow:auto;padding:16px 16px 28px}
.sheet h3{margin:0 0 4px;font-family:"Noto Serif TC",serif;color:#e9d3a8;font-size:17px}
.fq{margin:16px 0}.fq .l{font-size:14.5px;color:#e9d3a8;margin-bottom:8px;font-family:"Noto Serif TC",serif;line-height:1.6}
.opts{display:grid;gap:7px}
.opt{text-align:left;background:#211b16;border:1px solid var(--line);color:#eadfce;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.opt.on{border-color:var(--kraft);background:#3a2d1f;color:#fff}
textarea{width:100%;min-height:58vh;background:#efe6d2;color:#2a2420;border:0;border-radius:6px;padding:14px;font-family:"Noto Serif TC",serif;font-size:15px;line-height:1.9;background-image:repeating-linear-gradient(transparent,transparent 27.5px,rgba(120,90,50,.25) 28.5px);background-attachment:local}
.small{font-size:12.5px;color:var(--muted);line-height:1.7}
.rank{text-align:center;padding:18px}
.rank .g{font-family:"Noto Serif TC",serif;font-weight:900;font-size:64px;color:#e9d3a8;line-height:1}
.rank .n{color:var(--kraft);letter-spacing:.2em;font-size:13px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.stats div{background:#241e19;border-radius:8px;padding:8px 2px;font-size:11px;color:var(--muted);text-align:center}
.stats b{display:block;font-size:16px;color:#f0e2c6}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:30;padding:20px}
.dialog.on{display:grid}
.dialog .box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:380px;width:100%}
.dialog .who{font-family:"Noto Serif TC",serif;color:var(--kraft);font-size:13px;margin-bottom:6px}
.say{min-height:1.9em}.dialog .say{font-family:"Noto Serif TC",serif;font-size:16px;line-height:1.9;color:#f0e2c6;margin:0 0 14px}
.code{font-family:monospace;font-size:26px;letter-spacing:.3em;color:#e9d3a8;text-align:center;background:#0f0c0a;border:1px dashed var(--kraft2);border-radius:10px;padding:8px;margin:8px 0 14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2f4426;color:#e8f3df;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.sy{font-size:12px;color:var(--muted);margin:12px 0 0;display:flex;align-items:center;gap:6px}.sy i{width:8px;height:8px;border-radius:8px;background:#6b5f54;flex:0 0 8px}.sy.on i{background:#7fb069}.sy.wait i{background:var(--kraft)}
ol.db{padding-left:1.3em;margin:6px 0;color:#cfc2b0;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><button class="close" id="mclose" onclick="closeDoc()">✕ 收起文件</button><div id="paper"></div></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="box" id="sheetBox"></div></div>
<div class="dialog" id="dlg"><div class="box" id="dlgBox"></div></div>
<div class="toast" id="toast"></div>
<script>
var CASES=[{"id":"c1","key":"oldcase01_v1","no":"01","title":"最後一場","sub":"2005 南星大戲院命案","kind":"謀殺案","diff":"★★★★☆","time":"約 2 小時","tagline":"那天晚上的電影，不是照順序放的。","chapters":["散場之後","密碼","黑畫面"],"prologue":"<p>2005 年 3 月 18 日，台南。</p><p>開了四十年的南星大戲院，放完最後一場《雨港之戀》。隔天早上，清潔員在二樓辦公室發現老闆林振邦倒在保險箱旁，錢不見了。</p><p>警方說，是散場後闖進來的強盜。沒有凶器，沒有嫌犯。兩年後，卷宗被收進地下室。</p><p>二十一年後，一張褪色的票根，寄到了你們桌上。</p>","chapterIntro":["<p>林振邦在 22:40 以前就已經死了。</p><p>那麼，23:12 走進放映室交代換片的那個「老闆」，是誰看到的？</p><p>整個強盜殺人的推論，只建立在一個人的一句話上。</p><p>新的卷宗送到了：戲院的平面圖、死者的記事本，還有一些當年沒人在意的東西。</p>","<p>0611。保險箱是被「知道密碼的人」打開的。</p><p>可是，開保險箱的人，和動手的人，一定是同一個嗎？</p><p>鑑識科送來了重新採證的結果，另外還有兩本帳冊。現在，可以去找當年的關係人當面談了。</p>","<p>22:30，換盤的那一刻，放映師不在放映機旁邊。</p><p>那四分鐘，他在哪裡？在做什麼？</p><p>所有的碎片都在桌上了。請兩位討論後，提交結案報告。</p>"],"docs":[{"id":"S0","role":"S","stage":1,"icon":"note","title":"調查委託信","sub":"2026 年・匿名來件","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組・收件紀錄</div><h2>調查委託</h2></div><span class=\"tag\">優先</span></div><p>2026 年 11 月，小組收到一個沒有寄件人的牛皮紙袋。裡面只有兩樣東西：</p><div class=\"photo\">一張褪色的電影票根：「南星大戲院　2005.03.18　21:30　雨港之戀　樓下 G 排 7 號」</div><p>以及一張手寫紙條：</p><p class=\"hand\">「那天晚上的電影，不是照順序放的。<br>答案一直都在放映室。」</p><div class=\"note\"><b>任務說明</b><br>你們兩人分屬<b>證詞組</b>與<b>鑑識組</b>，各自只拿到一半卷宗。<br>請透過通話或訊息交換資訊——<b>只能用說的或打字描述，不能直接給對方看畫面或截圖</b>。<br>結案時需回答：兇手、凶器、真正的案發地點、現金被誰拿走、動機。<br>卷宗分三批，輸入正確密碼才會解鎖下一批。</div><p class=\"small\" style=\"color:#6b5a48\">依 2019 年刑法修正，最重本刑為死刑之殺人罪已不受追訴期限制。本案仍可偵辦。</p>"},{"id":"S1","role":"S","stage":1,"icon":"folder","title":"案件摘要（2005 原專案組）","sub":"台南市警察局","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局 刑事警察大隊</div><h2>南星大戲院負責人命案　案件摘要</h2></div><span class=\"tag\">未破</span></div><table><tr><th style=\"width:28%\">被害人</th><td>林振邦，58 歲，南星大戲院負責人</td></tr><tr><th>發現</th><td>2005/3/19 08:40，清潔員郭秀琴於二樓經理辦公室發現死者倒臥辦公桌與保險箱之間</td></tr><tr><th>死因</th><td>頭部遭鈍器重擊</td></tr><tr><th>財物</th><td>保險箱呈開啟狀態，箱內現金及桌上晚場票款袋失竊，合計約 NT$86,000</td></tr><tr><th>凶器</th><td>未尋獲</td></tr></table><p><b>原專案組研判：</b>歹徒於晚場散場後（23:15 以後）潛入二樓，遭林振邦撞見後行兇，並洗劫現金。</p><p><b>研判依據：</b>放映師吳永福證稱，23:12 仍見林振邦在世。</p><p><b>關係人：</b>林子翔（獨子）、吳永福（放映師）、張國輝（建商）、陳美玲（售票員）</p><p>2007 年 3 月，本案因無新事證列為懸案。2006 年南星大戲院結束營業，建物閒置至今。</p><div class=\"sig\">承辦：刑事組　<span class=\"redact\">█████</span></div>"},{"id":"A1","role":"A","stage":1,"icon":"mic","title":"吳永福 筆錄","sub":"放映師・2005/3/19","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　調查筆錄</div><h2>關係人：吳永福（45 歲，放映師）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"small\">時間：2005/3/19 14:10　地點：第五分局</p><p class=\"q\">問：你昨晚的工作情形？</p><p class=\"a\">答：我在南星做放映二十二年了。昨天最後一場九點半開演，《雨港之戀》，五盤片。我整場都在放映室，換盤要準時，一步都不能離開。片子十一點十分準時結束。</p><p class=\"q\">問：最後一次見到林老闆是什麼時候？</p><p class=\"a\">答：十一點十二分左右，片子剛放完，老闆從那扇內門走進放映室，交代我下禮拜一換新片的事，心情看起來還不錯。講了兩三分鐘，我就收工，十一點十五分從前面樓梯下樓。</p><p class=\"q\">問：之後呢？</p><p class=\"a\">答：去對面阿水那邊吃麵，吃完就回家了。</p><p class=\"q\">問：整場放映期間，老闆有進過放映室嗎？</p><p class=\"a\">答：沒有，他一整晚都在辦公室，散場後才過來。</p><p class=\"q\">問：老闆最近跟誰有過節？</p><p class=\"a\">答：那個建商張先生來好幾次了，想買戲院，老闆都不肯，上禮拜還在大廳吵起來。還有他兒子，常常回來要錢。</p><p class=\"q\">問：你知道保險箱密碼嗎？</p><p class=\"a\">答：不知道，那是老闆家裡的事。</p><p class=\"q\">問：放映室裡平常有收音機嗎？</p><p class=\"a\">答：（沉默）……有時候會聽。</p><div class=\"sig\">受詢問人：吳永福（簽名）</div>"},{"id":"A2","role":"A","stage":1,"icon":"mic","title":"林子翔 筆錄","sub":"死者獨子・2005/3/19","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　調查筆錄</div><h2>關係人：林子翔（28 歲，無業）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：3 月 18 日晚上你在哪裡？</p><p class=\"a\">答：在朋友阿凱家打麻將，從八點打到天亮，另外三個人都可以作證。</p><p class=\"q\">問：你和父親的關係？</p><p class=\"a\">答：還好啦。他念我念很多，說我不務正業。</p><p class=\"q\">問：有人說你在外面欠了不少錢？</p><p class=\"a\">答：……一點點而已，我自己會處理。</p><p class=\"q\">問：你有戲院的鑰匙嗎？</p><p class=\"a\">答：有後門的鑰匙，從小就有。不過我很久沒去了。</p><p class=\"q\">問：你知道保險箱密碼嗎？</p><p class=\"a\">答：不知道。（停頓）我爸不會跟我講這個。</p><div class=\"note\"><b>補充訪談（2005/3/22）</b>　牌友陳凱文：「子翔是有來打牌啦，不過大概十點半說要出去一下，回來的時候快一點了。那天他輸錢也照付，很爽快，平常都要欠。」<br><span style=\"color:#6b5a48\">——原專案組未再追查</span></div>"},{"id":"A3","role":"A","stage":1,"icon":"mic","title":"張國輝 筆錄","sub":"建商・2005/3/20","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　調查筆錄</div><h2>關係人：張國輝（52 歲，國輝建設董事長）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：你和林振邦是什麼關係？</p><p class=\"a\">答：生意上的事。南星那塊地在市中心，戲院早就不賺錢了，我出價很公道，他就是死腦筋。</p><p class=\"q\">問：上週你們在戲院大廳起過爭執？</p><p class=\"a\">答：講話大聲一點而已，說不上吵架。</p><p class=\"q\">問：3 月 18 日晚上你在哪裡？</p><p class=\"a\">答：台南大飯店，我公司經理的喜宴。七點開席，我待到十一點半才走，一百多個人都看到我。</p><p class=\"q\">問：林振邦過世後，戲院有可能出售嗎？</p><p class=\"a\">答：那要問他兒子了。（笑）我想他兒子會比較好溝通。</p>"},{"id":"A4","role":"A","stage":1,"icon":"mic","title":"陳美玲 筆錄","sub":"售票員・2005/3/19","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　調查筆錄</div><h2>關係人：陳美玲（34 歲，售票員）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨晚的工作情形？</p><p class=\"a\">答：晚場九點半開演，我賣票到十點收亭，然後在售票亭對帳，晚場票款兩萬四千多。</p><p class=\"q\">問：對完帳之後？</p><p class=\"a\">答：十點二十分左右，我拿錢袋上二樓要交給老闆。辦公室的門開著，燈亮著，可是裡面沒人。我聽到放映室那邊好像有人在大聲講話，但放映機很吵，聽不清楚，我想說大概是阿福在聽收音機。我就把錢袋放在老闆桌上，用菸灰缸壓著，然後下樓。</p><p class=\"q\">問：你幾點離開戲院？</p><p class=\"a\">答：十點三十三分打卡，打卡鐘有紀錄。我走的時候觀眾在鼓譟、吹口哨，我探頭看，銀幕是黑的，好像已經黑一下子了。我想說阿福又在搞什麼，就先走了。</p><p class=\"q\">問：老闆平時和吳永福關係如何？</p><p class=\"a\">答：很好啊，二十幾年的老同事了。不過……老闆最近常常一個人在辦公室看那些盜版光碟，臉色很難看，我也不知道為什麼。</p>"},{"id":"A5","role":"A","stage":1,"icon":"mic","title":"黃阿水 筆錄","sub":"對面麵攤老闆・2005/3/19","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　調查筆錄</div><h2>關係人：黃阿水（61 歲，「阿水麵攤」負責人）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：林老闆昨晚有來吃麵嗎？</p><p class=\"a\">答：有啊，他幾乎天天來。昨天大概八點二十來，一碗牛肉麵加一盤滷菜。八點四十吃完走的，我記得很清楚，他說要回去趕在九點半開演前對帳。之後就沒再吃東西了吧，他晚上都不吃宵夜的。</p><p class=\"q\">問：吳永福呢？</p><p class=\"a\">答：阿福十一點二十五分來的，我正要收攤，有看時鐘。他點一碗麵，一直跟我講話，說什麼「老闆剛剛還在跟我念下禮拜的片子」，同一句講了好幾遍。他平常很安靜的，那天話特別多，手一直抖，我還以為他冷到。</p><p class=\"q\">問：還有看到其他人嗎？</p><p class=\"a\">答：大概十一點出頭吧，有個穿紅色夾克的年輕人從戲院旁邊的後巷跑出來，跑很快，往大馬路那邊去了。臉沒看清楚。</p><p class=\"q\">問：晚場散場的情形？</p><p class=\"a\">答：最後一場散場大概十一點二十，一堆人出來，有好幾個在罵說片子放得亂七八糟。</p>"},{"id":"A6","role":"A","stage":2,"icon":"map","title":"南星大戲院 二樓平面圖","sub":"2005 年建物圖說","body":"<div class=\"hd\"><div><div class=\"org\">南星大戲院　建物圖說（二樓）</div><h2>二樓平面配置圖</h2></div><span class=\"tag\">附件</span></div><svg viewBox=\"0 0 340 318\" font-family=\"Noto Sans TC,sans-serif\" font-size=\"10\" fill=\"#2a2420\"><rect x=\"10\" y=\"10\" width=\"320\" height=\"282\" fill=\"none\" stroke=\"#2a2420\" stroke-width=\"2.5\"/><text x=\"170\" y=\"24\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6b5a48\">（北側：觀眾廳挑高，放映窗口朝向銀幕）</text><rect x=\"20\" y=\"32\" width=\"140\" height=\"150\" fill=\"rgba(160,120,70,.10)\" stroke=\"#2a2420\" stroke-width=\"1.5\"/><text x=\"90\" y=\"50\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"12\">放映室</text><rect x=\"34\" y=\"34\" width=\"22\" height=\"6\" fill=\"#2a2420\"/><rect x=\"104\" y=\"34\" width=\"22\" height=\"6\" fill=\"#2a2420\"/><text x=\"45\" y=\"64\" text-anchor=\"middle\" font-size=\"8.5\">放映窗口</text><text x=\"115\" y=\"64\" text-anchor=\"middle\" font-size=\"8.5\">放映窗口</text><rect x=\"32\" y=\"70\" width=\"26\" height=\"34\" rx=\"3\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"45\" y=\"91\" text-anchor=\"middle\">機A</text><rect x=\"102\" y=\"70\" width=\"26\" height=\"34\" rx=\"3\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"115\" y=\"91\" text-anchor=\"middle\">機B</text><rect x=\"44\" y=\"130\" width=\"72\" height=\"20\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"80\" y=\"144\" text-anchor=\"middle\">倒片台</text><rect x=\"26\" y=\"156\" width=\"40\" height=\"16\" fill=\"none\" stroke=\"#2a2420\" stroke-dasharray=\"2 2\"/><text x=\"46\" y=\"167\" text-anchor=\"middle\" font-size=\"8\">片盒櫃</text><rect x=\"156\" y=\"96\" width=\"8\" height=\"26\" fill=\"#efe6d2\" stroke=\"#a3302a\" stroke-width=\"1.5\"/><text x=\"160\" y=\"136\" text-anchor=\"middle\" fill=\"#a3302a\" font-size=\"8.5\">內門</text><rect x=\"160\" y=\"32\" width=\"160\" height=\"150\" fill=\"none\" stroke=\"#2a2420\" stroke-width=\"1.5\"/><text x=\"240\" y=\"50\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"12\">經理辦公室</text><rect x=\"226\" y=\"66\" width=\"62\" height=\"28\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"257\" y=\"84\" text-anchor=\"middle\">辦公桌</text><rect x=\"290\" y=\"120\" width=\"22\" height=\"22\" fill=\"#2a2420\"/><text x=\"301\" y=\"155\" text-anchor=\"middle\" font-size=\"8.5\">保險箱</text><g stroke=\"#a3302a\" stroke-width=\"2.5\"><path d=\"M256 118l12 12M268 118l-12 12\"/></g><text x=\"262\" y=\"142\" text-anchor=\"middle\" fill=\"#a3302a\" font-size=\"8.5\">陳屍處</text><rect x=\"316\" y=\"160\" width=\"8\" height=\"18\" fill=\"#efe6d2\" stroke=\"#2a2420\"/><text x=\"300\" y=\"176\" text-anchor=\"end\" font-size=\"8.5\">側門→</text><rect x=\"20\" y=\"182\" width=\"300\" height=\"40\" fill=\"none\" stroke=\"#2a2420\" stroke-width=\"1\"/><text x=\"170\" y=\"206\" text-anchor=\"middle\">二樓走廊</text><rect x=\"70\" y=\"178\" width=\"24\" height=\"7\" fill=\"#efe6d2\" stroke=\"#2a2420\"/><text x=\"82\" y=\"176\" text-anchor=\"middle\" font-size=\"8\">門</text><rect x=\"210\" y=\"178\" width=\"24\" height=\"7\" fill=\"#efe6d2\" stroke=\"#2a2420\"/><text x=\"222\" y=\"176\" text-anchor=\"middle\" font-size=\"8\">門</text><g stroke=\"#2a2420\"><rect x=\"20\" y=\"230\" width=\"90\" height=\"50\" fill=\"none\"/><path d=\"M32 230v50M44 230v50M56 230v50M68 230v50M80 230v50M92 230v50\"/></g><text x=\"65\" y=\"308\" text-anchor=\"middle\" font-size=\"9\">前樓梯 → 一樓大廳／售票亭</text><g stroke=\"#2a2420\"><rect x=\"250\" y=\"230\" width=\"70\" height=\"50\" fill=\"none\"/><path d=\"M250 242h70M250 254h70M250 266h70\"/></g><text x=\"285\" y=\"308\" text-anchor=\"middle\" font-size=\"9\">後樓梯 → 後巷後門</text><path d=\"M324 170 q12 30 -4 60\" fill=\"none\" stroke=\"#a3302a\" stroke-dasharray=\"3 3\"/><text x=\"176\" y=\"250\" font-size=\"8.5\" fill=\"#6b5a48\">放映室 → 辦公室：約 4 公尺</text><text x=\"176\" y=\"263\" font-size=\"8.5\" fill=\"#6b5a48\">辦公室 → 後巷：約 20 秒</text></svg><p class=\"small\" style=\"color:#6b5a48\">說明：放映室與經理辦公室之間有內門相通；兩室各有一扇門通往二樓走廊。辦公室東側另有側門，經後樓梯直通後巷後門（後門需鑰匙）。</p>"},{"id":"A7","role":"A","stage":2,"icon":"folder","title":"林家戶籍及員工資料","sub":"戶政／人事資料摘要","body":"<div class=\"hd\"><div><div class=\"org\">戶政事務所／南星大戲院人事資料</div><h2>林家戶籍及員工資料</h2></div><span class=\"tag\">摘要</span></div><p><b>林家戶籍</b></p><table><tr><th>關係</th><th>姓名</th><th>出生日期</th></tr><tr><td>戶長</td><td>林振邦</td><td>1946 年 10 月 2 日</td></tr><tr><td>配偶</td><td>林王素月</td><td>1950 年 9 月 3 日</td></tr><tr><td>長子（獨子）</td><td>林子翔</td><td>1977 年 6 月 11 日</td></tr></table><p><b>戲院員工（2005 年 3 月）</b></p><table><tr><th>姓名</th><th>職務</th><th>出生日期</th><th>到職</th></tr><tr><td>吳永福</td><td>放映師</td><td>1960/2/14</td><td>1983/1</td></tr><tr><td>陳美玲</td><td>售票員</td><td>1971/3/18</td><td>1999/4</td></tr><tr><td>郭秀琴</td><td>清潔員</td><td>1948/7/30</td><td>1995/8</td></tr></table>"},{"id":"A8","role":"A","stage":2,"icon":"pen","title":"林振邦的記事本（三月）","sub":"死者遺物","body":"<div class=\"hd\"><div><div class=\"org\">證物 E-07　死者辦公桌抽屜</div><h2>林振邦 手寫記事本（2005 年 3 月頁）</h2></div><span class=\"tag\">遺物</span></div><p class=\"hand\">3/2　張又來了。不賣就是不賣。</p><p class=\"hand\">3/7　子翔又來要錢，給了一萬。跟他說這是最後一次。</p><p class=\"hand\">3/10　海安路夜市買到《雨港之戀》的盜版 VCD。片子 3/4 才上映。畫面右上角有圓點一閃一閃——那是換盤記號。這是拿戲院的拷貝翻錄的。</p><p class=\"hand\">3/12　打電話問片商。台南只有我們一家拿到這部片的拷貝。</p><p class=\"hand\">3/14　晚上散場後沒回家，在辦公室等。十二點多，聽到後門有人。</p><p class=\"hand\">3/16　全都對上了。二十二年的交情。</p><p class=\"hand\">3/18　今晚跟他講清楚。讓他自己去自首，不然我報警。</p>"},{"id":"A9","role":"A","stage":3,"icon":"cash","title":"地下錢莊帳冊影本","sub":"2010 年另案扣押","body":"<div class=\"hd\"><div><div class=\"org\">臺南地檢署　另案扣押物（2010 年「金鑫當舖」案）</div><h2>帳冊影本（2005 年 3 月部分）</h2></div><span class=\"tag\">影本</span></div><table><tr><th>日期時間</th><th>姓名</th><th>摘要</th></tr><tr><td>3/05</td><td>林子翔</td><td>催收。揚言去找他老爸。</td></tr><tr><td>3/12</td><td>林子翔</td><td>展延一週。利息另計。</td></tr><tr><td>3/19 00:40</td><td>林子翔</td><td>還款 80,000（現金）。鈔票上還纏著「南星」的點鈔紙帶，已拆掉。尚欠 45,000。</td></tr><tr><td>3/19</td><td>陳＊＊</td><td>還款 5,000</td></tr></table>"},{"id":"A10","role":"A","stage":3,"icon":"reel","title":"盜版光碟工廠帳冊","sub":"2005/5 安南區查獲","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　保安大隊（2005 年 5 月）</div><h2>安南區盜版光碟工廠　扣押帳冊（節錄）</h2></div><span class=\"tag\">節錄</span></div><table><tr><th>日期</th><th>片名</th><th>母帶來源</th><th>付款</th></tr><tr><td>2004/11/20</td><td>（外片）</td><td>戲院 F</td><td>25,000</td></tr><tr><td>2005/1/15</td><td>（外片）</td><td>戲院 F</td><td>25,000</td></tr><tr><td>2005/3/08</td><td>雨港之戀</td><td>戲院 F</td><td>30,000</td></tr></table><p class=\"hand\">備註：F 只收現金。都是半夜十二點後在戲院後門交貨，交完拷貝當天早上就要拿回去，不然隔天沒片可放。</p>"},{"id":"B1","role":"B","stage":1,"icon":"finger","title":"驗屍報告（2005）","sub":"法醫解剖","body":"<div class=\"hd\"><div><div class=\"org\">法務部法醫研究所</div><h2>解剖鑑定報告書　死者：林振邦</h2></div><span class=\"tag\">鑑定</span></div><table><tr><th style=\"width:26%\">死因</th><td>顱骨凹陷性骨折併顱內出血</td></tr><tr><th>致命傷</th><td>右後枕部一處長約 9 cm 之弧形挫裂創。創緣呈規則圓弧，依弧度推算，造成傷口之物體邊緣為<b>直徑約 35–40 cm 之圓形硬質邊緣</b>。</td></tr><tr><th>創口異物</th><td>檢出微量<b>銀白色金屬屑（成分：鋁）</b>及<b>透明薄片碎屑（成分：醋酸纖維素）</b>。</td></tr><tr><th>其他</th><td>頭髮及頸部沾附<b>深綠色帆布纖維</b>。雙側腳跟後緣有平行擦傷，生活反應微弱，疑為死後遭拖行所致。</td></tr><tr><th>死亡時間</th><td>依屍溫及屍僵研判，3/18 22:00 至 3/19 00:00 之間。</td></tr><tr><th>胃內容物</th><td>麵條、牛肉片、滷豆干，部分消化。</td></tr></table><div class=\"sig\">法醫師　<span class=\"redact\">████</span></div>"},{"id":"B2","role":"B","stage":1,"icon":"finger","title":"現場鑑識報告（2005）","sub":"二樓經理辦公室","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　鑑識課</div><h2>現場勘察報告</h2></div><span class=\"tag\">鑑識</span></div><p><b>陳屍位置：</b>二樓經理辦公室，死者仰臥於辦公桌與保險箱之間，頭部下方血泊約 40×30 cm。</p><p><b>辦公室狀況：</b>無明顯打鬥跡象。桌上菸灰缸無血跡，無擦拭痕。陳美玲所述之晚場票款袋不在現場。</p><p><b>保險箱：</b>呈開啟狀態，密碼鎖<b>無撬壓破壞痕跡</b>，研判以正確密碼開啟。箱內現金全數失竊。把手採得模糊指紋，無法比對。</p><p><b>鞋印：</b>血泊東側邊緣有一枚運動鞋鞋印（約 27 cm，鞋底紋路為 2004 年款 Nike 慢跑鞋），鞋尖朝向辦公室側門。鞋印處血跡邊緣已半凝固、中心仍濕潤，推定<b>於血液流出後約 20–40 分鐘踩踏</b>。</p><p><b>門：</b>走廊門未鎖；通放映室之內門關閉未鎖；通後樓梯之側門未鎖。</p><div class=\"note\">放映室：本次未採證。（原專案組判斷死者陳屍於辦公室，與放映室無關。）</div>"},{"id":"B3","role":"B","stage":1,"icon":"reel","title":"放映資料與換盤表","sub":"片商資料／放映紀錄","body":"<div class=\"hd\"><div><div class=\"org\">南星大戲院　放映紀錄</div><h2>《雨港之戀》35mm 拷貝　放映資料</h2></div><span class=\"tag\">紀錄</span></div><p>全片長 100 分鐘，共 <b>5 盤</b>，每盤約 20 分鐘。南星大戲院採<b>雙機交替放映</b>：每盤即將播完時，銀幕右上角會出現圓點「換盤記號」，放映師必須在 8 秒內啟動另一台放映機接續。<b>放映師不在場，銀幕就會變黑。</b></p><p><b>3/18 晚場（21:30 開演）預定換盤表</b></p><table><tr><th>盤號</th><th>放映機</th><th>預定時間</th></tr><tr><td>第 1 盤</td><td>A</td><td>21:30–21:50</td></tr><tr><td>第 2 盤</td><td>B</td><td>21:50–22:10</td></tr><tr><td>第 3 盤</td><td>A</td><td>22:10–22:30</td></tr><tr><td>第 4 盤</td><td>B</td><td>22:30–22:50</td></tr><tr><td>第 5 盤</td><td>A</td><td>22:50–23:10</td></tr></table><p>預定散場：23:10。播畢的片盤須放上<b>倒片台</b>倒回，再收入片盒。</p>"},{"id":"B4","role":"B","stage":1,"icon":"finger","title":"2026 補充鑑定","sub":"法醫研究所・重新檢視","body":"<div class=\"hd\"><div><div class=\"org\">法務部法醫研究所（2026 年）</div><h2>補充鑑定意見書</h2></div><span class=\"tag\">新事證</span></div><p>本所依舊案重啟小組請求，重新檢視 2005 年保存之胃內容物切片及解剖紀錄。</p><p>依胃內麵條及肉類之消化程度重新評估，死亡發生於<b>最後一次進食結束後約 80 至 120 分鐘</b>之間。</p><p>原報告推定之死亡時間區間（22:00–24:00）範圍過寬，建議結合死者最後進食時間重新推算。</p><div class=\"sig\">2026.10　法醫師　<span class=\"redact\">████</span></div>"},{"id":"B5","role":"B","stage":2,"icon":"mic","title":"林妻 林王素月 證詞","sub":"2005/3/21","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　訪談紀錄</div><h2>關係人：林王素月（死者之妻）</h2></div><span class=\"tag\">訪談</span></div><p class=\"q\">問：保險箱密碼有誰知道？</p><p class=\"a\">答：只有我跟我先生。密碼是我們<b>獨生子的生日，月跟日四個數字</b>。子翔自己不知道……應該不知道吧。他小時候有一次站在旁邊看他爸開過。</p><p class=\"q\">問：林子翔平常的穿著？</p><p class=\"a\">答：他最常穿那件紅色的運動外套。腳上那雙 Nike 是去年過年我買給他的，27 號。</p><p class=\"q\">問：林先生最近有什麼異狀嗎？</p><p class=\"a\">答：他晚上常常睡不著，說戲院裡有「內鬼」。我問是誰，他說等他確定了再講。</p>"},{"id":"B6","role":"B","stage":2,"icon":"reel","title":"放映室物品清點表","sub":"2005/3/19・未採證","body":"<div class=\"hd\"><div><div class=\"org\">台南市警察局　刑事組</div><h2>放映室物品清點表（依例清點，未採證）</h2></div><span class=\"tag\">清點</span></div><table><tr><th>品項</th><th>數量</th><th>備註</th></tr><tr><td>35mm 放映機</td><td>2</td><td>A、B 機</td></tr><tr><td>倒片台</td><td>1</td><td></td></tr><tr><td>《雨港之戀》片盤</td><td>5</td><td>已裝入片盒，編號 1–5。<b>鋁製，直徑 38 cm</b>，滿盤約 4.5 kg，膠片材質為醋酸纖維素</td></tr><tr><td>空片盤</td><td>2</td><td></td></tr><tr><td>放映機防塵罩（深綠色帆布）</td><td><b>1</b></td><td>庫存紀錄應有 2 件</td></tr><tr><td>菸灰缸</td><td>1</td><td>滿</td></tr><tr><td>垃圾桶</td><td>1</td><td>內有濕抹布一條（未扣押）</td></tr><tr><td>收音機</td><td>0</td><td>現場未見</td></tr></table>"},{"id":"B7","role":"B","stage":2,"icon":"note","title":"觀眾意見卡 ×2","sub":"戲院意見箱・3/19 回收","body":"<div class=\"hd\"><div><div class=\"org\">南星大戲院　觀眾意見箱（清潔員 3/19 早上回收）</div><h2>觀眾意見卡</h2></div><span class=\"tag\">原件</span></div><div class=\"photo\"><span class=\"hand\">晚場十點半左右，畫面突然黑掉，等了快四分鐘才又出來，結果一出來竟然是結局！男女主角在碼頭告別！放了一下又黑掉，再出來又變回中間的劇情。有夠扯，退錢！！</span></div><div class=\"photo\" style=\"transform:rotate(1.2deg)\"><span class=\"hand\">放映師是睡著了嗎？中間黑掉好久，大家都在吹口哨。結果拖到十一點二十才散場，末班公車都沒了。</span></div>"},{"id":"B8","role":"B","stage":2,"icon":"photo","title":"喜宴照片","sub":"張國輝提供・2005/3/22","body":"<div class=\"hd\"><div><div class=\"org\">證物 E-15　張國輝主動提供</div><h2>台南大飯店喜宴照片（2 張）</h2></div><span class=\"tag\">照片</span></div><div class=\"photo\"><span class=\"ts\">05 03 18　22:31</span><br><br>宴會廳主桌旁，張國輝舉杯向新人敬酒。背景可見「囍」字背板及賓客。</div><div class=\"photo\" style=\"transform:rotate(1deg)\"><span class=\"ts\">05 03 18　23:05</span><br><br>張國輝與新郎合照，手持紅包。</div><p>鑑識課確認相機時間與實際時間誤差在 1 分鐘內。飯店經理證實張國輝約 23:30 離開。台南大飯店距南星大戲院車程約 25 分鐘。</p>"},{"id":"B9","role":"B","stage":3,"icon":"finger","title":"2026 魯米諾血跡檢測","sub":"重新採證報告","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>重新採證報告（魯米諾反應及 DNA 比對）</h2></div><span class=\"tag\">新事證</span></div><table><tr><th>採證標的</th><th>結果</th></tr><tr><td>保存證物：《雨港之戀》<b>第 2 號片盤</b></td><td>外緣檢出血跡反應，DNA 與林振邦相符。外緣有輕微凹陷變形。</td></tr><tr><td>保存證物：第 1、3、4、5 號片盤</td><td>無反應</td></tr><tr><td>南星大戲院舊址　放映室地板（倒片台前方）</td><td>大面積<b>擦拭狀</b>血跡反應，並有兩道平行拖曳痕跡延伸至<b>通往辦公室的內門</b>。</td></tr><tr><td>經理辦公室菸灰缸（E-03）</td><td>無反應</td></tr></table>"},{"id":"B10","role":"B","stage":3,"icon":"finger","title":"鞋印比對結果","sub":"2026 年","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>鞋印比對鑑定書</h2></div><span class=\"tag\">新事證</span></div><p>比對對象：林王素月於 2026 年提供、仍保存於林家老宅之林子翔 2005 年所穿 Nike 慢跑鞋（27 號）。</p><p><b>結果：</b>與 2005 年現場血泊旁鞋印之紋路及磨損特徵<b>吻合</b>。鞋底縫隙驗出微量血跡，DNA 與林振邦相符。</p><p>鞋底<b>未檢出</b>鋁屑或膠片碎屑。</p>"},{"id":"X1","role":"S","stage":1,"lock":"x1","icon":"mic","title":"吳永福 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：吳永福（66 歲，已退休）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：當年你說放映室「有時候會聽收音機」。清點表上，放映室沒有收音機。</p><p class=\"a\">答：（很久沒說話）……我記錯了。那天沒帶。</p><p class=\"q\">問：那陳美玲十點二十分聽到的說話聲是什麼？</p><p class=\"a\">答：……老闆是有過來一下。十點多吧。念了我兩句片子的事，念完就回辦公室了。</p><p class=\"q\">問：你在 2005 年的筆錄說，他整晚沒進過放映室，散場後才過來。</p><p class=\"a\">答：二十年了，誰記得那麼清楚。反正他十一點多還好好的，我親眼看到的。</p><div class=\"note\">偵訊官註記：受詢問人首次承認，林振邦於放映「期間」進過放映室，且兩人有過交談。與 2005 年筆錄矛盾。</div>"},{"id":"X2","role":"S","stage":1,"lock":"x2","icon":"mic","title":"林子翔 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：林子翔（49 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：這是你當年的鞋子，和現場鞋印吻合。這是錢莊的帳冊。</p><p class=\"a\">答：（雙手掩面）……我等這一天等了二十一年。</p><p class=\"q\">問：說吧。</p><p class=\"a\">答：我那天被逼到沒路了，想回去跟我爸再開口一次。我從後門上去，差不多十一點前。辦公室燈亮著，他就躺在那裡，血都快乾了。我叫他，他沒有反應。</p><p class=\"q\">問：然後你開了保險箱。</p><p class=\"a\">答：……對。密碼是我的生日，我小時候偷看過。我拿了錢，還有桌上那袋。我不是人，我知道。可是我沒有殺他。我到的時候他已經走了。</p><p class=\"q\">問：你有注意到現場有什麼不對勁嗎？</p><p class=\"a\">答：地上有兩條拖過的痕跡，淡淡的，從通放映室那扇門一路過來。還有，我爸頭上蓋過什麼東西，頭髮上都是綠色的線頭。我這輩子忘不掉。</p><p class=\"q\">問：你為什麼不報警？</p><p class=\"a\">答：我拿了錢啊。誰會相信我？</p>"},{"id":"X3","role":"S","stage":1,"lock":"x3","icon":"mic","title":"陳美玲 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：陳美玲（55 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：這張票根，G 排 7 號。當年晚場的票是妳賣的。這封信是妳寄的吧？</p><p class=\"a\">答：……你們怎麼知道的。（嘆氣）是我。</p><p class=\"q\">問：為什麼現在才寄？</p><p class=\"a\">答：2006 年戲院收掉，我回去幫忙整理。放映室的防塵罩，兩台機器應該兩件，只剩一件。然後我才想起來，放映室從來就沒有收音機。阿福以前跟我說過，機器那麼吵，聽什麼收音機。</p><p class=\"q\">問：所以那晚妳聽到的聲音……</p><p class=\"a\">答：是兩個人在吵架。我當年跟警察說是收音機。我常常想，如果那時候我走過去敲個門……</p><p class=\"q\">問：為什麼不直接來作證？</p><p class=\"a\">答：阿福教過我女兒騎腳踏車。我花了二十年，才說服自己把信封丟進郵筒。</p>"}],"suspects":[{"id":"wu","name":"吳永福","desc":"前放映師，66 歲。獨居，在廟口顧香鋪。","deflect":["這跟那天晚上有什麼關係？","我能說的，二十年前都說了。","（低頭喝茶，不回答）"]},{"id":"son","name":"林子翔","desc":"死者獨子，49 歲。在高雄開計程車。","deflect":["這個我不清楚。","你們又要懷疑我了嗎？","我爸的事……我真的不想再講。"]},{"id":"zhang","name":"張國輝","desc":"建商，73 歲。2008 年買下戲院土地，至今沒有開發。","deflect":["我的律師說，這種問題不用回答。","我人在喜宴，一百多個人看到。還要我說幾遍？","年輕人，辦案要講證據。"]},{"id":"chen","name":"陳美玲","desc":"前售票員，55 歲。在市場賣碗粿。","deflect":["這個我不懂啦。","我只是賣票的，樓上的事我不清楚。","你們去問阿福比較快。"]}],"bts":[{"id":"x1","sus":"wu","docs":["B6","A8"],"minGate":0,"code":"4471","reply":"他盯著那份文件很久，手開始抖。「……我記錯了。老闆那天，是有過來一下。」"},{"id":"x2","sus":"son","docs":["B10","A9"],"minGate":2,"code":"2706","reply":"他看了一眼，整個人垮在椅子上。「我等這一天，等了二十一年。」"},{"id":"x3","sus":"chen","docs":["S0"],"minGate":2,"code":"8153","reply":"她看到那張票根，沉默了很久。「……G 排 7 號。那是我自己留的位子。」"}],"gates":[{"q":"吳永福說林老闆 23:12 還活著。依照現有資料，林振邦<b>最晚在幾點以前</b>就已經死亡？（四位數，24 小時制，例如 2315）","hints":["鑑識組有一份 2026 年的新鑑定，是以「最後一餐」為基準推算的。","證詞組有人知道他最後一餐是幾點吃完的。","吃完的時間 ＋ 120 分鐘。"],"ok":"林老闆在 22:40 以前就已經死了。","h":["848136ac"]},{"q":"保險箱沒有被撬開，是用正確密碼打開的。<b>四位數密碼</b>是什麼？","hints":["鑑識組的林妻證詞說了密碼的規則。","證詞組的戶籍資料裡有那個人的出生日期。","獨生子的生日，月、日各兩位數。"],"ok":"密碼是獨生子的生日。","h":["6a28a93d"]},{"q":"那天晚上銀幕變黑，是從<b>哪個時間點</b>開始的？（四位數）","hints":["黑畫面和換盤有關，鑑識組有預定換盤表。","陳美玲 22:33 離開時已經黑了一下子，意見卡說黑了快四分鐘。","哪一次換盤剛好落在 22:33 之前不久？"],"ok":"換盤的那一刻，放映師不在放映室。","h":["7b4de421"]}],"final":[{"k":"q1","l":"一、殺害林振邦的兇手是？","o":[["son","林子翔（獨子）"],["wu","吳永福（放映師）"],["zhang","張國輝（建商）"],["chen","陳美玲（售票員）"]],"h":"e9cb8e1f"},{"k":"q2","l":"二、凶器是？","o":[["ash","辦公室的菸灰缸"],["reel","放映用的鋁製片盤"],["safe","保險箱的門"],["stop","鐵製門擋"]],"h":"bbbda1ec"},{"k":"q3","l":"三、真正的行兇地點是？","o":[["office","二樓經理辦公室"],["booth","放映室"],["hall","一樓大廳"],["alley","後巷"]],"h":"a6677c7"},{"k":"q4","l":"四、保險箱和錢袋裡的 86,000 元被誰拿走？","o":[["wu","吳永福"],["son","林子翔"],["chen","陳美玲"],["robber","外來的強盜"]],"h":"9e3e940e"},{"k":"q5","l":"五、兇手的動機是？","o":[["money","繼承遺產、還清債務"],["land","戲 支大學登山隊的隊員。那支隊伍，曾經在山上留下一個人。</p><p>隔天清晨，其中一人趴在步道口的雪地裡，身體已經僵硬。</p><p>結論：酒後外出，意外失溫。</p><p>十五年後，死者的朋友寫了一封信來。</p>","chapterIntro":["<p>凌晨兩點。</p><p>一個怕冷、正在感冒的人，在零下六度的大雪夜，自己走出後門，走了八十公尺，然後趴下？</p><p>小組調出了當年保存的血液檢體重新化驗。結果送回來的那天，辦公室裡沒有人說話。</p><p>另外，山莊的住宿登記表和房務紀錄也找到了。</p>","<p>他死在 203 號房的浴室。那不是他的房間。</p><p>如果 203 的浴室是一個陷阱，那麼，陷阱等的人是誰？</p><p>要回答這個問題，得先回到 1996 年的夏天，回到那支登山隊。</p><p>現在，可以去找當年的關係人當面談了。試著把證物出示給他們。</p>","<p>八月十三日。搜救隊撤離的隔天，她還活著，還在寫字。</p><p>有人讀過這本日記。有人因此恨透了某個人。</p><p>但是恨一個人的，那天晚上不只一位。</p><p>最後一批資料：凌晨一點半到兩點半之間，每個人在哪裡。</p>","<p>204 號房，凌晨一點四十分，床是空的。</p><p>把十五年前的雪夜，和三十年前的夏天，連起來。</p><p>請兩位討論後，提交結案報告。</p>"],"docs":[{"id":"S0","role":"S","stage":1,"icon":"note","title":"調查委託信","sub":"2026 年・方雅婷","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組・收件紀錄</div><h2>調查委託</h2></div><span class=\"tag\">優先</span></div><p class=\"hand\">調查小組您好：</p>\n<p class=\"hand\">我是方雅婷。十五年前的冬天，我在雲杉山莊辦了一場聚會，紀念我過世的姊姊雅琪。聚會的第二天早上，羅建宏大哥死在雪地裡。</p>\n<p class=\"hand\">警察說他喝了酒，自己走出去，凍死了。</p>\n<p class=\"hand\">我不相信。羅大哥那天感冒，整晚都說冷，連去交誼廳都披著毯子。他是我見過最怕冷的登山人。</p>\n<p class=\"hand\">那場聚會是我辦的，人是我找的。這十五年，我沒有一天睡得好。</p>\n<p class=\"hand\">我知道，當年在場的每一個人，包括我在內，都有嫌疑。請不要因為我是委託人就放過我。</p>\n<div class=\"note\"><b>任務說明</b><br>兩人分屬<b>證詞組</b>與<b>鑑識組</b>，各持一半卷宗，只能用說的或打字交換資訊。<br>本案共四章。第三章起可以進行<b>偵訊</b>：把你手上的文件出示給關係人，問出新的證詞。<br>結案時需回答：誰做的、怎麼做的、原本想殺誰、為什麼。</div>"},{"id":"S1","role":"S","stage":1,"icon":"folder","title":"案件摘要（2011）","sub":"南投縣警察局仁愛分局","body":"<div class=\"hd\"><div><div class=\"org\">南投縣警察局　仁愛分局</div><h2>雲杉山莊住客死亡案　摘要</h2></div><span class=\"tag\">行政簽結</span></div><table><tr><th style=\"width:26%\">死者</th><td>羅建宏，40 歲，雜誌社攝影記者</td></tr>\n<tr><th>發現</th><td>2011/1/16 06:30，山莊負責人許正雄於後門外約 80 公尺之步道口發現</td></tr>\n<tr><th>現場</th><td>死者俯臥於雪地，著外套及登山鞋，身上覆雪</td></tr>\n<tr><th>天候</th><td>1/15 14:00 起降雪，16:00 道路封閉；1/16 11:00 搶通</td></tr>\n<tr><th>在場者</th><td>許正雄（山莊負責人）、潘秀蘭（員工）、高志遠、沈佩珊、方雅婷（住客）</td></tr></table>\n<p><b>研判：</b>死者於 1/15 晚間飲酒後返回房間，凌晨自行外出（原因不明），因低溫失去意識，失溫致死。無外傷，無他殺嫌疑。</p>\n<p><b>備註：</b>在場住客皆為 1996 年某大學登山社「南稜山難」之關係人，此行為罹難者方雅琪之紀念聚會。經查與本案無關。</p>\n<p>山莊各客房<b>未設門鎖</b>，僅有內側門閂。死者房間門閂未扣。</p>\n<div class=\"sig\">2011.2.10 簽結</div>"},{"id":"A1","role":"A","stage":1,"icon":"mic","title":"許正雄 筆錄","sub":"山莊負責人・2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　調查筆錄</div><h2>關係人：許正雄（60 歲，雲杉山莊負責人）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：發現經過？</p><p class=\"a\">答：早上六點半，我去後門鏟雪，看到步道口有一團東西。走近才知道是人。他臉朝下趴著，身上都是雪。我沒敢動他，只伸手摸了脖子，冰的。我就跑回去叫人了。</p><p class=\"q\">問：你沒有把他翻過來？</p><p class=\"a\">答：沒有。我在山上三十年，知道這種時候不能亂動。是沈醫師出來以後才翻的。</p><p class=\"q\">問：昨晚你的行蹤？</p><p class=\"a\">答：晚餐後在交誼廳陪客人喝了點酒。十點十五分我去前院的發電機房加油、檢查，弄到十一點才回來，回來就直接進無線電室了。那晚路上有車受困，管理站一直呼叫。</p><p class=\"q\">問：十點十五分以前呢？</p><p class=\"a\">答：都在交誼廳，高先生、羅先生、方小姐都在。沈醫師九點半左右說頭痛，先上樓了。</p><p class=\"q\">問：你和住客熟嗎？</p><p class=\"a\">答：高先生是山莊的股東，其他人第一次見。</p><p class=\"q\">問：後門和器材室平常有上鎖嗎？</p><p class=\"a\">答：山上不鎖門的。萬一有人半夜要逃生怎麼辦。</p><div class=\"sig\">受詢問人：許正雄</div>"},{"id":"A2","role":"A","stage":1,"icon":"mic","title":"高志遠 筆錄","sub":"住客・2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　調查筆錄</div><h2>關係人：高志遠（41 歲，戶外用品公司負責人）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：你和死者的關係？</p><p class=\"a\">答：大學登山社的學弟，認識二十年了。</p><p class=\"q\">問：昨晚的情形？</p><p class=\"a\">答：大家吃飯、喝酒、聊以前的事。建宏感冒，喝得不多，心情不太好，畢竟是雅琪的紀念聚會。十點半左右他說要回房間，之後我就沒再見到他。</p><p class=\"q\">問：你自己呢？</p><p class=\"a\">答：我和雅婷在交誼廳聊到兩點四十分左右，都在講她姊姊的事。然後各自回房睡覺。</p><p class=\"q\">問：你覺得他為什麼半夜出去？</p><p class=\"a\">答：不知道。也許是想一個人靜一靜。他一直放不下當年的事。</p><p class=\"q\">問：晚餐時有什麼特別的嗎？</p><p class=\"a\">答：沒什麼。他們還笑我，說隊長十五年了還是一樣，每天晚上十一點一定要泡熱水澡。</p>"},{"id":"A3","role":"A","stage":1,"icon":"mic","title":"沈佩珊 筆錄","sub":"住客・2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　調查筆錄</div><h2>關係人：沈佩珊（39 歲，埔里仁慈醫院急診科醫師）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨晚的情形？</p><p class=\"a\">答：我有高山反應，頭很痛。大概九點半、十點回房間，吃了安眠藥就睡了，一覺到早上被許先生叫醒。</p><p class=\"q\">問：你檢視了遺體？</p><p class=\"a\">答：是。我到的時候他俯臥在雪地，我把他翻過來確認。已經沒有生命跡象，四肢僵硬，皮膚呈粉紅色，這在低溫死亡很常見。</p><p class=\"q\">問：依你判斷，死亡時間？</p><p class=\"a\">答：屍體在雪地裡很難估，我推測是凌晨四、五點左右。</p><p class=\"q\">問：死因？</p><p class=\"a\">答：失溫。酒精會讓人誤判體感溫度，他又感冒，體力差。這種案例我在急診看過不少。</p><p class=\"q\">問：你和死者的關係？</p><p class=\"a\">答：登山社的老朋友。（停頓）他是個好人。</p>"},{"id":"A4","role":"A","stage":1,"icon":"mic","title":"方雅婷 筆錄","sub":"住客・2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　調查筆錄</div><h2>關係人：方雅婷（34 歲，國中教師）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：這次聚會是你發起的？</p><p class=\"a\">答：是。去年九月，山上找到了我姊姊的遺骸和背包。我想請當年的隊員一起來，好好送她一程。</p><p class=\"q\">問：昨晚的情形？</p><p class=\"a\">答：羅大哥一直在發抖，他說這輩子最怕冷。他近視八百多度，眼鏡起霧了還一直擦。十點半他上樓以後，我和高志遠在交誼廳待到兩點四十分。潘姊中間送過薑茶來。</p><p class=\"q\">問：你們聊了什麼？</p><p class=\"a\">答：我姊姊的事。（沉默）我想知道那一年山上到底發生什麼。他一直說，他做了當時最正確的決定。</p><p class=\"q\">問：你覺得羅建宏會自己半夜走出去嗎？</p><p class=\"a\">答：不會。絕對不會。</p>"},{"id":"A5","role":"A","stage":1,"icon":"mic","title":"潘秀蘭 筆錄","sub":"山莊員工・2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　調查筆錄</div><h2>關係人：潘秀蘭（50 歲，山莊房務兼廚務）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨晚你做了哪些事？</p><p class=\"a\">答：煮飯、收餐廳。九點多上二樓送毯子。十點多又上去一趟送浴巾。半夜一點四十五分，我端薑茶到交誼廳給高先生和方小姐，然後老闆叫我進無線電室幫忙抄座標，抄到兩點二十分左右，我就去睡了。</p><p class=\"q\">問：半夜有聽到什麼聲音嗎？</p><p class=\"a\">答：風很大，什麼都聽不清楚。</p><p class=\"q\">問：羅先生有什麼異狀？</p><p class=\"a\">答：他說他房間沒熱水，很想泡個澡。很客氣的一個人。</p><p class=\"small\" style=\"color:#6b5a48\">（筆錄僅半頁。本案以意外結案，員警未再追問。）</p>"},{"id":"A6","role":"A","stage":1,"icon":"note","title":"氣象站逐時降雪紀錄","sub":"中央氣象局函覆","body":"<div class=\"hd\"><div><div class=\"org\">中央氣象局　函覆仁愛分局</div><h2>雲杉山莊自動氣象站　逐時新增積雪</h2></div><span class=\"tag\">函覆</span></div><p>觀測期間：2011/1/15 20:00 至 1/16 06:00</p>\n<table><tr><th>時段</th><th>新增積雪</th><th>氣溫</th></tr>\n<tr><td>20:00–21:00</td><td>1 cm</td><td>-3°C</td></tr>\n<tr><td>21:00–22:00</td><td>1 cm</td><td>-4°C</td></tr>\n<tr><td>22:00–23:00</td><td>2 cm</td><td>-4°C</td></tr>\n<tr><td>23:00–00:00</td><td>2 cm</td><td>-5°C</td></tr>\n<tr><td>00:00–01:00</td><td>3 cm</td><td>-5°C</td></tr>\n<tr><td>01:00–02:00</td><td>3 cm</td><td>-6°C</td></tr>\n<tr><td>02:00–03:00</td><td>4 cm</td><td>-6°C</td></tr>\n<tr><td>03:00–04:00</td><td>2 cm</td><td>-6°C</td></tr>\n<tr><td>04:00 以後</td><td>0（降雪停止）</td><td>-7°C</td></tr></table>\n<p>備註：整夜無明顯融雪，風向穩定。</p>"},{"id":"A7","role":"A","stage":2,"icon":"map","title":"住宿登記表與二樓平面圖","sub":"雲杉山莊","body":"<div class=\"hd\"><div><div class=\"org\">雲杉山莊</div><h2>住宿登記（2011/1/15）及二樓平面圖</h2></div><span class=\"tag\">附件</span></div><table><tr><th>房號</th><th>登記住客</th><th>備註</th></tr>\n<tr><td>101</td><td>許正雄（自住）</td><td>一樓</td></tr><tr><td>102</td><td>潘秀蘭（員工）</td><td>一樓</td></tr>\n<tr><td>201</td><td>—</td><td>空房</td></tr><tr><td>202</td><td>方雅婷</td><td></td></tr>\n<tr><td>203</td><td>高志遠</td><td>股東保留房，附浴缸</td></tr><tr><td>204</td><td>沈佩珊</td><td></td></tr>\n<tr><td>205</td><td>羅建宏</td><td>熱水器報修中</td></tr><tr><td>206</td><td>—</td><td>儲物，上鎖</td></tr></table><svg viewBox=\"0 0 340 250\" font-family=\"Noto Sans TC,sans-serif\" font-size=\"10\" fill=\"#2a2420\">\n<text x=\"170\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6b5a48\">（北側：後側維修陽台，面向山谷）</text>\n<rect x=\"20\" y=\"18\" width=\"300\" height=\"22\" fill=\"rgba(160,120,70,.12)\" stroke=\"#2a2420\"/>\n<text x=\"150\" y=\"33\" text-anchor=\"middle\" font-size=\"9\">後側維修陽台（各房浴室排氣口朝此）</text>\n<g fill=\"#a3302a\"><circle cx=\"118\" cy=\"40\" r=\"4\"/><circle cx=\"268\" cy=\"40\" r=\"4\"/></g>\n<g stroke=\"#2a2420\" stroke-width=\"1.5\" fill=\"none\">\n<rect x=\"20\" y=\"40\" width=\"50\" height=\"90\"/><rect x=\"70\" y=\"40\" width=\"50\" height=\"90\"/><rect x=\"120\" y=\"40\" width=\"50\" height=\"90\"/>\n<rect x=\"170\" y=\"40\" width=\"50\" height=\"90\"/><rect x=\"220\" y=\"40\" width=\"50\" height=\"90\"/><rect x=\"270\" y=\"40\" width=\"50\" height=\"90\"/></g>\n<g text-anchor=\"middle\" font-weight=\"700\" font-size=\"12\"><text x=\"45\" y=\"92\">201</text><text x=\"95\" y=\"92\">202</text><text x=\"145\" y=\"92\">203</text><text x=\"195\" y=\"92\">204</text><text x=\"245\" y=\"92\">205</text><text x=\"295\" y=\"92\">206</text></g>\n<g text-anchor=\"middle\" font-size=\"8\" fill=\"#6b5a48\"><text x=\"45\" y=\"58\">浴室</text><text x=\"95\" y=\"58\">浴室</text><text x=\"145\" y=\"58\">浴室</text><text x=\"195\" y=\"58\">浴室</text><text x=\"245\" y=\"58\">浴室</text><text x=\"295\" y=\"58\">浴室</text>\n<text x=\"45\" y=\"108\">（空房）</text><text x=\"295\" y=\"108\">（儲物・上鎖）</text></g>\n<rect x=\"20\" y=\"130\" width=\"300\" height=\"34\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"150\" y=\"151\" text-anchor=\"middle\">二樓走廊（鋪地毯）</text>\n<rect x=\"318\" y=\"20\" width=\"6\" height=\"18\" fill=\"#efe6d2\" stroke=\"#a3302a\" stroke-width=\"1.5\"/><text x=\"336\" y=\"60\" text-anchor=\"end\" font-size=\"8\" fill=\"#a3302a\">陽台門</text>\n<path d=\"M321 40 v95\" stroke=\"#a3302a\" stroke-dasharray=\"3 3\" fill=\"none\"/>\n<g stroke=\"#2a2420\" fill=\"none\"><rect x=\"20\" y=\"172\" width=\"70\" height=\"40\"/><path d=\"M34 172v40M48 172v40M62 172v40M76 172v40\"/>\n<rect x=\"250\" y=\"172\" width=\"70\" height=\"40\"/><path d=\"M264 172v40M278 172v40M292 172v40M306 172v40\"/></g>\n<text x=\"55\" y=\"226\" text-anchor=\"middle\" font-size=\"9\">前樓梯 → 一樓大廳、交誼廳</text>\n<text x=\"285\" y=\"226\" text-anchor=\"middle\" font-size=\"9\">後樓梯 → 後門、器材室</text>\n<circle cx=\"24\" cy=\"240\" r=\"4\" fill=\"#a3302a\"/><text x=\"32\" y=\"243\" font-size=\"8.5\">舊式瓦斯熱水器的排氣口（僅 203、206）</text>\n</svg><p class=\"small\" style=\"color:#6b5a48\">陽台門位於走廊最東端，未上鎖。後樓梯下樓即為後門與器材室。交誼廳在一樓西側，靠前樓梯。</p>"},{"id":"A8","role":"A","stage":2,"icon":"pen","title":"房務紀錄簿","sub":"潘秀蘭手寫・1/15–1/16","body":"<div class=\"hd\"><div><div class=\"org\">雲杉山莊</div><h2>房務紀錄簿（節錄）</h2></div><span class=\"tag\">原件</span></div><p class=\"hand\">1/15　21:45　202　加毛毯 ×1</p>\n<p class=\"hand\">1/15　22:40　203　加浴巾 ×2（羅先生收）</p>\n<p class=\"hand\">1/16　下午　警察走了以後整理房間</p>\n<p class=\"hand\">　205：床鋪沒睡過。高先生的行李在裡面。</p>\n<p class=\"hand\">　203：浴缸有一缸水沒放，冷的。洗手台上有眼鏡一副，黑框，鏡片很厚。拿去還高先生，高先生說不是他的。窗戶開著一條縫，雪都飄進來了。奇怪，這間的窗我入冬就用膠條封死了。</p>\n<p class=\"hand\">　204：沈醫師自己整理得很乾淨。</p>"},{"id":"A9","role":"A","stage":3,"icon":"pen","title":"方雅琪的日記","sub":"2010/9 隨遺骸尋獲","body":"<div class=\"hd\"><div><div class=\"org\">證物影本　1996 年南稜山難</div><h2>方雅琪　登山日記（最後數頁）</h2></div><span class=\"tag\">影本</span></div><p class=\"small\" style=\"color:#6b5a48\">日記以「第幾天」記錄，未寫日期。</p>\n<p class=\"hand\"><b>第 4 天</b>　我摔下去了。右腿斷了，骨頭看得到。志遠說這條路沒有申請，不能讓人知道我們走南稜。他說他下去求救，叫大家都跟他走，人多走得快。佩珊哭著不肯走，說要留下來陪我。志遠把她拉走了。建宏把他的睡袋留給我。</p>\n<p class=\"hand\"><b>第 5 天</b>　沒有人來。水還有半瓶。</p>\n<p class=\"hand\"><b>第 6 天</b>　聽到直升機，在北邊，很遠很遠。他們為什麼在那邊找？</p>\n<p class=\"hand\"><b>第 7 天</b>　直升機還是在北邊。我用雨衣揮，沒有用。</p>\n<p class=\"hand\"><b>第 8 天</b>　今天直升機只來了一次。腿沒有感覺了。</p>\n<p class=\"hand\"><b>第 9 天</b>　今天沒有聲音。很安靜。佩珊，不是妳的錯。妳有想留下來，我知道。</p>\n<p class=\"small\" style=\"color:#6b5a48\">（以下空白）</p>"},{"id":"A10","role":"A","stage":3,"icon":"note","title":"電子郵件往來","sub":"2010/12・高志遠信箱","body":"<div class=\"hd\"><div><div class=\"org\">證物　高志遠提供之電子郵件（2026 年調閱）</div><h2>沈佩珊與高志遠之通信</h2></div><span class=\"tag\">列印</span></div><p><b>寄件人：</b>沈佩珊　<b>日期：</b>2010/12/03</p>\n<p>我看了雅琪的日記。你當年跟搜救隊說的位置，為什麼是北溪？我們明明在南稜。</p>\n<p><b>寄件人：</b>高志遠　<b>日期：</b>2010/12/05</p>\n<p>都過去了。當年沒申請那條路線，講出來社團會被解散，大家都會被記過，妳的醫學系也會有麻煩。我是在保護所有人。別再提了，對大家都好。</p>\n<p><b>寄件人：</b>沈佩珊　<b>日期：</b>2010/12/05</p>\n<p>她多活了五天。</p>\n<p><b>寄件人：</b>高志遠　<b>日期：</b>2010/12/20</p>\n<p>雅婷要辦紀念聚會，一月在雲杉山莊。我會去，希望妳也來。見面談，把事情放下。</p>\n<p><b>寄件人：</b>沈佩珊　<b>日期：</b>2010/12/21</p>\n<p>好。我會去。</p>"},{"id":"A11","role":"A","stage":3,"icon":"cash","title":"山莊股權與借款文件","sub":"2010 年","body":"<div class=\"hd\"><div><div class=\"org\">證物　許正雄提供</div><h2>雲杉山莊股權及借款協議（摘要）</h2></div><span class=\"tag\">影本</span></div><table><tr><th>持股</th><td>許正雄 55%、高志遠 45%</td></tr>\n<tr><th>借款</th><td>2008 年，許正雄向高志遠借款 NT$ 4,200,000 整修山莊，以其持股設質</td></tr>\n<tr><th>到期日</th><td>2011 年 1 月 17 日</td></tr>\n<tr><th>違約條款</th><td>屆期未清償，高志遠得取得許正雄全部持股</td></tr></table>\n<p class=\"hand\">高志遠手寫便條（釘在協議上）：「許大哥，17 號我會帶律師上來。度假集團的人下個月要看地。別怪我，生意歸生意。」</p>"},{"id":"A12","role":"A","stage":4,"icon":"mic","title":"潘秀蘭 2026 補充證詞","sub":"重新訪談","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：潘秀蘭（65 歲）</h2></div><span class=\"tag\">新事證</span></div><p class=\"q\">問：當年有什麼事，是警察沒問、所以妳沒講的？</p><p class=\"a\">答：有一件。那天半夜一點四十分，方小姐說頭痛，我想說樓上有醫生，就上去 204 敲門要藥。敲了好幾下沒人應。門沒閂，我推開一點看，燈關著，<b>床上沒有人</b>，棉被是掀開的。我以為她在廁所，就下樓了，先泡薑茶端去交誼廳。</p><p class=\"q\">問：之後呢？</p><p class=\"a\">答：一點五十分老闆叫我進無線電室抄座標，抄到兩點二十。我一直在他旁邊。</p><p class=\"q\">問：交誼廳裡的人呢？</p><p class=\"a\">答：高先生和方小姐從頭到尾都坐在壁爐前面。我一點四十五分端茶去的時候在，兩點二十分出來的時候也還在。</p>"},{"id":"A13","role":"A","stage":4,"icon":"mic","title":"方雅婷 2026 補充證詞","sub":"重新訪談","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：方雅婷（49 歲）</h2></div><span class=\"tag\">新事證</span></div><p class=\"q\">問：請再確認一次那晚妳的行蹤。</p><p class=\"a\">答：十點半羅大哥上樓。十一點十分左右高志遠從樓上放完行李下來，之後我們兩個一直在交誼廳，到兩點四十分。中間誰都沒離開超過上廁所的時間，廁所就在交誼廳旁邊。</p><p class=\"q\">問：妳當時恨高志遠嗎？</p><p class=\"a\">答：恨。我那晚就是要逼他說實話。可是我要的是他親口承認，不是要他死。</p><p class=\"q\">問：妳姊姊的日記，還有誰看過？</p><p class=\"a\">答：警察把正本還給我。另外有人去分局申請過影本，我是後來才知道的。</p>"},{"id":"B1","role":"B","stage":1,"icon":"finger","title":"相驗報告（2011）","sub":"南投地檢署","body":"<div class=\"hd\"><div><div class=\"org\">臺灣南投地方法院檢察署</div><h2>相驗屍體證明書（附檢驗紀錄）</h2></div><span class=\"tag\">相驗</span></div><table><tr><th style=\"width:26%\">死亡原因</th><td>低體溫症（意外）</td></tr>\n<tr><th>外觀</th><td>無外傷、無抵抗傷。皮膚及<b>屍斑呈鮮紅色</b>。（檢驗員註：低溫環境下屍斑可呈鮮紅色）</td></tr>\n<tr><th>屍斑位置</th><td><b>背部、臀部、小腿後側</b>，指壓不褪。</td></tr>\n<tr><th>發現姿勢</th><td>俯臥。（檢驗員註：據報發現人曾翻動屍體，故屍斑位置與姿勢不符，不另探究）</td></tr>\n<tr><th>酒精</th><td>血中酒精濃度 0.03%（微量）</td></tr>\n<tr><th>解剖</th><td>家屬無異議，未解剖。採血 10 mL 留存。</td></tr></table>\n<div class=\"sig\">檢驗員　<span class=\"redact\">████</span></div>"},{"id":"B2","role":"B","stage":1,"icon":"photo","title":"現場勘察紀錄（2011）","sub":"步道口","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　偵查隊</div><h2>現場勘察紀錄</h2></div><span class=\"tag\">勘察</span></div><p><b>位置：</b>山莊後門外約 80 公尺，登山步道口指示牌旁。</p>\n<div class=\"photo\"><span class=\"ts\">2011 01 16　11:42</span><br><br>照片 3：遺體移開後之雪地。人形凹痕清晰，凹痕底部積雪壓實。旁置比例尺。</div>\n<p><b>遺體覆雪：</b>依在場者手機照片（06:35 拍攝，遺體尚未翻動）比對比例尺，背部覆雪厚度約 <b>6 公分</b>，均勻、無擾動。</p>\n<p><b>足跡：</b>後門至步道口之間無可辨識足跡或痕跡，研判已遭降雪覆蓋。</p>\n<p><b>遺體下方：</b>身體正下方地面有積雪，已壓實。</p>"},{"id":"B3","role":"B","stage":1,"icon":"folder","title":"器材室清點","sub":"2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　偵查隊</div><h2>山莊一樓器材室　物品清點</h2></div><span class=\"tag\">清點</span></div><table><tr><th>品項</th><th>數量</th><th>備註</th></tr>\n<tr><td>雪鏟</td><td>3</td><td></td></tr><tr><td>冰爪</td><td>6 雙</td><td></td></tr>\n<tr><td>橘色塑膠救難拖板</td><td>1</td><td>靠牆直立。<b>表面潮濕，底部有融雪水漬</b>。許正雄稱「上週之後就沒人用過」</td></tr>\n<tr><td>登山繩</td><td>2 捆</td><td></td></tr><tr><td>急救箱（山莊）</td><td>1</td><td>封條完整</td></tr></table>\n<p>器材室位於後門旁，未上鎖。</p>"},{"id":"B4","role":"B","stage":2,"icon":"finger","title":"2026 血液複驗","sub":"法醫研究所","body":"<div class=\"hd\"><div><div class=\"org\">法務部法醫研究所（2026 年）</div><h2>留存血液檢體　毒藥物複驗報告</h2></div><span class=\"tag\">新事證</span></div><p>檢體：2011 年相驗時採集之死者羅建宏血液（冷凍保存）。</p>\n<table><tr><th>項目</th><th>結果</th></tr>\n<tr><td>一氧化碳血紅素（COHb）</td><td><b>58%</b>（致死濃度；一般認為 50% 以上足以致命）</td></tr>\n<tr><td>安眠鎮靜藥物</td><td>未檢出</td></tr></table>\n<p><b>鑑定意見：</b>死者之死因應為<b>一氧化碳中毒</b>，而非低體溫症。鮮紅色屍斑與此相符。</p>\n<p>達到此濃度者已喪失行動能力，<b>不可能自行步行至戶外</b>。戶外開放空間亦無法累積此濃度之一氧化碳。</p>\n<p>屍斑固定於背側，表示死者死後<b>仰臥至少一至兩小時</b>，之後才被改為俯臥。</p>"},{"id":"B5","role":"B","stage":2,"icon":"finger","title":"2026 山莊熱水設備勘驗","sub":"雲杉山莊舊址","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>雲杉山莊舊址　熱水設備勘驗</h2></div><span class=\"tag\">新事證</span></div><p>山莊於 2013 年歇業，設備大致維持原狀。</p>\n<table><tr><th>房號</th><th>熱水設備</th></tr>\n<tr><td>201、202、204、205</td><td>電熱水器（2009 年更新）。其中 205 之加熱棒燒毀。</td></tr>\n<tr><td><b>203</b></td><td><b>舊式屋內型瓦斯熱水器</b>，裝設於浴室內，排氣管穿牆通往後側維修陽台。浴室附浴缸。</td></tr>\n<tr><td>206</td><td>同 203 型式，瓦斯已拆除，未使用。</td></tr>\n<tr><td>一樓</td><td>鍋爐集中供應</td></tr></table>\n<p>203 浴室對外窗框殘留防寒膠條，<b>膠條有自室內側撕開之痕跡</b>。</p>\n<p>此型熱水器若排氣受阻，於密閉浴室內約 20–30 分鐘即可累積致命濃度之一氧化碳。</p>"},{"id":"B6","role":"B","stage":2,"icon":"folder","title":"死者衣物及隨身物品清單","sub":"2011 相驗附件","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　偵查隊</div><h2>死者衣物及隨身物品清單</h2></div><span class=\"tag\">附件</span></div><table><tr><th>品項</th><th>記錄</th></tr>\n<tr><td>羽絨外套</td><td>深藍色，<b>L 號</b>。內襯繡有「C.Y. KAO」。（死者身高 182 cm，平日穿著 XL）</td></tr>\n<tr><td>上衣</td><td>長袖排汗衣，<b>前後穿反</b></td></tr>\n<tr><td>長褲</td><td>刷毛褲，未繫腰繩</td></tr>\n<tr><td>登山鞋</td><td>死者本人所有。未穿襪。鞋帶綁法見照片 7</td></tr>\n<tr><td>眼鏡</td><td><b>無</b>。現場及周邊雪地均未尋獲</td></tr>\n<tr><td>頭髮</td><td>發現時髮根結冰（記錄者註：疑為雪水）</td></tr></table>\n<div class=\"photo\">照片 7：左腳鞋帶特寫。繩結在第一道交叉處多繞一圈後才打結，結體扁平緊實。</div>"},{"id":"B7","role":"B","stage":3,"icon":"note","title":"1996 山難搜救報告","sub":"南投縣消防局","body":"<div class=\"hd\"><div><div class=\"org\">南投縣消防局（1996 年）</div><h2>○○大學登山社山難　搜救結案報告</h2></div><span class=\"tag\">結案</span></div><table><tr><th>日期</th><th>經過</th></tr>\n<tr><td>8/5</td><td>該隊五人自登山口入山（領隊高志遠；隊員羅建宏、沈佩珊、方雅琪等）</td></tr>\n<tr><td>8/8</td><td>隊員方雅琪墜落受傷</td></tr>\n<tr><td>8/9</td><td>其餘隊員下撤至登山口報案。領隊高志遠回報傷者位置：<b>「北溪源頭營地上方」</b></td></tr>\n<tr><td>8/10–8/12</td><td>直升機及地面人員於北溪流域搜索三日，無所獲。8/12 傍晚因颱風接近，搜救終止</td></tr>\n<tr><td>8/14–8/16</td><td>隊員羅建宏不顧勸阻，自行返回山區搜尋三日，未獲</td></tr></table>\n<div class=\"note\"><b>2010 年 9 月補註：</b>登山客於<b>南稜岩窪</b>發現遺骸及背包，確認為方雅琪。該處距當年回報位置直線約 2.6 公里，分屬不同溪谷。南稜路線於 1996 年為未開放路線。</div>"},{"id":"B8","role":"B","stage":3,"icon":"folder","title":"遺物影本申請紀錄","sub":"仁愛分局・2010","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局</div><h2>方雅琪遺物（日記）影本申請登記簿</h2></div><span class=\"tag\">登記</span></div><table><tr><th>日期</th><th>申請人</th><th>身分</th><th>用途</th></tr>\n<tr><td>2010/10/08</td><td>方雅婷</td><td>家屬</td><td>領回正本</td></tr>\n<tr><td>2010/11/02</td><td><b>沈佩珊</b></td><td>山難當事隊員</td><td>申請日記全本影印</td></tr></table>\n<p class=\"hand\">承辦員警備註：申請人在櫃台讀到最後一頁，站了很久，沒有說話。</p>"},{"id":"B9","role":"B","stage":4,"icon":"note","title":"無線電通聯紀錄","sub":"合歡山管理站・1/16 凌晨","body":"<div class=\"hd\"><div><div class=\"org\">合歡山管理站</div><h2>無線電通聯紀錄簿（2011/1/16）</h2></div><span class=\"tag\">紀錄</span></div><p>事由：台 14 甲線小客車一輛受困，協調鄰近山莊確認位置。</p>\n<table><tr><th>時間</th><th>對象</th><th>內容</th></tr>\n<tr><td>01:40</td><td>雲杉山莊（許）</td><td>呼叫，請求協助確認受困車輛座標</td></tr>\n<tr><td>01:48</td><td>雲杉山莊（許）</td><td>回報能見度及積雪</td></tr>\n<tr><td>01:55</td><td>雲杉山莊（許）</td><td>回報座標第一組</td></tr>\n<tr><td>02:03</td><td>雲杉山莊（許）</td><td>更正座標</td></tr>\n<tr><td>02:11</td><td>雲杉山莊（許）</td><td>確認受困者安全</td></tr>\n<tr><td>02:20</td><td>雲杉山莊（許）</td><td>通聯結束</td></tr></table>\n<p>值班員註：對方全程為同一男性，應答無中斷。背景有女性複誦數字。</p>"},{"id":"B10","role":"B","stage":4,"icon":"finger","title":"2026 排氣管勘驗","sub":"203 號房","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>203 號房熱水器排氣管　拆解勘驗</h2></div><span class=\"tag\">新事證</span></div><p>自後側維修陽台拆下 203 號房排氣管外側彎頭。</p>\n<p><b>發現：</b>彎頭內壁卡有織物殘片一塊，約 8×5 cm，嚴重燻黑。</p>\n<p><b>鑑定：</b>該織物為<b>醫療用彈性繃帶</b>。布邊可辨識印字：<b>「仁慈醫院 供應中心」</b>。</p>\n<p>殘片邊緣呈撕裂狀，研判有人自排氣口外側將塞入之繃帶拉出時，部分斷裂殘留。</p>\n<p>排氣口位於陽台牆面，離地約 150 cm，站立即可觸及，無須工具。</p>\n<p>206 號房排氣管內無異物。</p>"},{"id":"B11","role":"B","stage":4,"icon":"finger","title":"2026 繩結鑑定","sub":"照片 7","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>死者鞋帶繩結　影像鑑定</h2></div><span class=\"tag\">新事證</span></div><p>依 2011 年照片 7 放大分析。</p>\n<p><b>結型：</b>第一道交叉處繞兩圈之平結，即<b>「外科結」（surgeon's knot）</b>，為外科縫合打結之基本結型，目的在於打第二道結時第一道不鬆脫。</p>\n<p><b>比對：</b>死者生前照片共 14 張可辨識鞋帶，均為一般蝴蝶結。登山社慣用之鞋帶結亦非此型。</p>\n<p><b>意見：</b>死者之鞋，高度可能非本人所繫。繫鞋者有長期打外科結之習慣。</p>"},{"id":"X1","role":"S","stage":1,"lock":"x1","icon":"mic","title":"高志遠 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：高志遠（56 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：死者穿著你的外套。他的眼鏡在 203 的洗手台上。203 是你的房間。</p><p class=\"a\">答：……對。那天晚上我們換了房間。</p><p class=\"q\">問：為什麼當年不說？</p><p class=\"a\">答：沒有人問。而且我不覺得那有什麼關係，他是在外面凍死的。</p><p class=\"q\">問：怎麼換的？</p><p class=\"a\">答：十點半，建宏說他 205 沒熱水，想泡澡。我的 203 有浴缸，我就說那你睡我那間。我把隨身的包拿到 205，備用外套掛在 203 門後忘了拿。他上樓以後我就沒再見過他。</p><p class=\"q\">問：換房的時候，有誰在場？</p><p class=\"a\">答：雅婷在。潘姊也在，她說馬上送浴巾上去。佩珊早就上樓了。許大哥去弄發電機。</p><p class=\"q\">問：高先生，那間浴室的排氣管被人動了手腳。</p><p class=\"a\">答：（臉色發白）……那天晚上十一點，本來應該是我在那個浴缸裡。</p>"},{"id":"X2","role":"S","stage":1,"lock":"x2","icon":"mic","title":"潘秀蘭 偵訊紀錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：潘秀蘭（65 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：登記表上 203 是高先生，但妳的浴巾是送給羅先生的。</p><p class=\"a\">答：對啊，他們換房間了。十點半在交誼廳講好的，我在旁邊收杯子，聽得很清楚。方小姐也在。</p><p class=\"q\">問：沈醫師和許老闆知道嗎？</p><p class=\"a\">答：應該不知道。沈醫師九點半就上樓了，老闆那時候在外面。後來也沒有人特別去講。</p><p class=\"q\">問：那晚二樓有沒有什麼不尋常？</p><p class=\"a\">答：有一件小事。九點五十分我送完毯子出來，看到走廊地毯上有濕腳印，從最東邊的陽台門一路踩進來，是雪水。印子往西走，到 204、205 那一帶就乾了、看不到了。我還想說這麼冷誰跑去陽台。</p><p class=\"q\">問：那時候誰在樓上？</p><p class=\"a\">答：就我跟沈醫師。其他人都在樓下喝酒。</p>"},{"id":"X3","role":"S","stage":1,"lock":"x3","icon":"mic","title":"許正雄 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：許正雄（75 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：1 月 17 日，高志遠就要拿走你的山莊。</p><p class=\"a\">答：（冷笑）你們終於查到這個了。對，我恨他。那天晚上我看著他喝我的酒，心裡想的都是他怎麼不摔死在山上。</p><p class=\"q\">問：你知道他習慣十一點泡澡。你也最清楚那台熱水器。</p><p class=\"a\">答：我知道。所以你們懷疑我，我不怪你們。但是我那天晚上九點到十點十五都在交誼廳，之後在發電機房，再之後一直在無線電前面。管理站有紀錄。</p><p class=\"q\">問：你知道他們換房間嗎？</p><p class=\"a\">答：換房間？……我是第二天聽秀蘭講才知道的。</p><p class=\"q\">問：還有一件事。相驗紀錄說你翻動過屍體。</p><p class=\"a\">答：我沒有。我只摸了脖子。把他翻過來的是沈醫師，她一到就翻了，動作很快。</p>"},{"id":"X4","role":"S","stage":1,"lock":"x4","icon":"mic","title":"沈佩珊 談 1996","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：沈佩珊（54 歲，已離開臨床）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：妳申請了這本日記的影本。</p><p class=\"a\">答：（看著影本，很久）……第九天。你們算過那是幾月幾號嗎？</p><p class=\"q\">問：請說說 1996 年。</p><p class=\"a\">答：雅琪摔下去以後，我說我留下來，我是醫學生，我至少可以幫她固定。志遠說不行，五個人一起走才安全，他是領隊，他說了算。他抓著我的背包把我拖走。我回頭看，她對我揮手，叫我快走。</p><p class=\"q\">問：後來呢？</p><p class=\"a\">答：下山以後，志遠去報案。位置是他一個人進去講的。我們在外面等。之後三天，直升機都在北溪。我問他，他說搜救隊有他們的判斷。我信了。我信了十四年。</p><p class=\"q\">問：羅建宏呢？</p><p class=\"a\">答：只有建宏回去找。他一個人在山上找了三天，回來的時候腳趾凍傷，截了一根。他說他覺得位置不對，可是他說不出哪裡不對。（聲音發抖）他是那支隊伍裡，唯一一個回頭的人。</p><p class=\"q\">問：沈醫師，2011 年 1 月 15 日晚上，妳真的九點半就睡了嗎？</p><p class=\"a\">答：……我要找律師。</p>"},{"id":"X5","role":"S","stage":1,"lock":"x5","icon":"mic","title":"方雅婷 談日記","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：方雅婷（49 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：申請日記影本的人是沈佩珊。妳知道嗎？</p><p class=\"a\">答：是那次聚會之後很久，分局的人跟我提起，我才知道。</p><p class=\"q\">問：她跟妳談過日記的內容嗎？</p><p class=\"a\">答：聚會前一個月，佩珊姊打電話給我，只問了一句：「雅婷，妳會原諒當年丟下她的人嗎？」我說，我不知道，我只想知道真相。她說：「真相我已經知道了。」然後就掛了。</p><p class=\"q\">問：妳當時怎麼想？</p><p class=\"a\">答：我以為她在說她自己。我還安慰她，說姊姊在日記裡寫了，不是她的錯。</p><p class=\"q\">問：現在呢？</p><p class=\"a\">答：（哭）羅大哥是替別人死的，對不對？</p>"}],"suspects":[{"id":"kao","name":"高志遠","desc":"前登山隊領隊，56 歲。戶外用品公司董事長。","deflect":["這跟建宏的死有什麼關係？","我沒有什麼好隱瞞的。","都十五年了，你們到底想查什麼。"]},{"id":"shen","name":"沈佩珊","desc":"前急診科醫師，54 歲。2012 年離職，在偏鄉衛生所兼診。","deflect":["這個我不清楚。","我當年的筆錄寫得很清楚了。","（看著窗外，沒有回答）"]},{"id":"fang","name":"方雅婷","desc":"委託人，49 歲。1996 年山難罹難者方雅琪之妹。","deflect":["這個我真的不知道。","如果我知道，我十五年前就說了。","對不起，我幫不上忙。"]},{"id":"hsu","name":"許正雄","desc":"前山莊負責人，75 歲。山莊歇業後在埔里種茶。","deflect":["這個你問我我問誰。","山上的事，我只知道我看到的。","喝茶啦，這個我不會答。"]},{"id":"pan","name":"潘秀蘭","desc":"前山莊員工，65 歲。","deflect":["這個我看不懂啦。","我只是煮飯打掃的。","你們要不要去問老闆？"]}],"bts":[{"id":"x1","sus":"kao","docs":["A8","B6"],"minGate":2,"code":"3052","reply":"他的臉色變了。「……對。那天晚上，我們換了房間。」"},{"id":"x2","sus":"pan","docs":["A7","B5"],"minGate":2,"code":"6184","reply":"「對啊，他們換房間了。我在旁邊聽得很清楚。啊，那天晚上還有一件怪事……」"},{"id":"x3","sus":"hsu","docs":["A11","B9"],"minGate":2,"code":"9027","reply":"他冷笑了一聲。「你們終於查到這個了。對，我恨他。但是你們先看清楚時間。」"},{"id":"x4","sus":"shen","docs":["A9","B7"],"minGate":2,"code":"1358","reply":"她接過文件，手指停在最後一行。「……第九天。你們算過那是幾月幾號嗎？」"},{"id":"x5","sus":"fang","docs":["B8"],"minGate":2,"code":"7741","reply":"「佩珊姊？……她在聚會前一個月，打過一通很奇怪的電話給我。」"}],"gates":[{"q":
