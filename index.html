五十三歲。他被叫了二十九年的殺人犯。</p>","chapterIntro":["<p>清晨五點以後。</p><p>溪水退下去之後，才有人把那個包包端端正正放上護岸。</p><p>那不是一個落水的人留下的。那是有人想讓全鎮看到的東西。</p><p>是誰？為什麼？而她本人，那時候在哪裡？</p><p>鐵路局的舊資料調出來了。</p>","<p>357 次，南下普快。</p><p>全鎮的人都在北上的月台找她，而她去了對面。</p><p>一個二十二歲的女孩，在颱風夜搭上一班反方向的車。她要去哪裡？誰幫她買的票？她在躲什麼？</p><p>老站長的女兒，帶來了一個鐵盒。現在也可以去找當年的人當面談了。</p>","<p>枋寮。南迴線的另一頭，離霧溪兩百多公里。</p><p>到這裡為止，可以確定一件事：1997 年 10 月 17 日晚上，江曉雯是活著離開霧溪的。</p><p>那之後呢？二十九年，她沒有身分證、沒有存摺、沒有名字。</p><p>鐵盒的最底層，還有三張明信片。上面一個字都沒有，只有數字。</p>","<p>「我開了書店。」</p><p>她還活著。她一直都在。</p><p>請兩位把整件事拼起來，提交結案報告。這一次，報告的最後，有一個只有你們能做的決定。</p>"],"docs":[{"id":"S0","role":"S","stage":1,"icon":"note","title":"調查委託信","sub":"2026 年・蘇柏翰","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組・收件紀錄</div><h2>調查委託</h2></div><span class=\"tag\">優先</span></div><p class=\"hand\">我叫蘇柏翰，在霧溪開機車行。</p>\n<p class=\"hand\">二十九年前，我女朋友江曉雯不見了。警察沒有抓我，因為沒有屍體。可是鎮上每個人都知道「是我做的」。我媽去市場，人家不賣她菜。</p>\n<p class=\"hand\">我沒有離開霧溪。我想，如果我走了，就等於承認了。而且萬一她回來，要有人在。</p>\n<p class=\"hand\">上個月，老站長的女兒怡君來找我。她說她爸爸過世前，講了一句她聽不懂的話：「我對不起阿翰。」她還拿來一張寄到車站的明信片，上面只有數字。</p>\n<p class=\"hand\">我媽今年八十四歲了。我想在她走之前，讓她知道她兒子沒有殺人。</p>\n<p class=\"hand\">另外，如果可以，我想知道曉雯到底怎麼了。不管答案是什麼。</p>\n<div class=\"note\"><b>任務說明</b><br>兩人分屬<b>證詞組</b>與<b>鑑識組</b>，各持一半卷宗，只能用說的或打字交換資訊。<br>本案共四章，第三章起可以<b>偵訊</b>。<br>這不一定是一樁命案。結案時需回答：那一晚發生了什麼、誰參與其中、她後來去了哪裡。</div>"},{"id":"S1","role":"S","stage":1,"icon":"folder","title":"案件摘要（1997）","sub":"花蓮縣警察局","body":"<div class=\"hd\"><div><div class=\"org\">花蓮縣警察局　玉里分局</div><h2>霧溪站女教師失蹤案　摘要</h2></div><span class=\"tag\">未結</span></div><table><tr><th style=\"width:26%\">失蹤人</th><td>江曉雯，22 歲，霧溪國小代課教師</td></tr>\n<tr><th>最後行蹤</th><td>1997/10/17 21:40 前後，霧溪車站候車室（站長周福生目擊）</td></tr>\n<tr><th>物證</th><td>10/18 08:10，巡守員於霧溪護岸發現失蹤人之手提包</td></tr>\n<tr><th>天候</th><td>颱風外圍環流，10/17 入夜後豪雨，霧溪暴漲</td></tr></table>\n<p><b>研判：</b>（一）失蹤人於候車期間離站，在溪邊失足落水；或（二）遭人殺害後棄於溪中。溪流下游及出海口搜索十日，未尋獲遺體。</p>\n<p><b>關係人：</b>蘇柏翰（男友，24 歲）。當日 19:30 與失蹤人在霧溪橋頭激烈爭吵；21:00 至 23:00 行蹤無人證明；衣物有血跡。</p>\n<p><b>備註：</b>蘇柏翰於 10/17 23:20 因酒後在麵店與人鬥毆，被帶回霧溪派出所留置，至 10/18 09:00 始離開。</p>\n<p>2005 年，繼父江國棟聲請死亡宣告獲准。</p>"},{"id":"A1","role":"A","stage":1,"icon":"mic","title":"蘇柏翰 筆錄","sub":"男友・1997/10/18","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：蘇柏翰（24 歲，機車行學徒）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨天你和江曉雯見面的情形？</p><p class=\"a\">答：七點半，她約我在橋頭。她說要分手，叫我以後不要再找她。我問她為什麼，她不講，只說「你跟我在一起不會有好日子」。我很大聲，我承認。她哭著走了。</p><p class=\"q\">問：之後你去哪裡？</p><p class=\"a\">答：騎車亂繞。後來在橋下躲雨，喝了半瓶米酒。</p><p class=\"q\">問：有人看到你嗎？</p><p class=\"a\">答：沒有吧。那麼大的雨。</p><p class=\"q\">問：你衣服上的血？</p><p class=\"a\">答：十一點多我去麵店，鄭老闆砂石場的兩個人在那邊講曉雯的閒話，說她「很快就是我們少奶奶了」。我就打過去。鼻血是我自己的。</p><p class=\"q\">問：你有去車站嗎？</p><p class=\"a\">答：沒有。我不知道她要去車站。</p><p class=\"q\">問：她平常會把心事告訴你嗎？</p><p class=\"a\">答：她手上常常有瘀青，我問，她都說是學生撞的。</p>"},{"id":"A2","role":"A","stage":1,"icon":"mic","title":"江國棟 筆錄","sub":"繼父・1997/10/18","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：江國棟（51 歲，鄉民代表、碾米廠負責人）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：你和失蹤人的關係？</p><p class=\"a\">答：她是我太太帶過來的女兒，我讓她跟我姓，當親生的養。她媽媽前年過世以後，就我們父女兩個。</p><p class=\"q\">問：昨晚你在哪裡？</p><p class=\"a\">答：代表會開會到九點，之後回家。她不在，我以為又跑去找那個修車的。</p><p class=\"q\">問：她最近有什麼異狀？</p><p class=\"a\">答：情緒很不穩。那個姓蘇的沒有前途，我叫她分手，她跟我鬧。年輕人想不開，我也是很痛心。</p><p class=\"q\">問：家裡有遺失物品嗎？</p><p class=\"a\">答：（停頓）沒有。</p><p class=\"q\">問：你認為她可能去哪裡？</p><p class=\"a\">答：我看是凶多吉少。你們應該好好查那個姓蘇的。</p>"},{"id":"A3","role":"A","stage":1,"icon":"mic","title":"周福生 筆錄","sub":"霧溪站站長・1997/10/18","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：周福生（55 歲，霧溪站站長）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨晚的情形？</p><p class=\"a\">答：曉雯九點半來買票，一張到花蓮，北上末班車。她說要去花蓮找同學住幾天。然後就坐在候車室等。</p><p class=\"q\">問：之後呢？</p><p class=\"a\">答：九點四十左右，雨太大，我去巡北邊的轉轍器，怕積水。大概十分鐘、十五分鐘回來，候車室就沒人了。</p><p class=\"q\">問：末班車來的時候？</p><p class=\"a\">答：十點零五分，我在第一月台接車。沒有人上車。</p><p class=\"q\">問：站裡還有別人嗎？</p><p class=\"a\">答：沒有。夜班就我一個。</p><p class=\"q\">問：你有看到蘇柏翰嗎？</p><p class=\"a\">答：沒有。阿翰整晚都沒有來過車站，這個我可以保證。</p><p class=\"q\">問：你和失蹤人熟嗎？</p><p class=\"a\">答：她媽媽是我小學同學。這孩子從小在月台上寫功課。（沉默）是個好孩子。</p>"},{"id":"A4","role":"A","stage":1,"icon":"mic","title":"陳滿 筆錄","sub":"站前雜貨店・1997/10/18","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：陳滿（56 歲，人稱阿滿姨，站前雜貨店負責人）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨晚你看到什麼？</p><p class=\"a\">答：雨那麼大，沒什麼人。九點半左右，一台黑色賓士停在站前，引擎沒熄，停了幾分鐘又開走。全鄉只有鄭進財有那種車。</p><p class=\"q\">問：有看到江曉雯嗎？</p><p class=\"a\">答：她九點多從我店門口走過去，沒撐傘，抱著包包。我叫她，她沒聽到。</p><p class=\"q\">問：還有呢？</p><p class=\"a\">答：我十點要關店，差不多九點五十分吧，我看到有個穿黃色雨衣的人，走平交跨越道到對面第二月台去。帽子戴著，看不到臉。我想說是站長還是道班的工人。</p><p class=\"q\">問：那個人的身形？</p><p class=\"a\">答：不高。現在想起來，比周站長矮一個頭。</p><p class=\"q\">問：後來有車來嗎？</p><p class=\"a\">答：有啊，南下的車停了一下就開走了。然後十點那班北上的才來。</p>"},{"id":"A5","role":"A","stage":1,"icon":"mic","title":"高金水 筆錄","sub":"河川巡守員・1997/10/18","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：高金水（47 歲，霧溪河川巡守員）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：發現經過？</p><p class=\"a\">答：早上八點十分，我去護岸看水退了沒。那個包包就放在護岸的台階上，很顯眼。</p><p class=\"q\">問：確切位置？</p><p class=\"a\">答：水尺旁邊。我每天抄水位，看得很清楚，包包放的那一階，剛好對著<b>水尺 42.5 公尺</b>的刻度。</p><p class=\"q\">問：包包的狀況？</p><p class=\"a\">答：立著放的，拉鍊拉好。我拿起來，底部有一點濕，可是上面是乾的。我還打開看是誰的，裡面的課本都乾乾的，沒有泥巴。</p><p class=\"q\">問：昨晚水有多大？</p><p class=\"a\">答：半夜最大的時候，整個護岸下面幾階都淹掉了。我看水尺上的泥線就知道。</p>"},{"id":"A6","role":"A","stage":2,"icon":"mic","title":"北上 652 次列車長 筆錄","sub":"1997/10/20","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：652 次列車長</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：10 月 17 日晚上，霧溪站有旅客上車嗎？</p><p class=\"a\">答：沒有。月台上只有周站長一個人，他親自打燈號。</p><p class=\"q\">問：你確定？</p><p class=\"a\">答：確定。颱風夜全車不到二十個人，我每一站都有看。</p><p class=\"q\">問：站長有什麼異狀嗎？</p><p class=\"a\">答：他全身都濕了，雨衣也沒穿。我還問他，站長你雨衣咧？他說借人了。</p>"},{"id":"A7","role":"A","stage":2,"icon":"mic","title":"退休列車長 訪談","sub":"2026 年","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：退休列車長 邱○榮（78 歲）</h2></div><span class=\"tag\">新事證</span></div><p class=\"q\">問：1997 年 10 月 17 日晚上，您值哪一班車？</p><p class=\"a\">答：南下的普快。那天颱風要來，我記得很清楚，因為隔天南迴就停駛了。</p><p class=\"q\">問：經過霧溪站時，有人上車嗎？</p><p class=\"a\">答：有一個。平常那個小站晚上根本沒有人上車。我們霧溪開車是九點五十幾分，我正要吹哨，看到周站長帶一個人從跨越道跑過來，穿黃色雨衣，是站上那種。</p><p class=\"q\">問：站長說了什麼？</p><p class=\"a\">答：他說是「員工眷屬」，票他開了，叫我不用查。還塞給我一包熱的包子，說麻煩路上照顧一下。</p><p class=\"q\">問：那位旅客的樣子？</p><p class=\"a\">答：瘦瘦小小的，帽子一直沒拿下來。上車以後坐在最後一節的角落，整路沒有講話。我有看到她在哭。對，是女的。</p><p class=\"q\">問：她在哪一站下車？</p><p class=\"a\">答：這我就不記得了。我在台東就交班了。</p>"},{"id":"A8","role":"A","stage":3,"icon":"pen","title":"周站長的鐵盒（一）","sub":"周怡君提供・代用票存根與日誌","body":"<div class=\"hd\"><div><div class=\"org\">證物　周怡君提供</div><h2>周福生遺物：代用票存根、私人日誌</h2></div><span class=\"tag\">原件</span></div><p class=\"small\" style=\"color:#6b5a48\">周福生於 2019 年病逝。鐵盒由女兒周怡君保存。</p>\n<div class=\"photo\"><b>車站代用票　存根　No. 0032</b><br>日期：86 年 10 月 17 日<br>車種：普快　　人數：1<br>起站：霧溪　　迄站：<span class=\"redact\">████</span>（墨水塗黑）<br>票價：<b>211 元</b><br>備註：<span class=\"hand\">未入帳。自付。</span></div>\n<p class=\"hand\">10/17　她媽媽走之前，在病床上拉著我的手，叫我看著這孩子。我看了兩年，什麼都沒做。今天晚上她站在售票口，袖子捲起來給我看。我不能再什麼都不做。</p>\n<p class=\"hand\">10/18　天亮前去了一趟河邊。回來洗手，洗不掉。那個油。<br>願神原諒我。</p>\n<p class=\"hand\">10/25　他們把阿翰叫去問了三次。我去派出所說，阿翰沒有來過車站。他們說知道了。<br>我能說的只有這麼多。我要是多說一句，那孩子就白跑了。</p>\n<p class=\"hand\">87/3/2　收到了。平安就好。</p>"},{"id":"A9","role":"A","stage":3,"icon":"cash","title":"借據與土地謄本","sub":"2026 年調閱","body":"<div class=\"hd\"><div><div class=\"org\">證物　地政事務所／鄭進財提供</div><h2>借據及土地登記沿革</h2></div><span class=\"tag\">影本</span></div><p><b>借據（1996/11）</b>：江國棟向鄭進財借款 NT$ 3,200,000。月息三分。<span class=\"hand\">「以霧溪段 214 地號土地抵償」</span></p>\n<p><b>霧溪段 214 地號（省道旁，1.2 公頃）登記沿革</b></p>\n<table><tr><th>年</th><th>所有權人</th><th>原因</th></tr>\n<tr><td>1995</td><td><b>江曉雯</b></td><td>遺贈（母　林秋月）</td></tr>\n<tr><td>2006</td><td>江國棟</td><td>繼承（江曉雯經法院死亡宣告；江國棟為養父）</td></tr>\n<tr><td>2007</td><td>進財砂石股份有限公司</td><td>買賣</td></tr></table>\n<p class=\"small\" style=\"color:#6b5a48\">註：214 地號之所有權狀及江曉雯印鑑章，於 1997 年 10 月後下落不明。江國棟於 2006 年以「遺失」申請補發。江國棟已於 2024 年 3 月病逝。</p>"},{"id":"A10","role":"A","stage":3,"icon":"pen","title":"江曉雯的教學日誌","sub":"教室抽屜・1997","body":"<div class=\"hd\"><div><div class=\"org\">證物　霧溪國小保存</div><h2>三年乙班　教學日誌（最後一頁）</h2></div><span class=\"tag\">原件</span></div><p class=\"hand\">10/16（四）</p>\n<p class=\"hand\">聯絡簿全部改完了。每一本都多寫了幾句。</p>\n<p class=\"hand\">小傑的注音還是會把ㄅ和ㄉ寫反，請接手的老師多一點耐心，他不是不認真。</p>\n<p class=\"hand\">教室後面的盆栽三天澆一次。</p>\n<p class=\"hand\">孩子們，老師對不起你們。</p>\n<p class=\"hand\">有些地方，要先離開，才回得去。</p>"},{"id":"A11","role":"A","stage":4,"icon":"note","title":"三張明信片","sub":"周站長的鐵盒（二）","body":"<div class=\"hd\"><div><div class=\"org\">證物　周怡君提供</div><h2>寄至霧溪車站之明信片　三張</h2></div><span class=\"tag\">原件</span></div><p class=\"small\" style=\"color:#6b5a48\">收件人皆為「霧溪車站　站長收」。無寄件人。正面是海的風景照。背面沒有文字，只有手寫的數字。</p>\n<div class=\"photo\"><b>第一張</b><br><span class=\"hand\" style=\"font-size:19px;letter-spacing:.08em\">6-5　7-3　6-2　6-4</span></div>\n<div class=\"photo\" style=\"transform:rotate(1deg)\"><b>第二張</b><br><span class=\"hand\" style=\"font-size:19px;letter-spacing:.08em\">2-5　1-4　4-8　3-1　4-3</span></div>\n<div class=\"photo\"><b>第三張</b>（2025 年寄達，車站已無人，由郵差轉交周怡君）<br><span class=\"hand\" style=\"font-size:19px;letter-spacing:.08em\">5-1　7-7　5-2　5-6　5-6</span></div>\n<p class=\"small\" style=\"color:#6b5a48\">郵戳模糊，已送鑑識組判讀。</p>"},{"id":"A12","role":"A","stage":4,"icon":"mic","title":"周怡君 訪談","sub":"2026 年","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：周怡君（52 歲，周福生之女）</h2></div><span class=\"tag\">新事證</span></div><p class=\"q\">問：這些明信片，令尊生前怎麼處理？</p><p class=\"a\">答：他每次收到，都會拿一本舊舊的小冊子出來對，對完就笑，然後把明信片鎖進鐵盒。那本冊子我沒找到，可能跟他一起火化了。</p><p class=\"q\">問：什麼樣的冊子？</p><p class=\"a\">答：薄薄的，像學校發的那種。封面有小朋友畫的圖。</p><p class=\"q\">問：他有回信嗎？</p><p class=\"a\">答：沒有。他說：「不能回。回了就有地址。」我那時候聽不懂。</p><p class=\"q\">問：2025 年那張呢？</p><p class=\"a\">答：爸爸已經不在了。我看不懂，可是我想起他說的「對不起阿翰」，就拿去給柏翰哥了。</p>"},{"id":"B1","role":"B","stage":1,"icon":"finger","title":"手提包鑑識報告","sub":"1997","body":"<div class=\"hd\"><div><div class=\"org\">花蓮縣警察局　鑑識課</div><h2>失蹤人手提包及內容物　鑑識報告</h2></div><span class=\"tag\">鑑識</span></div><table><tr><th>項目</th><th>記錄</th></tr>\n<tr><td>外觀</td><td>米色帆布手提包。底部潮濕，<b>側面及頂部乾燥</b>。表面<b>無泥沙附著</b>。</td></tr>\n<tr><td>背帶</td><td>內側有一處深色油漬，約 3×2 cm。（1997 年註：疑為機油。關係人蘇柏翰為機車行學徒。）</td></tr>\n<tr><td>皮夾</td><td>身分證、教師證、現金 300 元</td></tr>\n<tr><td>書籍</td><td>三年級國語課本一冊、《霧溪國小校刊》第 12 期一冊。<b>均乾燥、無水漬</b>。</td></tr>\n<tr><td>其他</td><td>鑰匙一串、折疊傘一把（未使用）</td></tr>\n<tr><td>未見</td><td>存摺、印章、換洗衣物</td></tr></table>"},{"id":"B2","role":"B","stage":1,"icon":"note","title":"霧溪水位站逐時紀錄","sub":"第九河川局","body":"<div class=\"hd\"><div><div class=\"org\">經濟部水利署　第九河川局</div><h2>霧溪護岸水位站　逐時水位（1997/10/17–18）</h2></div><span class=\"tag\">紀錄</span></div><table><tr><th>時間</th><th>水位（公尺）</th><th>時間</th><th>水位（公尺）</th></tr>\n<tr><td>10/17 20:00</td><td>40.8</td><td>10/18 03:00</td><td>43.1</td></tr>\n<tr><td>21:00</td><td>41.0</td><td>04:00</td><td>42.8</td></tr>\n<tr><td>22:00</td><td>41.4</td><td>05:00</td><td>42.5</td></tr>\n<tr><td>23:00</td><td>41.9</td><td>06:00</td><td>42.2</td></tr>\n<tr><td>10/18 00:00</td><td>42.3</td><td>07:00</td><td>41.9</td></tr>\n<tr><td>01:00</td><td>42.8</td><td>08:00</td><td>41.7</td></tr>\n<tr><td>02:00</td><td><b>43.3（洪峰）</b></td><td></td><td></td></tr></table>\n<p>備註：水位讀數對應護岸水尺刻度。洪水挾帶大量泥沙，退水後淹沒範圍留有明顯泥線。</p>"},{"id":"B3","role":"B","stage":1,"icon":"finger","title":"蘇柏翰衣物血跡鑑定","sub":"1997","body":"<div class=\"hd\"><div><div class=\"org\">花蓮縣警察局　鑑識課</div><h2>關係人衣物血跡鑑定</h2></div><span class=\"tag\">鑑識</span></div><p>送驗物：蘇柏翰 10/17 所穿白色汗衫一件，前胸有滴落狀血跡。</p>\n<table><tr><th>血跡血型</th><td>O 型</td></tr><tr><th>蘇柏翰</th><td>O 型</td></tr><tr><th>江曉雯（教師體檢紀錄）</th><td>A 型</td></tr></table>\n<p><b>結果：</b>血跡與蘇柏翰本人血型相符，與失蹤人不符。滴落型態符合鼻部出血。</p>\n<p>霧溪派出所留置紀錄：蘇柏翰 10/17 23:20 進所，10/18 09:00 離所，期間未離開。</p>"},{"id":"B4","role":"B","stage":1,"icon":"map","title":"霧溪站周邊平面圖","sub":"現場圖","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　偵查隊</div><h2>霧溪車站周邊現場圖</h2></div><span class=\"tag\">附圖</span></div><svg viewBox=\"0 0 340 270\" font-family=\"Noto Sans TC,sans-serif\" font-size=\"10\" fill=\"#2a2420\">\n<text x=\"12\" y=\"14\" font-size=\"9\" fill=\"#6b5a48\">↑ 北（往花蓮）</text><text x=\"12\" y=\"262\" font-size=\"9\" fill=\"#6b5a48\">↓ 南（往台東、枋寮）</text>\n<g stroke=\"#2a2420\" stroke-width=\"2\"><path d=\"M150 10v250M158 10v250\"/><path d=\"M196 10v250M204 10v250\"/></g>\n<g stroke=\"#2a2420\" stroke-width=\".6\"><path d=\"M146 30h16M146 60h16M146 90h16M146 120h16M146 150h16M146 180h16M146 210h16M146 240h16M192 30h16M192 60h16M192 90h16M192 120h16M192 150h16M192 180h16M192 210h16M192 240h16\"/></g>\n<rect x=\"118\" y=\"70\" width=\"26\" height=\"130\" fill=\"rgba(160,120,70,.15)\" stroke=\"#2a2420\"/><text x=\"131\" y=\"140\" text-anchor=\"middle\" font-size=\"9\" transform=\"rotate(-90 131 140)\">第一月台（北上）</text>\n<rect x=\"210\" y=\"70\" width=\"26\" height=\"130\" fill=\"rgba(160,120,70,.15)\" stroke=\"#2a2420\"/><text x=\"223\" y=\"140\" text-anchor=\"middle\" font-size=\"9\" transform=\"rotate(90 223 140)\">第二月台（南下）</text>\n<path d=\"M144 190h66\" stroke=\"#a3302a\" stroke-dasharray=\"3 3\"/><text x=\"177\" y=\"186\" text-anchor=\"middle\" font-size=\"8\" fill=\"#a3302a\">平交跨越道</text>\n<rect x=\"50\" y=\"90\" width=\"68\" height=\"80\" fill=\"none\" stroke=\"#2a2420\" stroke-width=\"1.5\"/><path d=\"M50 130h68\" stroke=\"#2a2420\"/>\n<text x=\"84\" y=\"114\" text-anchor=\"middle\" font-weight=\"700\">候車室</text><text x=\"84\" y=\"154\" text-anchor=\"middle\" font-weight=\"700\">站長室</text>\n<rect x=\"8\" y=\"100\" width=\"34\" height=\"40\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"25\" y=\"118\" text-anchor=\"middle\" font-size=\"8.5\">阿滿</text><text x=\"25\" y=\"130\" text-anchor=\"middle\" font-size=\"8.5\">雜貨店</text>\n<text x=\"46\" y=\"84\" font-size=\"8\" fill=\"#6b5a48\">站前廣場</text>\n<path d=\"M285 10c-12 60 14 120 -4 250\" fill=\"none\" stroke=\"#4a6a8a\" stroke-width=\"10\" opacity=\".45\"/><text x=\"310\" y=\"60\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a6a8a\">霧溪</text>\n<path d=\"M236 200q20 14 36 8\" fill=\"none\" stroke=\"#2a2420\" stroke-dasharray=\"2 3\"/><text x=\"258\" y=\"224\" text-anchor=\"middle\" font-size=\"8\">小路 300 m</text>\n<g stroke=\"#a3302a\" stroke-width=\"2\"><path d=\"M268 200l8 8M276 200l-8 8\"/></g><text x=\"300\" y=\"196\" text-anchor=\"middle\" font-size=\"8\" fill=\"#a3302a\">護岸・水尺</text><text x=\"300\" y=\"207\" text-anchor=\"middle\" font-size=\"8\" fill=\"#a3302a\">（包包發現處）</text>\n<text x=\"84\" y=\"236\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#6b5a48\">霧溪橋：車站以南約 2 公里</text>\n</svg><p class=\"small\" style=\"color:#6b5a48\">第一月台緊鄰站房。前往第二月台須走平交跨越道橫越軌道。護岸位於第二月台後方小路盡頭，距車站約 300 公尺。</p>"},{"id":"B5","role":"B","stage":2,"icon":"note","title":"霧溪站時刻表（1997）","sub":"鐵路局","body":"<div class=\"hd\"><div><div class=\"org\">臺灣鐵路管理局</div><h2>霧溪站　晚間列車時刻（1997 年 10 月）</h2></div><span class=\"tag\">時刻表</span></div><table><tr><th>車次</th><th>車種</th><th>方向</th><th>霧溪開</th><th>月台</th></tr>\n<tr><td>648</td><td>普通</td><td>北上（往花蓮）</td><td>19:12</td><td>一</td></tr>\n<tr><td>355</td><td>普快</td><td>南下（往台東）</td><td>19:40</td><td>二</td></tr>\n<tr><td>7603</td><td>貨物</td><td>北上</td><td>通過不停</td><td>—</td></tr>\n<tr><td>650</td><td>普通</td><td>北上（往花蓮）</td><td>20:31</td><td>一</td></tr>\n<tr><td><b>357</b></td><td>普快</td><td>南下（經台東、南迴線往高雄）</td><td>21:52</td><td>二</td></tr>\n<tr><td>652</td><td>普通</td><td>北上（往花蓮）末班</td><td>22:05</td><td>一</td></tr></table>\n<p>10/18 起因颱風，南迴線停駛三日。</p>"},{"id":"B6","role":"B","stage":2,"icon":"cash","title":"售票日報表","sub":"霧溪站・10/17","body":"<div class=\"hd\"><div><div class=\"org\">臺灣鐵路管理局　霧溪站</div><h2>售票日報表（1997/10/17 晚間）</h2></div><span class=\"tag\">報表</span></div><table><tr><th>票號</th><th>時間</th><th>區間</th><th>票價</th></tr>\n<tr><td>0416</td><td>19:05</td><td>霧溪→玉里</td><td>22</td></tr>\n<tr><td>0417</td><td>20:20</td><td>霧溪→花蓮</td><td>96</td></tr>\n<tr><td>0418</td><td>21:30</td><td>霧溪→花蓮</td><td>96</td></tr></table>\n<p>當日 357 次：<b>無售票紀錄</b>。</p>\n<p>備註：車站另備有「代用票」簿（手寫），用於票機故障或特殊情形，須另行登帳。10 月份代用票登帳數：0 張。</p>"},{"id":"B7","role":"B","stage":2,"icon":"finger","title":"2026 背帶油漬成分分析","sub":"重新鑑定","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>手提包背帶油漬　成分分析</h2></div><span class=\"tag\">新事證</span></div><p>以氣相層析質譜儀分析 1997 年保存之背帶檢體。</p>\n<p><b>結果：</b>該油漬為<b>鋰基極壓潤滑脂</b>，含石墨添加物。此為<b>鐵路轉轍器及道岔滑床板專用潤滑脂</b>，非機車用機油或齒輪油。</p>\n<p><b>意見：</b>油漬來源應為接觸過鐵道轉轍設備之人的手部。1997 年「疑為機油」之記載應予更正。</p>"},{"id":"B8","role":"B","stage":3,"icon":"note","title":"普快票價里程表","sub":"鐵路局・1997","body":"<div class=\"hd\"><div><div class=\"org\">臺灣鐵路管理局</div><h2>霧溪站起　南下普快票價表（1997 年）</h2></div><span class=\"tag\">票價表</span></div><table><tr><th>到站</th><th>里程</th><th>票價</th><th>站碼</th></tr>\n<tr><td>池上</td><td>31 km</td><td>38 元</td><td>0612</td></tr>\n<tr><td>關山</td><td>44 km</td><td>52 元</td><td>0618</td></tr>\n<tr><td>台東</td><td>78 km</td><td>89 元</td><td>0704</td></tr>\n<tr><td>大武</td><td>133 km</td><td>142 元</td><td>0811</td></tr>\n<tr><td>枋寮</td><td>176 km</td><td>211 元</td><td>0907</td></tr>\n<tr><td>屏東</td><td>237 km</td><td>248 元</td><td>0915</td></tr>\n<tr><td>高雄</td><td>258 km</td><td>281 元</td><td>0920</td></tr></table>\n<p class=\"small\" style=\"color:#6b5a48\">枋寮站：南迴線西端。站前有客運往東港；東港有交通船。</p>"},{"id":"B9","role":"B","stage":3,"icon":"finger","title":"衛生所就診紀錄","sub":"1997 年","body":"<div class=\"hd\"><div><div class=\"org\">霧溪鄉衛生所</div><h2>就診紀錄（2026 年依法調閱）</h2></div><span class=\"tag\">病歷</span></div><table><tr><th>日期</th><th>姓名</th><th>記錄</th></tr>\n<tr><td>1997/6/3</td><td>江曉雯</td><td>左前臂挫傷。自述「跌倒」。</td></tr>\n<tr><td>1997/8/21</td><td>江曉雯</td><td>右肩、背部多處瘀傷，新舊不一。自述「騎車摔倒」。</td></tr>\n<tr><td>1997/10/14</td><td>江曉雯</td><td>左臉頰腫脹，左上臂環狀瘀痕（<b>指痕</b>）。自述「撞到門」。</td></tr></table>\n<p class=\"hand\">護理人員手寫註記（10/14）：傷勢與自述不符。問她要不要報警，她搖頭，說「他是代表，沒有人會信」。她問我，一個人如果要離開，戶口怎麼辦。</p>"},{"id":"B10","role":"B","stage":4,"icon":"pen","title":"《霧溪國小校刊》第 12 期","sub":"手提包內・教師園地","body":"<div class=\"hd\"><div><div class=\"org\">證物　1997 年手提包內容物</div><h2>《霧溪國小校刊》第 12 期　第 18 頁「教師園地」</h2></div><span class=\"tag\">原件</span></div><p style=\"text-align:center;font-size:19px;font-weight:700;margin-top:14px\">月台</p>\n<p style=\"text-align:center;color:#6b5a48;font-size:13px\">三年乙班導師　江曉雯</p>\n<table style=\"border:0;margin:14px auto;width:auto;font-size:17px;line-height:2.1\">\n<tr><td style=\"border:0;color:#a3302a;font-size:12px;padding-right:12px\">1</td><td style=\"border:0\">末班車開走以後</td></tr>\n<tr><td style=\"border:0;color:#a3302a;font-size:12px\">2</td><td style=\"border:0\">月台只剩我和雨</td></tr>\n<tr><td style=\"border:0;color:#a3302a;font-size:12px\">3</td><td style=\"border:0\">書包裡的信還沒寄</td></tr>\n<tr><td style=\"border:0;color:#a3302a;font-size:12px\">4</td><td style=\"border:0\">雜貨店的燈先睡了</td></tr>\n<tr><td style=\"border:0;color:#a3302a;font-size:12px\">5</td><td style=\"border:0\">想家的人不看時刻表</td></tr>\n<tr><td style=\"border:0;color:#a3302a;font-size:12px\">6</td><td style=\"border:0\">請勿掛念平常的日子</td></tr>\n<tr><td style=\"border:0;color:#a3302a;font-size:12px\">7</td><td style=\"border:0\">等風安靜，等河回頭</td></tr>\n<tr><td style=\"border:0;color:#a3302a;font-size:12px\">8</td><td style=\"border:0\">我就回來</td></tr></table>\n<p class=\"small\" style=\"color:#6b5a48\">（行號為鑑識人員所加。這一頁的頁角有反覆翻閱的摺痕。）</p>"},{"id":"B11","role":"B","stage":4,"icon":"finger","title":"明信片郵戳判讀","sub":"2026 年","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>明信片郵戳　影像強化判讀</h2></div><span class=\"tag\">新事證</span></div><table><tr><th>明信片</th><th>郵戳日期</th><th>郵戳局名</th></tr>\n<tr><td>第一張</td><td>1998（民國 87）年 2 月 26 日</td><td>屏東　東港</td></tr>\n<tr><td>第二張</td><td>2003 年 6 月 1 日</td><td>屏東　琉球</td></tr>\n<tr><td>第三張</td><td>2025 年 10 月 17 日</td><td>屏東　琉球</td></tr></table>\n<p>三張明信片之數字筆跡，經與江曉雯 1997 年教學日誌比對，<b>書寫特徵相符</b>（數字 7 加橫槓、5 的起筆方式）。</p>\n<p>備註：琉球鄉（小琉球）為屏東縣離島，自東港搭交通船前往。</p>"},{"id":"X1","role":"S","stage":1,"lock":"x1","icon":"mic","title":"鄭進財 2026 偵訊紀錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：鄭進財（77 歲，進財砂石董事長）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：1997 年 10 月 17 日晚上九點半，你的賓士停在霧溪站前。</p><p class=\"a\">答：（沉默）……都幾十年了。</p><p class=\"q\">問：江國棟欠你三百二十萬，要用他女兒名下的地抵。</p><p class=\"a\">答：那是他自己開的條件。他說女兒會簽。那天晚上他打給我，說權狀和印章都不見了，人也不見了，叫我幫忙找。我就開車出去繞。</p><p class=\"q\">問：你找到她了嗎？</p><p class=\"a\">答：沒有。車站我看了一眼，候車室裡沒有人，我就走了。</p><p class=\"q\">問：你還看到誰？</p><p class=\"a\">答：（很久）……九點四十幾分，我開過霧溪橋，橋下有個人坐在機車旁邊淋雨喝酒。是那個姓蘇的。離車站兩公里。</p><p class=\"q\">問：你知道這句話當年可以還他清白嗎？</p><p class=\"a\">答：我要是講了，警察就會問我，颱風夜我在找一個小姐做什麼。（低頭）我對那個年輕人，是有虧欠。</p>"},{"id":"X2","role":"S","stage":1,"lock":"x2","icon":"mic","title":"周怡君 談父親","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：周怡君（52 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：包包上的油，是轉轍器用的潤滑脂。那晚令尊說他去巡了轉轍器。</p><p class=\"a\">答：（看著報告，眼眶紅了）……所以包包真的是他放的。</p><p class=\"q\">問：他過世前說了什麼？</p><p class=\"a\">答：最後那幾天他一直講胡話。他說：「包包是我放的。不這樣做，他們會一路追到南部去。」又說：「我以為沒有屍體就不會有事，我沒想到他們會去怪阿翰。」</p><p class=\"q\">問：他為什麼不說出真相？</p><p class=\"a\">答：我問過。他清醒的時候跟我說：「說出來，阿翰就清白了，可是那孩子就會被找到。兩個我只能顧一個。」他說他選了，所以他這輩子欠阿翰的。</p><p class=\"q\">問：那件黃色雨衣呢？</p><p class=\"a\">答：我爸那件站務雨衣，那年冬天他跟局裡報遺失，還被扣了錢。</p>"},{"id":"X3","role":"S","stage":1,"lock":"x3","icon":"mic","title":"蘇柏翰 看明信片","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>委託人：蘇柏翰（53 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：這些數字，你看得懂嗎？</p><p class=\"a\">答：（盯著看了很久，手在抖）……這是她的寫法。7 會多一橫。</p><p class=\"q\">問：數字的意思呢？</p><p class=\"a\">答：以前我們不能讓她繼父知道，都用這個傳紙條。前面是第幾行，後面是那一行的第幾個字，標點不算。要有同一篇東西才對得出來。我們那時候用的是機車行牆上的價目表。</p><p class=\"q\">問：這三張用的是哪一篇？</p><p class=\"a\">答：我不知道。一定是她和周站長都有的東西。（停頓）她寫過一首詩，登在學校的校刊上，叫〈月台〉。她說那是寫給站長伯伯的。</p><p class=\"q\">問：蘇先生，你還好嗎？</p><p class=\"a\">答：她是活著寫這些的，對不對？你們只要告訴我這個就好。</p>"},{"id":"X4","role":"S","stage":1,"lock":"x4","icon":"mic","title":"林淑芬 2026 訪談","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：林淑芬（61 歲，霧溪國小退休教師）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：妳是江曉雯當年在學校最好的同事。這份紀錄，妳知情嗎？</p><p class=\"a\">答：（看著就診紀錄）……我知道。全校大概只有我知道。夏天她也穿長袖。</p><p class=\"q\">問：她跟妳說過什麼？</p><p class=\"a\">答：她說她媽媽留了一塊地給她，她繼父要她蓋章，她不肯，他就動手。後來又說要把她「許」給鄭家的兒子，連地一起過去。</p><p class=\"q\">問：失蹤前呢？</p><p class=\"a\">答：10 月 16 日，她跟我借了五千塊。她說：「淑芬姊，如果有一天我不見了，不要找我，也不要難過。」我以為她是要去尋短，抱著她哭。她說不是，她說：「我是要去活。」</p><p class=\"q\">問：妳為什麼沒有告訴警察？</p><p class=\"a\">答：江國棟是代表，分局長是他拜把的。我要是講了，他們只會更快把她找回來。我想，讓大家以為她掉進河裡，說不定才是保護她。（哭）可是我沒想到，柏翰會被講成那樣。</p>"}],"suspects":[{"id":"su","name":"蘇柏翰","desc":"委託人，53 歲。當年的男友。在霧溪開機車行，未婚。","deflect":["這個我看不懂。","我那天真的沒有去車站。","你們問什麼我都講，可是這個我不知道。"]},{"id":"cheng","name":"鄭進財","desc":"砂石業者，77 歲。當年的債主。","deflect":["我跟這件事沒有關係。","年代久遠，不記得了。","有事找我律師。"]},{"id":"chou","name":"周怡君","desc":"已故站長周福生之女，52 歲。","deflect":["這個我不清楚，我那時候在台北念書。","我爸很少講工作的事。","對不起，我幫不上忙。"]},{"id":"man","name":"陳滿","desc":"阿滿姨，85 歲。站前雜貨店還開著。","deflect":["阿姨老了，看不懂這個啦。","我看到的當年都講了。","你們要不要吃茶葉蛋？"]},{"id":"lin","name":"林淑芬","desc":"霧溪國小退休教師，61 歲。失蹤人當年的同事。","deflect":["這個我不清楚。","曉雯是很好的老師，孩子們都喜歡她。","（搖頭）"]}],"bts":[{"id":"x1","sus":"cheng","docs":["A4","A9"],"minGate":2,"code":"5290","reply":"他把老花眼鏡摘下來，很久沒有說話。「……都幾十年了。」"},{"id":"x2","sus":"chou","docs":["B7","A8"],"minGate":2,"code":"8436","reply":"她的眼眶紅了。「所以，包包真的是他放的。」"},{"id":"x3","sus":"su","docs":["A11"],"minGate":3,"code":"1175","reply":"他盯著那幾行數字，手開始發抖。「這是她的寫法。7 會多一橫。」"},{"id":"x4","sus":"lin","docs":["B9","A10"],"minGate":2,"code":"6602","reply":"她看了第一行就哭了。「我知道。全校大概只有我知道。」"}],"gates":[{"q":"那個包包，最早是在<b>幾點以後</b>才被放到護岸上的？（四位數，例如 2140）","hints":["證詞組知道包包放在水尺的哪個刻度。鑑識組有整夜的水位。","包包裡面是乾的，也沒有泥沙，所以它沒有被洪水淹過。","水位從哪個整點開始，退回到 42.5 公尺？"],"ok":"清晨五點以後，溪水退了，才有人把包包放上去。","h":["820599d1"]},{"q":"江曉雯沒有搭上北上的末班車。她實際搭的是<b>哪一個車次</b>？","hints":["證詞組有人看到一個穿黃雨衣的人去了另一個月台，還有一位退休列車長記得那晚的事。","鑑識組有當年的時刻表。找南下、九點五十幾分、第二月台的那一班。","21:52 開的南下普快。"],"ok":"357 次，南下普快，21:52。","h":["1f3f4658"]},{"q":"站長自掏腰包開了一張手寫車票。那張票的終點站，<b>站碼</b>是多少？（四位數）","hints":["證詞組的存根上，終點被塗黑了，但票價還在。","鑑識組有票價表。","211 元對應的那一站。"],"ok"  o.type=P[3];o.frequency.setValueAtTime(P[0],n);o.frequency.exponentialRampToValueAtTime(P[1],n+P[2]);g.gain.setValueAtTime(t==='tick'?.025:.11,n);g.gain.exponentialRampToValueAtTime(.001,n+P[2]);o.start(n);o.stop(n+P[2]+.02);}catch(e){}}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function toggleSnd(){SND=!SND;try{localStorage.setItem('oc_snd',SND?'1':'0');}catch(e){}home();if(SND)sfx('ok');}
var twT=null;
function typeInto(id,text){clearInterval(twT);var el=$(id),i=0;if(!el)return;el.textContent='';twT=setInterval(function(){i++;el.textContent=text.slice(0,i);if(i%3===0)sfx('tick');if(i>=text.length)clearInterval(twT);},26);}
function susById(id){return C.suspects.filter(function(x){return x.id===id;})[0];}
function blank(){return {role:null,gate:0,read:{},hints:{},ans:{},solved:false,notes:'',tab:'docs',un:{},tags:{},wg:0,wf:0,t0:0,t1:0,choice:null,pat:{},picks:{},finalOk:false,conf:0,cw:0,wc:0,ep:0,rev:{}};}
function loadCase(c){var s=blank();try{var r=localStorage.getItem(c.key);if(r)s=Object.assign(s,JSON.parse(r));}catch(e){}return s;}
function save(){try{localStorage.setItem(C.key,JSON.stringify(S));}catch(e){}try{syncPush();}catch(e){}}
function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(16);}
function b64(s){try{return new TextDecoder().decode(Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}));}catch(e){return '';}}
function $(id){return document.getElementById(id);}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},2600);}
function dlgShow(html){$('dlgBox').innerHTML=html;$('dlg').classList.add('on');}
function dlgHide(){$('dlg').classList.remove('on');setTimeout(checkReveal,0);}
var dlgCb=null;
function ask(t,cb){dlgCb=cb;dlgShow('<p class="say" style="font-size:15px">'+t+'</p><div class="row"><button class="btn ghost" style="flex:1" onclick="dlgHide()">取消</button><button class="btn" style="flex:1" onclick="dlgHide();dlgCb&&dlgCb()">確定</button></div>');}
var ROLES={A:{name:'證詞組',who:'警探',icon:'mic',desc:'筆錄、證人、信件、帳冊'},B:{name:'鑑識組',who:'鑑識官',icon:'finger',desc:'驗屍、現場、紀錄、物證'},X:{name:'單人模式',who:'獨立調查',icon:'eye',desc:'兩組卷宗全部可見（一個人玩）'}};
var NUM=['一','二','三','四','五'];
function nG(){return C.gates.length;}
function stageNow(){return Math.min(nG(),S.gate+1);}
function mine(d){return S.finalOk||d.role==='S'||S.role==='X'||d.role===S.role;}
function avail(){var st=stageNow();return C.docs.filter(function(d){return mine(d)&&(d.lock?!!S.un[d.lock]:d.stage<=st);});}
function fmtT(ms){var m=Math.round(ms/60000);return (m>=60?Math.floor(m/60)+' 小時 ':'')+(m%60)+' 分';}

/* ---------- home ---------- */
function home(){syncClose();C=null;S=null;
 var h='<div class="wrap"><div class="cover"><div class="eyebrow">舊案重啟小組</div><div class="title">未破案件檔案</div><div class="subtitle">雙人遠距合作推理 ｜ 你們各拿一半的卷宗</div><button class="btn ghost small" style="margin-top:12px" onclick="toggleSnd()">音效：'+(SND?'開':'關')+'</button></div>';
 CASES.forEach(function(c,i){var s=loadCase(c);
  var st=s.solved?'<span class="st done">已結案 '+(s.rank||'')+'</span>':(s.role?'<span class="st go">第'+NUM[Math.min(s.gate,c.gates.length-1)]+'章</span>':'');
  h+='<button class="case" onclick="openCase('+i+')"><span class="mini"><i>第</i><b>'+c.no+'</b><i>案</i><span class="stamp">'+(s.solved?'結案':'未破')+'</span></span><span style="flex:1"><h4>'+c.title+st+'</h4><div class="s">'+c.sub+'</div><div class="tg">「'+c.tagline+'」</div><div class="m">'+c.kind+'　'+c.diff+'　'+c.time+'</div></span></button>';});
 h+='<div class="card"><h3>玩法</h3><p>1. 兩人各自打開這個頁面，選同一個案件，<b>一人當證詞組、一人當鑑識組</b>。開著通話一起玩。</p><p>2. 你們的卷宗不一樣。只能用<b>說的</b>描述，不要截圖。</p><p>3. 合力算出每一章的密碼，解鎖下一批卷宗。</p><p>4. 中途可以<b>偵訊</b>關係人：把手上的文件出示給對的人，會問出新證詞。問出來的新證詞會<b>自動同步</b>到夥伴的手機；解開密碼也是，一人解開，兩邊一起進下一章。（同步沒連上時，改用畫面上的四位數代碼。）</p><p>5. 關係人有<b>耐心</b>：同一章裡亂出示三次，對方就不談了。每章結束會問你們各自最懷疑誰，數到三一起說。</p><p>6. 結案報告答對後，還有最後一場<b>對質</b>。屆時兩組卷宗會合併。</p><p>7. 建議順序：01 → 02 → 03。每案約 2–3 小時，進度會存在各自的手機，可以分兩晚玩。</p></div></div>';
 $('app').innerHTML=h;window.scrollTo(0,0);}
function openCase(i){C=CASES[i];S=loadCase(C);syncOpen();render();window.scrollTo(0,0);}

/* ---------- render ---------- */
function render(){
 if(!C){home();return;}
 if(!S.role){$('app').innerHTML=cover();return;}
 var unread=avail().filter(function(d){return !S.read[d.id];}).length;
 var n=nG();var seg='';for(var i=0;i<=n;i++)seg+='<i class="'+((i<n?S.gate>i:S.solved)?'on':'')+'"></i>';
 var chap=S.solved?'已結案':(S.gate>=n?'結案報告':'第'+NUM[S.gate]+'章　'+C.chapters[S.gate]);
 var h='<div class="top"><div class="in"><button class="bk" onclick="home()">‹</button><div class="t">第'+C.no+'案・'+C.title+'<small>'+chap+'</small></div><span class="chip">'+ROLES[S.role].name+'</span></div><div class="prog">'+seg+'</div></div>';
 h+='<div class="wrap">'+((S.tab==='docs'||S.tab==='ask')?'<div id="syst">'+syLine()+'</div>':'')+({docs:vDocs,ask:vAsk,gates:vGates,final:vFinal,notes:vNotes})[S.tab]()+'</div>';
 h+='<div class="tabs"><div class="in">'+tab('docs','卷宗',I.folder,unread>0)+tab('ask','偵訊',I.talk)+tab('gates','解鎖',I.key)+tab('final','結案',I.gavel)+tab('notes','筆記',I.pen)+'</div></div>';
 $('app').innerHTML=h;
 if(S.tab==='notes'){var ta=$('notes');ta.oninput=function(){S.notes=ta.value;save();};}
}
function tab(k,l,ic,dot){return '<button class="tab '+(S.tab===k?'on':'')+'" onclick="go(\''+k+'\')">'+ic+'<span>'+l+(dot?'<span class="badge"></span>':'')+'</span></button>';}
function go(k){S.tab=k;save();render();window.scrollTo(0,0);}
function cover(){
 return '<div class="wrap"><div class="cover"><button class="btn ghost small" style="float:left" onclick="home()">‹ 案件列表</button><div style="clear:both"></div><div class="eyebrow">舊案重啟小組・案件檔案</div><div class="title">'+C.title+'</div><div class="subtitle">'+C.sub+' ｜ '+C.time+'</div>'+
 '<div class="folder"><div class="lab">舊案重啟小組・案件檔案</div><div class="no">第 '+C.no+' 案</div><div class="nm">'+C.title+'</div><span class="stamp s1">機密</span><span class="stamp s2">未破案件</span><div class="meta">類型：'+C.kind+'　難度：'+C.diff+'</div></div></div>'+
 '<div class="sect">選擇你的身分</div><div class="roles">'+['A','B','X'].map(function(r){return '<button class="role" onclick="pick(\''+r+'\')"><span class="ic">'+I[ROLES[r].icon]+'</span><span><b>'+ROLES[r].name+'・'+ROLES[r].who+'</b><span>'+ROLES[r].desc+'</span></span></button>';}).join('')+
 '</div><p class="small" style="text-align:center;margin-top:18px">兩人請選不同的組別。</p></div>';}
function pick(r){S.role=r;S.tab='docs';if(!S.t0)S.t0=Date.now();save();syncOpen();render();story('序章',C.title,C.prologue,'打開卷宗');}

/* ---------- story ---------- */
function story(ch,title,html,btn){
 var i=0;var body=html.replace(/<p/g,function(){return '<p style="animation-delay:'+((i++)*0.7).toFixed(1)+'s"';});
 $('paper').innerHTML='<div class="story"><div class="ch">'+ch+'</div><h2>'+title+'</h2>'+body+'<button class="btn" onclick="closeDoc()">'+btn+'</button></div>';
 $('mclose').style.display='none';$('modal').classList.add('on');$('modal').scrollTop=0;document.body.style.overflow='hidden';}

/* ---------- docs ---------- */
function docBtn(d){var tr=d.role==='S'?'共用':(d.role==='A'?'證詞組':'鑑識組');
 return '<button class="doc '+(S.read[d.id]?'read ':'')+(d.lock?'bt':'')+'" onclick="openDoc(\''+d.id+'\')"><span class="ic">'+I[d.icon]+'</span><span><b>'+d.title+'</b><small>'+d.sub+((S.role==='X'||S.finalOk)&&!d.lock?'・'+tr:'')+'</small></span>'+(S.read[d.id]?'':'<span class="new">NEW</span>')+'</button>';}
function vDocs(){var h='',st=stageNow();
 for(var s=1;s<=nG();s++){
  h+='<div class="sect">第'+NUM[s-1]+'章　'+(s<=st?C.chapters[s-1]:'？？？')+'</div>';
  if(s>st){h+='<div class="locked">'+I.lock+'<span>破解「解鎖 '+(s-1)+'」後開啟</span></div>';continue;}
  C.docs.filter(function(d){return !d.lock&&d.stage===s&&mine(d);}).forEach(function(d){h+=docBtn(d);});
 }
 var bt=C.docs.filter(function(d){return d.lock&&S.un[d.lock];});
 h+='<div class="sect">偵訊突破紀錄　'+bt.length+' / '+C.bts.length+'</div>';
 if(!bt.length)h+='<p class="small">還沒有。到「偵訊」把文件出示給關係人試試看。</p>';
 bt.forEach(function(d){h+=docBtn(d);});
 h+='<div style="text-align:center;margin-top:24px"><button class="btn ghost small" onclick="resetCase()">重置本案進度</button></div>';
 return h;}
function openDoc(id){var d=C.docs.filter(function(x){return x.id===id;})[0];
 $('paper').innerHTML='<div class="paper">'+d.body+'</div>';$('mclose').style.display='';
 $('modal').classList.add('on');$('modal').scrollTop=0;document.body.style.overflow='hidden';
 if(!S.read[id]){S.read[id]=1;save();}}
function closeDoc(){$('modal').classList.remove('on');document.body.style.overflow='';render();if(SY.q){SY.q=false;gateStory();return;}if(pendPick){pendPick=false;askPick();return;}checkReveal();}

/* ---------- interrogation ---------- */
var TAGS=['標記','可疑','排除'];
function pat(sid){var p=S.pat[sid];if(!p||p.g!==S.gate)p=S.pat[sid]={g:S.gate,n:0};return p;}
function vAsk(){
 var h='<p class="small" style="margin-top:16px">選一位關係人，出示你手上的一份文件。對的文件給對的人，才問得出東西。每個人每一章只有三次耐心，先和夥伴討論再出手。</p>';
 if(S.role!=='X')h+='<div class="gate"><h4>夥伴的突破代碼（備用）</h4><div class="small" style="margin-bottom:8px">同步連線時，夥伴問出的證詞會自動出現，不用輸入。只有同步沒連上時才需要這組四位數代碼。</div><div class="row"><input class="inp" id="pc" inputmode="numeric" maxlength="4" placeholder="••••"><button class="btn" onclick="partner()">輸入</button></div><div class="msg" id="pcm"></div></div>';
 C.suspects.forEach(function(s,i){var t=S.tags[s.id]||0,left=3-pat(s.id).n,pp='';for(var k=0;k<3;k++)pp+=k<left?'●':'○';
  h+='<div class="sus"><div class="hdr"><div class="av" style="background:hsl('+(32+i*47)%360+',42%,62%)">'+s.name.charAt(0)+'</div><div><b>'+s.name+'</b><div class="d">'+s.desc+'</div></div></div><div class="acts"><button class="btn small" onclick="present(\''+s.id+'\')">出示證物</button><button class="tagb t'+t+'" onclick="tag(\''+s.id+'\')">'+TAGS[t]+'</button><span class="small" style="margin-left:auto;letter-spacing:.2em;color:'+(left?'var(--kraft)':'var(--red2)')+'">耐心 '+pp+'</span></div></div>';});
 return h;}
function tag(id){S.tags[id]=((S.tags[id]||0)+1)%3;save();var y=window.scrollY;render();window.scrollTo(0,y);}
function present(sid){pendingSus=sid;var conf=sid==='__conf';
 if(!conf&&S.gate<nG()&&pat(sid).n>=3){dlgShow('<div class="who">'+susById(sid).name+'</div><p class="say">（他不願意再談了。）</p><div class="small" style="margin-bottom:10px">推進到下一章後，他才會再開口。</div><button class="btn ghost" style="width:100%" onclick="dlgHide()">關閉</button>');return;}
 var h='<h3>'+(conf?'出示證物反駁':'出示給　'+susById(sid).name)+'</h3><p class="small" style="margin:0 0 8px">選擇一份文件</p>';
 avail().filter(function(d){return conf||!d.lock;}).forEach(function(d){h+='<button class="doc" onclick="showTo(\''+d.id+'\')"><span class="ic">'+I[d.icon]+'</span><span><b>'+d.title+'</b><small>'+d.sub+'</small></span></button>';});
 $('sheetBox').innerHTML=h;$('sheet').classList.add('on');$('sheetBox').scrollTop=0;}
function closeSheet(){$('sheet').classList.remove('on');}
function showTo(did){closeSheet();if(pendingSus==='__conf'){confShow(did);return;}
 var s=susById(pendingSus),p=pat(s.id);
 var b=C.bts.filter(function(x){return x.sus===s.id&&x.docs.indexOf(did)>=0;})[0];
 if(b&&S.gate>=b.minGate){var first=!S.un[b.id];S.un[b.id]=1;save();sfx('ok');vib(80);
  dlgShow('<div class="who">'+s.name+'</div><p class="say" id="tw"></p><div class="msg ok" style="margin:0 0 6px">'+(first?'🔓 取得新的偵訊紀錄':'（已取得這份紀錄）')+'</div>'+(S.role!=='X'?'<div class="small">把這組代碼念給夥伴：</div><div class="code">'+b.code+'</div>':'')+'<div class="row"><button class="btn ghost" style="flex:1" onclick="dlgHide();render()">關閉</button><button class="btn" style="flex:1" onclick="dlgHide();openDoc(\''+docOf(b.id)+'\')">閱讀紀錄</button></div>');typeInto('tw',b.reply);
 }else if(b){dlgShow('<div class="who">'+s.name+'</div><p class="say" id="tw"></p><div class="small" style="margin-bottom:10px">問對了方向，但時機未到。先推進案情再回來。（不扣耐心）</div><button class="btn ghost" style="width:100%" onclick="dlgHide()">關閉</button>');typeInto('tw','（他看了一眼，欲言又止。）「……這件事，現在還不是談的時候。」');
 }else{if(S.gate<nG())p.n++;save();sfx('bad');var out=S.gate<nG()&&p.n>=3;
  var line=out?'（他站起來，把椅子推回去。）「今天就到這裡吧。」':'「'+s.deflect[Math.floor(Math.random()*s.deflect.length)].replace(/^「|」$/g,'')+'」';
  dlgShow('<div class="who">'+s.name+'</div><p class="say" id="tw"></p><div class="small" style="margin-bottom:10px">'+(out?'他的耐心用完了。下一章再來。':(S.gate<nG()?'沒有問出東西。剩餘耐心：'+(3-p.n):'沒有問出東西。'))+'</div><button class="btn ghost" style="width:100%" onclick="dlgHide();render()">關閉</button>');typeInto('tw',line);}}
/* ---------- confrontation ---------- */
function vConf(){var cf=C.confront,r=cf.rounds[S.conf],seg='';for(var i=0;i<cf.rounds.length;i++)seg+='<i class="'+(i<S.conf?'on':'')+'"></i>';
 return '<div class="sus" style="margin-top:18px;border-color:var(--red)"><div class="hdr"><div class="av" style="background:#c8463c;color:#fff">'+cf.who.charAt(0)+'</div><div><b>'+cf.who+'</b><div class="d">'+cf.title+'　第 '+(S.conf+1)+' / '+cf.rounds.length+' 回合</div></div></div><div class="prog" style="padding:12px 0 0">'+seg+'</div><p style="font-family:\'Noto Serif TC\',serif;font-size:17px;line-height:2;color:#f0e2c6;margin:14px 0">「'+r.say+'」</p>'+(S.cw>=2?'<div class="hint" style="margin-bottom:12px">💡 '+r.hint+'</div>':'')+'<button class="btn" style="width:100%;padding:13px;font-size:16px" onclick="present(\'__conf\')">出示證物反駁</button></div><p class="small">兩組卷宗已經合併。現在你可以翻閱、出示夥伴那一半的文件。兩人各自在自己的手機上完成這場對話。</p>';}
function confShow(did){var cf=C.confront,r=cf.rounds[S.conf];
 if(r.docs.indexOf(did)>=0){S.conf++;S.cw=0;var done=S.conf>=cf.rounds.length;if(done){S.solved=true;S.t1=Date.now();S.rank=rank()[0];}save();sfx(done?'win':'ok');vib(done?200:80);
  dlgShow('<div class="who">'+cf.who+'</div><p class="say" id="tw"></p><button class="btn" style="width:100%" onclick="dlgHide();render();window.scrollTo(0,0)">'+(done?'閱讀結案報告':'繼續')+'</button>');typeInto('tw',r.ok);
 }else{S.wc++;S.cw++;save();sfx('bad');dlgShow('<div class="who">'+cf.who+'</div><p class="say" id="tw"></p><div class="small" style="margin-bottom:10px">這份文件動搖不了這句話。'+(S.cw>=2?'（已顯示提示）':'')+'</div><button class="btn ghost" style="width:100%" onclick="dlgHide();render()">再想想</button>');typeInto('tw',cf.fail[Math.floor(Math.random()*cf.fail.length)]);}}
function askPick(){var g=S.gate;
 dlgShow('<div class="who">第'+NUM[g-1]+'章結束</div><p class="say" style="margin-bottom:6px">'+(C.pickQ||'此刻，你最懷疑誰？')+'</p><div class="small" style="margin-bottom:10px">各自選好，再和夥伴數到三，同時說出答案。</div><div class="opts">'+C.suspects.map(function(s){return '<button class="opt" onclick="pickSus(\''+s.id+'\')">'+s.name+'</button>';}).join('')+'<button class="opt" onclick="pickSus(\'\')">還看不出來</button></div>');}
function pickSus(id){S.picks[S.gate]=id;save();$('dlg').classList.remove('on');if(S.role!=='X'&&SY.db&&!peerPick(S.gate))toast('已記下。夥伴選好後會自動揭曉。');checkReveal();}
function docOf(lock){return C.docs.filter(function(d){return d.lock===lock;})[0].id;}
function partner(){var v=$('pc').value.replace(/\D/g,'');var b=C.bts.filter(function(x){return x.code===v;})[0];var m=$('pcm');
 if(!b){m.className='msg err';m.textContent='沒有這組代碼。';return;}
 S.un[b.id]=1;save();toast('🔓 收到夥伴的偵訊紀錄');go('docs');}

/* ---------- gates ---------- */
function vGates(){var h='<p class="small" style="margin-top:16px">每道密碼都需要兩組的資料。兩人都要各自輸入，才會解鎖自己手機上的下一章。</p>';
 C.gates.forEach(function(g,i){var done=S.gate>i,open=S.gate===i;
  h+='<div class="gate '+(done?'done':'')+'"><h4>解鎖 '+(i+1)+(done?'　✓ 已破解':'')+'</h4>';
  if(!done&&!open){h+='<div class="small">尚未開放</div></div>';return;}
  h+='<div class="qq">'+g.q+'</div>';
  if(done){h+='<div class="msg ok">'+g.ok+'</div></div>';return;}
  h+='<div class="row"><input class="inp '+(g.text?'txt':'')+'" id="g'+i+'" '+(g.text?'maxlength="8" placeholder="輸入文字"':'inputmode="numeric" maxlength="5" placeholder="••••"')+' onkeydown="if(event.key===\'Enter\')tryGate('+i+')"><button class="btn" onclick="tryGate('+i+')">送出</button></div><div class="msg" id="gm'+i+'"></div>';
  var hs=S.hints['g'+i]||0;for(var k=0;k<hs;k++)h+='<div class="hint">💡 提示 '+(k+1)+'：'+g.hints[k]+'</div>';
  if(hs<g.hints.length)h+='<div style="margin-top:10px"><button class="btn ghost small" onclick="hint('+i+')">看提示 '+(hs+1)+' / '+g.hints.length+'</button></div>';
  h+='</div>';});
 return h;}
function hint(i){S.hints['g'+i]=(S.hints['g'+i]||0)+1;save();var y=window.scrollY;render();window.scrollTo(0,y);}
function tryGate(i){var g=C.gates[i],el=$('g'+i);
 var v=g.text?el.value.replace(/[\s，。、「」"']/g,''):el.value.replace(/\D/g,'');
 if(g.h.indexOf(fnv(C.id+'|g'+i+'|'+v))>=0){S.gate=i+1;save();render();gateStory();}
 else{S.wg++;save();sfx('bad');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');$('gm'+i).className='msg err';$('gm'+i).textContent='不對。再和夥伴核對一次資料。';}}

/* ---------- final ---------- */
function vFinal(){
 if(S.gate<nG())return '<div class="card" style="margin-top:20px;text-align:center"><h3>結案報告尚未開放</h3><p>破解全部 '+nG()+' 道解鎖後，才能提交結案報告。</p></div>';
 if(S.solved)return vEnd();
 if(S.finalOk&&C.confront)return vConf();
 var h='<div class="card" style="margin-top:18px"><h3>結案報告</h3><p>兩人討論、達成共識後再送出。全部答對才算結案，答錯只會告訴你們對了幾題。</p></div>';
 C.final.forEach(function(q){h+='<div class="fq"><div class="l">'+q.l+'</div><div class="opts">'+q.o.map(function(o){return '<button class="opt '+(S.ans[q.k]===o[0]?'on':'')+'" onclick="choose(\''+q.k+'\',\''+o[0]+'\')">'+o[1]+'</button>';}).join('')+'</div></div>';});
 h+='<button class="btn" style="width:100%;padding:14px;font-size:16px" onclick="submitFinal()">提交結案報告</button><div class="msg" id="fm" style="text-align:center"></div>';return h;}
function choose(k,v){S.ans[k]=v;save();var y=window.scrollY;render();window.scrollTo(0,y);}
function submitFinal(){var m=$('fm');var miss=C.final.filter(function(q){return !S.ans[q.k];}).length;
 if(miss){m.className='msg err';m.textContent='還有 '+miss+' 題沒有作答。';return;}
 var c=C.final.filter(function(q){return fnv(C.id+'|'+q.k+'|'+S.ans[q.k])===q.h;}).length;
 if(c===C.final.length){sfx('stamp');if(C.confront){S.finalOk=true;S.conf=0;S.cw=0;save();render();window.scrollTo(0,0);story('最終章',C.confront.title,C.confront.intro,'開始');return;}S.solved=true;S.t1=Date.now();var r=rank();S.rank=r[0];save();render();window.scrollTo(0,0);return;}
 S.wf++;save();sfx('bad');m.className='msg err';m.textContent=C.final.length+' 題中答對 '+c+' 題。推理還有破綻，回頭再檢查卷宗。';}
function hintsUsed(){var n=0;for(var k in S.hints)n+=S.hints[k];return n;}
function rank(){var sc=hintsUsed()+S.wg*0.5+S.wf*2+(S.wc||0)*0.5;
 return sc<=2?['S','傳奇搭檔']:sc<=5?['A','王牌探員']:sc<=9?['B','稱職調查員']:['C','見習調查員'];}
function vEnd(){var r=rank();var got=0;C.bts.forEach(function(b){if(S.un[b.id])got++;});
 var h='<div class="paper" style="margin-top:18px">'+H('舊案重啟小組','第'+C.no+'案　結案報告','已破')+b64(C.ending)+'</div>';
 if(C.choice){h+='<div class="card"><h3>最後的決定</h3><p>'+C.choice.q+'</p>';
  if(S.choice===null)h+='<div class="opts" style="margin-top:10px">'+C.choice.opts.map(function(o,i){return '<button class="opt" onclick="pickEnd('+i+')">'+o[0]+'</button>';}).join('')+'</div>';
  else h+='<p style="color:#e9d3a8"><b>你們選擇了：</b>'+C.choice.opts[S.choice][0]+'</p><div style="font-family:\'Noto Serif TC\',serif;font-size:15.5px;line-height:2;color:#e9dcc4;border-top:1px solid var(--line);margin-top:10px;padding-top:6px">'+b64(C.choice.opts[S.choice][1])+'</div><button class="btn ghost small" onclick="S.choice=null;save();render()">看看另一種選擇</button>';
  h+='</div>';}
 h+='<div class="card rank"><div class="g">'+r[0]+'</div><div class="n">'+r[1]+'</div><div class="stats"><div><b>'+fmtT(S.t1-S.t0)+'</b>歷時</div><div><b>'+hintsUsed()+'</b>提示</div><div><b>'+(S.wg+S.wf+(S.wc||0))+'</b>失誤</div><div><b>'+got+'/'+C.bts.length+'</b>偵訊突破</div></div></div>';
 var bd=[];if(!hintsUsed())bd.push('不靠提示');if(!S.wf)bd.push('一次結案');if(got===C.bts.length)bd.push('滴水不漏');if(C.confront&&S.finalOk&&!S.wc)bd.push('完美對質');if(S.t1-S.t0<90*60000)bd.push('閃電破案');
 if(bd.length)h+='<div class="card"><h3>獲得稱號</h3><p>'+bd.map(function(x){return '<span class="chip" style="margin:0 6px 6px 0;display:inline-block">'+x+'</span>';}).join('')+'</p></div>';
 var pk=[];for(var g=1;g<=nG();g++)if(S.picks[g]!==undefined)pk.push('<li>第'+NUM[g-1]+'章後：<b style="color:#f0e2c6">'+pkName(S.picks[g])+'</b>'+(peerPick(g)?'　／　夥伴：<b style="color:#f0e2c6">'+pkName(peerPick(g).picks[g])+'</b>':'')+'</li>');
 if(pk.length)h+='<div class="card"><h3>你的懷疑紀錄</h3><ol class="db" style="list-style:none;padding:0">'+pk.join('')+'</ol><p class="small">和夥伴比一比：誰先看對了方向？</p></div>';
 h+='<div class="card"><h3>結案後，聊一聊</h3><ol class="db">'+C.debrief.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol></div>';
 h+='<button class="btn" style="width:100%;padding:14px" onclick="home()">回到案件列表</button>';return h;}
function pickEnd(i){S.chs=1;S.choice=i;save();var y=window.scrollY;render();window.scrollTo(0,y);}
function vNotes(){return '<p class="small" style="margin:16px 0 8px">筆記只存在這支手機上。</p><textarea id="notes" placeholder="時間軸、矛盾點、夥伴告訴你的線索……">'+(S.notes||'').replace(/</g,'&lt;')+'</textarea>';}
function resetCase(){ask('要重置「'+C.title+'」嗎？同步連線時，夥伴的進度也會一起重置。',function(){S=blank();S.ep=Date.now();save();render();});}
/* ---------- realtime sync ---------- */
var SY={db:null,uid:null,unsub:null,cid:null,peers:{},st:'off',canW:true,busy:false,dirty:false,last:'',q:false,tm:null};
function lid(){var k='oc_lid',v=null;try{v=localStorage.getItem(k);}catch(e){}if(!v){v='l'+Math.random().toString(36).slice(2,12);try{localStorage.setItem(k,v);}catch(e){}}return v;}
function modalOn(){return $('modal').classList.contains('on');}
function pkName(id){var s=id?susById(id):null;return s?s.name:'還看不出來';}
function gateStory(){sfx('stamp');vib(120);pendPick=true;var i=S.gate-1,last=S.gate>=nG();
 story(last?'最終章':'第'+NUM[S.gate]+'章',last?'結案':C.chapters[S.gate],C.chapterIntro[i],last?'前往結案報告':'打開新的卷宗');if(last){S.tab='final';save();}}
function payload(){return {role:S.role||'',gate:S.gate,un:S.un,picks:S.picks,finalOk:!!S.finalOk,conf:S.conf|0,solved:!!S.solved,choice:S.choice===null?-1:S.choice,ep:S.ep||0};}
function syncPush(){if(!SY.db||!C||SY.cid!==C.id||!SY.canW||!S||S.role==='X')return;
 var p=JSON.stringify(payload());if(p===SY.last)return;if(SY.busy){SY.dirty=true;return;}
 SY.busy=true;SY.last=p;var done=function(){SY.busy=false;if(SY.dirty){SY.dirty=false;try{syncPush();}catch(e){}}};
 try{SY.db.collection('games/'+SY.cid+'/players').doc(SY.uid).set(JSON.parse(p)).then(done,function(e){var c=e&&e.code;if(c!=='unavailable'&&c!=='resource_exhausted'){SY.canW=false;syLineUp();}else SY.last='';SY.busy=false;});}catch(e){SY.busy=false;}}
function syncClose(){if(SY.unsub){try{SY.unsub();}catch(e){}}SY.unsub=null;SY.cid=null;SY.peers={};SY.last='';clearTimeout(SY.tm);}
function syncOpen(){if(!SY.db||!SY.uid||!C||!S||!S.role||S.role==='X')return;if(SY.cid===C.id)return;syncClose();SY.cid=C.id;SY.st='conn';
 SY.tm=setTimeout(function(){if(SY.st==='conn'){SY.st='slow';syLineUp();}},10000);
 try{SY.unsub=SY.db.collection('games/'+C.id+'/players').onSnapshot(onSnap,function(){SY.st='err';syLineUp();});}catch(e){SY.st='err';}
 syncPush();}
function onSnap(q){if(!C||SY.cid!==C.id||!S)return;if(!q.metadata||!q.metadata.fromCache){clearTimeout(SY.tm);SY.st='on';}
 var peers={};try{q.docs.forEach(function(d){if(d.id===SY.uid||!d.exists)return;var o=d.data();if(o&&typeof o==='object')peers[d.id]=o;});}catch(e){return;}
 SY.peers=peers;for(var id in peers){if(merge(peers[id]))break;}syLineUp();checkReveal();}
function livePeers(){var a=[];for(var id in SY.peers){var o=SY.peers[id];if((o.ep||0)===(S.ep||0)&&(o.role==='A'||o.role==='B'))a.push(o);}return a;}
function peerPick(g){if(!S||S.role==='X')return null;var a=livePeers();for(var i=0;i<a.length;i++){if(a[i].picks&&a[i].picks[g]!==undefined)return a[i];}return null;}
function soft(){if(modalOn()||S.tab==='notes')return;var y=window.scrollY;render();window.scrollTo(0,y);}
function merge(o){var ep=+o.ep||0,my=S.ep||0;if(ep<my)return false;
 if(ep>my){var role=S.role;S=blank();S.role=role;S.ep=ep;S.t0=Date.now();SY.q=false;pendPick=false;save();if(modalOn()){$('modal').classList.remove('on');document.body.style.overflow='';}dlgHide();render();toast('夥伴重置了本案');return true;}
 var ch=false,nb=0,n=nG(),g=o.gate|0;
 if(o.un&&typeof o.un==='object')C.bts.forEach(function(b){if(o.un[b.id]&&!S.un[b.id]){S.un[b.id]=1;nb++;}});
 var adv=false;if(g>S.gate&&g<=n){S.gate=g;adv=true;}
 var fin=false;if(o.finalOk&&!S.finalOk&&S.gate>=n&&C.confront){S.finalOk=true;S.conf=0;S.cw=0;S.tab='final';fin=true;}
 if(S.finalOk&&C.confront&&(o.conf|0)>S.conf){S.conf=Math.min(o.conf|0,C.confront.rounds.length);S.cw=0;ch=true;}
 var win=false;if(o.solved&&!S.solved&&S.finalOk){S.solved=true;S.conf=C.confront?C.confront.rounds.length:0;S.t1=Date.now();S.rank=rank()[0];win=true;}
 if(S.solved&&C.choice&&S.choice===null&&!S.chs&&typeof o.choice==='number'&&o.choice>=0&&o.choice<C.choice.opts.length){S.choice=o.choice;S.chs=1;ch=true;}
 if(!(nb||adv||fin||ch||win))return false;
 save();
 if(nb){sfx('ok');toast('🔓 夥伴問出了新的偵訊紀錄');}
 if(adv){if(modalOn())SY.q=true;else{render();gateStory();}toast('夥伴解開了密碼');}
 else if(fin){if(!modalOn()){render();window.scrollTo(0,0);story('最終章',C.confront.title,C.confront.intro,'開始');}toast('結案報告通過，進入最後一幕');}
 else if(win){sfx('win');toast('結案');soft();}
 else soft();
 return false;}
function checkReveal(){if(!C||!S||S.role==='X'||!SY.db)return;if($('dlg').classList.contains('on')||modalOn())return;
 for(var g=1;g<=nG();g++){if(S.picks[g]===undefined||S.rev[g])continue;var o=peerPick(g);if(!o)continue;S.rev[g]=1;try{localStorage.setItem(C.key,JSON.stringify(S));}catch(e){}
  var same=(o.picks[g]||'')===(S.picks[g]||'');sfx('stamp');
  dlgShow('<div class="who">第'+NUM[g-1]+'章・同時揭曉</div><div class="stats" style="grid-template-columns:1fr 1fr;margin:6px 0 14px"><div>你<b style="font-size:18px;margin-top:4px">'+pkName(S.picks[g])+'</b></div><div>夥伴<b style="font-size:18px;margin-top:4px">'+pkName(o.picks[g])+'</b></div></div><p class="small" style="margin:0 0 12px;text-align:center">'+(same?'你們想的一樣。':'你們看法不同。說服對方試試看。')+'</p><button class="btn" style="width:100%" onclick="dlgHide()">繼續</button>');return;}}
function syLine(){if(!S||S.role==='X')return '';
 if(!SY.db)return '<div class="sy"><i></i>同步未連線・偵訊紀錄請用代碼交換</div>';
 if(SY.st==='err')return '<div class="sy"><i></i>同步中斷・請改用代碼</div>';
 var a=livePeers(),w=SY.canW?'':'（你的帳號只能接收，無法送出）';
 if(SY.st==='conn')return '<div class="sy wait"><i></i>同步連線中…</div>';
 if(SY.st==='slow'&&!a.length)return '<div class="sy wait"><i></i>同步還連不上，資料可能不是最新</div>';
 if(!a.length)return '<div class="sy wait"><i></i>同步已開啟・等待夥伴進入本案'+w+'</div>';
 var o=a[0],g=o.gate|0;return '<div class="sy on"><i></i>已同步・夥伴：'+ROLES[o.role].name+'　'+(o.solved?'已結案':g>=nG()?'結案階段':'第'+NUM[g]+'章')+(o.role===S.role?'　⚠ 你們選了同一組':'')+w+'</div>';}
function syLineUp(){var e=$('syst');if(e&&S)e.innerHTML=syLine();}
(function(){try{if(!window.claude||!window.claude.use)return;
 Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){if(!r[0])return;
  var u=r[1];return Promise.resolve(u?u.id():null).then(function(id){SY.uid=id||lid();SY.db=r[0];if(C&&S&&S.role){syncOpen();syLineUp();}});}).catch(function(){});}catch(e){}})();
home();
</script>
</body>
</html>
