又感冒的人，在零下六度的夜裡，自己走了八十公尺然後趴下？</p><p>小組重新化驗了當年留下的血。山莊的住房資料也找到了。</p>","<p>他死在 203 號房的浴缸裡。那間房，登記的不是他的名字。</p><p>「隊長每天晚上十一點一定要泡澡。」這句話，晚餐桌上每個人都聽到了。</p><p>是誰把他從二樓搬到了雪地上？現在可以去找當年的人當面談了。</p>","<p>搬走遺體的人找到了。</p><p>但是，一個想把意外藏起來的人，和一個製造意外的人，可能不是同一個。</p><p>排氣管為什麼會被堵住？最後一批卷宗。</p>","<p>請兩位討論後，提交結案報告。</p><p>這一次，每一題都不能只靠猜。</p>"],"docs":[{"id":"S0","role":"S","stage":1,"icon":"note","title":"調查委託信","sub":"2026 年・方雅婷","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組・收件紀錄</div><h2>調查委託</h2></div><span class=\"tag\">優先</span></div><p class=\"hand\">調查小組您好：</p><p class=\"hand\">我是方雅婷。十五年前的冬天，我在雲杉山莊辦了一場聚會，紀念過世的姊姊雅琪。聚會的第二天早上，羅建宏大哥死在雪地裡。警察說他喝了酒，自己走出去，凍死了。</p><p class=\"hand\">我不相信。羅大哥那天感冒，整晚都說冷。他是我見過最怕冷的登山人。</p><p class=\"hand\">還有一件事我一直沒講。出事前一個禮拜，羅大哥打電話給我：「雅婷，山上見面的時候，我有東西給妳看。」我到現在都不知道是什麼。</p><p class=\"hand\">當年在場的每一個人，包括我在內，都有嫌疑。請不要因為我是委託人就放過我。</p><div class=\"note\"><b>任務說明</b><br>兩人分屬<b>證詞組</b>與<b>鑑識組</b>，各自只拿到一半卷宗。請用通話或訊息交換資訊，<b>只能用說的或打字描述，不要截圖給對方</b>。<br>本案共四章，每章破解一道密碼才會開啟下一批卷宗。<br>照片類證物可以<b>點開放大</b>，有些細節只有放大才看得見。<br>卷宗裡出現的時間（例如 22:40）可以點一下，加入「線索板」的時間軸。<br>結案報告共九題，其中一題要自己填寫。</div>"},{"id":"S1","role":"S","stage":1,"icon":"folder","title":"案件摘要（2011）","sub":"南投縣警察局仁愛分局","body":"<div class=\"hd\"><div><div class=\"org\">南投縣警察局　仁愛分局</div><h2>雲杉山莊住客死亡案　摘要</h2></div><span class=\"tag\">行政簽結</span></div><table><tr><th style=\"width:26%\">死者</th><td>羅建宏，40 歲，《山岳視野》雜誌攝影記者</td></tr><tr><th>發現</th><td>2011/1/16 06:30，山莊負責人許正雄於後門外約 80 公尺之步道口發現</td></tr><tr><th>現場</th><td>死者俯臥於雪地，著外套及登山鞋，身上覆雪</td></tr><tr><th>天候</th><td>1/15 14:00 起降雪，16:00 道路封閉；1/16 11:00 搶通</td></tr><tr><th>在場者</th><td>許正雄（山莊負責人）、潘秀蘭（員工）、高志遠、沈佩珊、方雅婷（住客）</td></tr></table><p><b>研判：</b>死者晚間飲酒後，凌晨自行外出（原因不明），因低溫失去意識，失溫致死。無外傷，無他殺嫌疑。</p><p><b>備註：</b>住客皆為 1996 年某大學登山社「南稜山難」之關係人，此行為罹難者方雅琪之紀念聚會。山莊各客房未設門鎖。</p>"},{"id":"A1","role":"A","stage":1,"icon":"mic","title":"許正雄 筆錄","sub":"山莊負責人・2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　調查筆錄</div><h2>關係人：許正雄（60 歲，雲杉山莊負責人）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：發現經過？</p><p class=\"a\">答：早上六點半，我穿雨鞋去後門鏟雪，看到步道口有一團東西。他臉朝下趴著，身上都是雪。我只摸了脖子，冰的，就跑回去叫人。</p><p class=\"q\">問：你有沒有翻動他？</p><p class=\"a\">答：沒有。我在山上三十年，知道不能亂動。是沈醫師出來以後翻的。</p><p class=\"q\">問：昨晚你的行蹤？</p><p class=\"a\">答：晚餐後在交誼廳陪客人喝酒。十點十五分去前院發電機房加油、檢查，十一點回來，就進帳房的無線電室。那晚台 14 甲線有車受困，管理站一直呼叫。</p><p class=\"q\">問：晚上有人離開交誼廳嗎？</p><p class=\"a\">答：沈醫師九點半說頭痛先上樓。高先生九點四十分說上樓拿菸，十分多鐘才下來。其他人一直都在，到我十點十五分出去為止。</p><p class=\"q\">問：你和住客熟嗎？</p><p class=\"a\">答：高先生是山莊股東，這次是他跟我訂的房，房間也是他排的。其他人第一次見。</p><p class=\"q\">問：後門和器材室有上鎖嗎？</p><p class=\"a\">答：山上不鎖門的。萬一半夜要逃生怎麼辦。</p>"},{"id":"A2","role":"A","stage":1,"icon":"mic","title":"高志遠 筆錄","sub":"住客・2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　調查筆錄</div><h2>關係人：高志遠（41 歲，志遠戶外董事長）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：你和死者的關係？</p><p class=\"a\">答：大學登山社的學弟，認識二十年了。</p><p class=\"q\">問：昨晚的情形？</p><p class=\"a\">答：大家吃飯、喝酒、聊以前的事。建宏感冒，喝得不多，心情不好。十點半左右他說要去泡個熱水澡，之後我就沒再見到他。</p><p class=\"q\">問：你自己呢？</p><p class=\"a\">答：十點半上樓整理行李，十一點十分下來，和雅婷在交誼廳聊到兩點四十分左右，然後回房睡覺。</p><p class=\"q\">問：你覺得他為什麼半夜出去？</p><p class=\"a\">答：不知道。也許是想一個人靜一靜。他一直放不下當年的事。</p><p class=\"q\">問：晚餐時有什麼特別的嗎？</p><p class=\"a\">答：沒什麼。他們還笑我，說隊長十五年了還是一樣，每天晚上十一點一定要泡熱水澡。</p>"},{"id":"A3","role":"A","stage":1,"icon":"mic","title":"沈佩珊 筆錄","sub":"住客・2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　調查筆錄</div><h2>關係人：沈佩珊（39 歲，埔里仁慈醫院急診科醫師）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨晚的情形？</p><p class=\"a\">答：我有高山反應，頭很痛。大概九點半回房間，吃了安眠藥就睡了，一覺到早上被許先生叫醒。</p><p class=\"q\">問：你檢視了遺體？</p><p class=\"a\">答：是。他俯臥在雪地，我把他翻過來確認，已經沒有生命跡象，四肢僵硬，皮膚呈粉紅色。這在低溫死亡很常見。</p><p class=\"q\">問：依你判斷，死亡時間？</p><p class=\"a\">答：屍體在雪地裡很難估，我推測是凌晨四、五點。</p><p class=\"q\">問：死因？</p><p class=\"a\">答：失溫。酒精會讓人誤判體感溫度，他又感冒。這種案例我在急診看過不少。</p><p class=\"q\">問：你和死者的關係？</p><p class=\"a\">答：登山社的老朋友。（停頓）他是個好人。</p>"},{"id":"A4","role":"A","stage":1,"icon":"mic","title":"方雅婷 筆錄","sub":"住客・2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　調查筆錄</div><h2>關係人：方雅婷（34 歲，國中教師）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：這次聚會是你發起的？</p><p class=\"a\">答：是。去年九月，山上找到了我姊姊的遺骸和背包。我想請當年的隊員一起來送她一程。</p><p class=\"q\">問：昨晚的情形？</p><p class=\"a\">答：羅大哥一直發抖，他近視很深，眼鏡起霧了一直擦。十點半他說要去泡澡。之後我和高志遠在交誼廳待到兩點四十分，潘姐中間送過薑茶。</p><p class=\"q\">問：聚會上有什麼特別的事？</p><p class=\"a\">答：高志遠送每個人一個藍色的防水收納袋，說是他公司的新產品。</p><p class=\"q\">問：你覺得羅建宏會自己半夜走出去嗎？</p><p class=\"a\">答：不會。絕對不會。</p>"},{"id":"A5","role":"A","stage":1,"icon":"mic","title":"潘秀蘭 筆錄","sub":"山莊員工・2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　調查筆錄</div><h2>關係人：潘秀蘭（50 歲，山莊房務兼廚務）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨晚你做了哪些事？</p><p class=\"a\">答：煮飯、收餐廳。九點四十五分上二樓送毯子到 202。十點四十分又上去送浴巾。半夜一點四十五分端薑茶到交誼廳，然後老闆叫我進無線電室幫忙抄座標，抄到兩點二十分左右，我就去睡了。</p><p class=\"q\">問：半夜有聽到什麼聲音嗎？</p><p class=\"a\">答：風很大，什麼都聽不清楚。</p><p class=\"q\">問：羅先生有什麼異狀？</p><p class=\"a\">答：他說他房間沒熱水，很想泡個澡。很客氣的一個人。</p><p class=\"small\">（筆錄僅半頁。本案以意外結案，員警未再追問。）</p>"},{"id":"A6","role":"A","stage":1,"icon":"note","title":"氣象站逐時降雪紀錄","sub":"中央氣象局函覆","body":"<div class=\"hd\"><div><div class=\"org\">中央氣象局　函覆仁愛分局</div><h2>雲杉山莊自動氣象站　逐時新增積雪</h2></div><span class=\"tag\">函覆</span></div><table><tr><th>時段</th><th>新增積雪</th><th>氣溫</th></tr><tr><td>1/15 22:00–23:00</td><td>2 cm</td><td>-4°C</td></tr><tr><td>23:00–00:00</td><td>2 cm</td><td>-5°C</td></tr><tr><td>1/16 00:00–01:00</td><td>3 cm</td><td>-5°C</td></tr><tr><td>01:00–02:00</td><td>3 cm</td><td>-6°C</td></tr><tr><td>02:00–03:00</td><td>4 cm</td><td>-6°C</td></tr><tr><td>03:00–04:00</td><td>2 cm</td><td>-6°C</td></tr><tr><td>04:00 以後</td><td>0（降雪停止）</td><td>-7°C</td></tr></table><p>備註：各時段內降雪強度大致均勻。整夜無明顯融雪，風向穩定。</p>"},{"id":"B1","role":"B","stage":1,"icon":"finger","title":"相驗報告（2011）","sub":"南投地檢署","body":"<div class=\"hd\"><div><div class=\"org\">臺灣南投地方法院檢察署</div><h2>相驗屍體證明書（附檢驗紀錄）</h2></div><span class=\"tag\">相驗</span></div><table><tr><th style=\"width:26%\">死亡原因</th><td>低體溫症（意外）</td></tr><tr><th>外觀</th><td>無外傷、無抵抗傷。皮膚及屍斑呈鮮紅色。（檢驗員註：低溫環境下屍斑可呈鮮紅色）</td></tr><tr><th>屍斑位置</th><td>背部、臀部、小腿後側，指壓不褪。</td></tr><tr><th>發現姿勢</th><td>俯臥。（檢驗員註：據報曾有人翻動屍體，故屍斑與姿勢不符，不另探究）</td></tr><tr><th>酒精</th><td>血中酒精濃度 0.03%（微量）</td></tr><tr><th>解剖</th><td>家屬無異議，未解剖。採血 10 mL 留存。</td></tr></table>"},{"id":"B2","role":"B","stage":1,"icon":"finger","title":"現場勘察紀錄（2011）","sub":"步道口","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　偵查隊</div><h2>現場勘察紀錄</h2></div><span class=\"tag\">勘察</span></div><p><b>位置：</b>山莊後門外約 80 公尺，步道口指示牌旁。</p><p><b>遺體覆雪：</b>06:35 拍攝時遺體尚未翻動，背部覆雪均勻、無擾動。厚度依照片中比例尺判讀（見照片 3）。</p><p><b>足跡：</b>後門至步道口之間無可辨識足跡或拖痕，研判已遭降雪覆蓋。</p><p><b>遺體下方：</b>身體正下方有積雪，已壓實。</p>"},{"id":"B3","role":"B","stage":1,"icon":"photo","title":"現場照片 3","sub":"2011/1/16 06:35","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　偵查隊</div><h2>現場照片 3　遺體覆雪（翻動前）</h2></div><span class=\"tag\">照片</span></div><figure class=\"ev\"><svg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Serif TC,serif\">\n<defs><linearGradient id=\"sk\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#5b6577\"/><stop offset=\"1\" stop-color=\"#a9adb3\"/></linearGradient></defs>\n<rect width=\"400\" height=\"300\" fill=\"url(#sk)\"/>\n<g fill=\"#2d3833\"><path d=\"M30 70l-16 40h32z\"/><rect x=\"28\" y=\"110\" width=\"4\" height=\"10\"/><path d=\"M70 42l-16 54h32z\"/><rect x=\"68\" y=\"96\" width=\"4\" height=\"10\"/><path d=\"M330 50l-16 50h32z\"/><rect x=\"328\" y=\"100\" width=\"4\" height=\"10\"/><path d=\"M372 76l-16 36h32z\"/><rect x=\"370\" y=\"112\" width=\"4\" height=\"10\"/><path d=\"M300 90l-16 30h32z\"/><rect x=\"298\" y=\"120\" width=\"4\" height=\"10\"/></g>\n<path d=\"M0 120Q200 104 400 124V300H0z\" fill=\"#e9ecef\"/><path d=\"M0 150Q200 140 400 156\" stroke=\"#d3d8dd\" fill=\"none\"/>\n<rect x=\"90\" y=\"96\" width=\"5\" height=\"44\" fill=\"#5a4636\"/><rect x=\"66\" y=\"92\" width=\"54\" height=\"16\" fill=\"#7a5f46\"/><text x=\"93\" y=\"103\" text-anchor=\"middle\" font-size=\"6\" fill=\"#efe6d2\">雲杉步道</text>\n<path d=\"M116 214c24-26 160-30 188-6 10 10 6 22-10 26-40 10-140 12-170 2-16-4-16-14-8-22z\" fill=\"#f6f7f8\" stroke=\"#cfd5db\"/>\n<path d=\"M150 226c-4-8 6-12 12-10M268 218c8-2 14 6 10 10\" stroke=\"#24324a\" stroke-width=\"2\" fill=\"none\" opacity=\".55\"/>\n<rect x=\"206\" y=\"152\" width=\"9\" height=\"72\" fill=\"#e7c63a\" stroke=\"#8a7414\" stroke-width=\".6\"/>\n<g stroke=\"#2a2420\" stroke-width=\".5\"><path d=\"M206 222h5\"/><path d=\"M206 217.6h3\"/><path d=\"M206 213.2h3\"/><path d=\"M206 208.8h3\"/><path d=\"M206 204.4h3\"/><path d=\"M206 200h5\"/><path d=\"M206 195.6h3\"/><path d=\"M206 191.2h3\"/><path d=\"M206 186.8h3\"/><path d=\"M206 182.4h3\"/><path d=\"M206 178h5\"/><path d=\"M206 173.6h3\"/><path d=\"M206 169.2h3\"/><path d=\"M206 164.8h3\"/><path d=\"M206 160.39999999999998h3\"/><path d=\"M206 156h5\"/></g>\n<g font-size=\"2.6\" fill=\"#2a2420\"><text x=\"212.4\" y=\"223\">0</text><text x=\"212.4\" y=\"218.6\">1</text><text x=\"212.4\" y=\"214.2\">2</text><text x=\"212.4\" y=\"209.8\">3</text><text x=\"212.4\" y=\"205.4\">4</text><text x=\"212.4\" y=\"201\">5</text><text x=\"212.4\" y=\"196.6\">6</text><text x=\"212.4\" y=\"192.2\">7</text><text x=\"212.4\" y=\"187.8\">8</text><text x=\"212.4\" y=\"183.4\">9</text><text x=\"212.4\" y=\"179\">10</text><text x=\"212.4\" y=\"174.6\">11</text><text x=\"212.4\" y=\"170.2\">12</text><text x=\"212.4\" y=\"165.8\">13</text><text x=\"212.4\" y=\"161.39999999999998\">14</text><text x=\"212.4\" y=\"157\">15</text></g>\n<path d=\"M196 187.6c8 1 18 1 28-.6\" stroke=\"#cfd5db\" fill=\"none\"/>\n<rect x=\"206\" y=\"187.8\" width=\"9\" height=\"36\" fill=\"#f6f7f8\" opacity=\".92\"/>\n<text x=\"394\" y=\"294\" text-anchor=\"end\" font-size=\"9\" font-family=\"monospace\" fill=\"#ef7d2b\">2011 01 16  06:35</text>\n</svg><figcaption>黃色為插入雪中的比例尺，刻度單位公分，0 為遺體背部表面。<span>🔍 點擊放大</span></figcaption></figure>"},{"id":"B4","role":"B","stage":1,"icon":"folder","title":"器材室清點","sub":"2011/1/16","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　偵查隊</div><h2>山莊一樓器材室　物品清點</h2></div><span class=\"tag\">清點</span></div><table><tr><th>品項</th><th>數量</th><th>備註</th></tr><tr><td>雪鏟</td><td>3</td><td></td></tr><tr><td>冰爪</td><td>6 雙</td><td></td></tr><tr><td>橘色塑膠救難拖板</td><td>1</td><td>靠牆直立。<b>表面潮濕，底部有融雪水漬</b>。許正雄稱上週之後沒人用過</td></tr><tr><td>登山繩</td><td>2 捆</td><td></td></tr></table><p>器材室位於後門旁，未上鎖。</p>"},{"id":"B5","role":"B","stage":1,"icon":"folder","title":"死者衣物及隨身物品","sub":"2011 相驗附件","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　偵查隊</div><h2>死者衣物及隨身物品清單</h2></div><span class=\"tag\">附件</span></div><table><tr><th>品項</th><th>記錄</th></tr><tr><td>羽絨外套</td><td>深藍色，<b>L 號</b>，內襯繡「C.Y. KAO」。（死者身高 182 cm，平日穿 XL）</td></tr><tr><td>上衣</td><td>長袖排汗衣，<b>前後穿反</b></td></tr><tr><td>長褲</td><td>刷毛褲，未繫腰繩</td></tr><tr><td>登山鞋</td><td>死者本人所有。未穿襪。鞋帶綁法見照片 7（第三章）</td></tr><tr><td>眼鏡</td><td><b>無</b>。現場及周邊雪地均未尋獲</td></tr><tr><td>頭髮</td><td>髮根結冰</td></tr></table>"},{"id":"A7","role":"A","stage":2,"icon":"map","title":"住宿登記與二樓平面圖","sub":"雲杉山莊","body":"<div class=\"hd\"><div><div class=\"org\">雲杉山莊</div><h2>住宿登記（2011/1/15）及二樓平面圖</h2></div><span class=\"tag\">附件</span></div><table><tr><th>房號</th><th>登記住客</th><th>到達</th></tr><tr><td>201</td><td>—（空房）</td><td></td></tr><tr><td>202</td><td>方雅婷</td><td>16:20</td></tr><tr><td>203</td><td>高志遠（附浴缸）</td><td>14:50（自行開車）</td></tr><tr><td>204</td><td>沈佩珊</td><td>16:20</td></tr><tr><td>205</td><td>羅建宏</td><td>16:35</td></tr><tr><td>206</td><td>—（儲物）</td><td></td></tr></table><p class=\"small\">訂房人：高志遠（股東），房間由訂房人指定。</p><svg viewBox=\"0 0 340 250\" font-family=\"Noto Sans TC,sans-serif\" font-size=\"10\" fill=\"#2a2420\">\n<text x=\"170\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6b5a48\">（北側：後側維修陽台，面向山谷）</text>\n<rect x=\"20\" y=\"18\" width=\"300\" height=\"22\" fill=\"rgba(160,120,70,.12)\" stroke=\"#2a2420\"/>\n<text x=\"170\" y=\"33\" text-anchor=\"middle\" font-size=\"9\">後側維修陽台（各房浴室排氣口朝此）</text>\n<g fill=\"#a3302a\"><circle cx=\"145\" cy=\"40\" r=\"4\"/><circle cx=\"295\" cy=\"40\" r=\"4\"/></g>\n<g stroke=\"#2a2420\" stroke-width=\"1.5\" fill=\"none\"><rect x=\"20\" y=\"40\" width=\"50\" height=\"90\"/><rect x=\"70\" y=\"40\" width=\"50\" height=\"90\"/><rect x=\"120\" y=\"40\" width=\"50\" height=\"90\"/><rect x=\"170\" y=\"40\" width=\"50\" height=\"90\"/><rect x=\"220\" y=\"40\" width=\"50\" height=\"90\"/><rect x=\"270\" y=\"40\" width=\"50\" height=\"90\"/></g>\n<g text-anchor=\"middle\" font-weight=\"700\" font-size=\"12\"><text x=\"45\" y=\"92\">201</text><text x=\"95\" y=\"92\">202</text><text x=\"145\" y=\"92\">203</text><text x=\"195\" y=\"92\">204</text><text x=\"245\" y=\"92\">205</text><text x=\"295\" y=\"92\">206</text></g>\n<g text-anchor=\"middle\" font-size=\"8\" fill=\"#6b5a48\"><text x=\"45\" y=\"58\">浴室</text><text x=\"95\" y=\"58\">浴室</text><text x=\"145\" y=\"58\">浴室</text><text x=\"195\" y=\"58\">浴室</text><text x=\"245\" y=\"58\">浴室</text><text x=\"295\" y=\"58\">浴室</text></g>\n<rect x=\"16\" y=\"20\" width=\"6\" height=\"18\" fill=\"#efe6d2\" stroke=\"#a3302a\" stroke-width=\"1.5\"/><text x=\"6\" y=\"56\" font-size=\"8\" fill=\"#a3302a\">陽台門</text>\n<rect x=\"20\" y=\"130\" width=\"300\" height=\"34\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"170\" y=\"151\" text-anchor=\"middle\">二樓走廊（鋪地毯）</text>\n<g stroke=\"#2a2420\" fill=\"none\"><rect x=\"20\" y=\"172\" width=\"70\" height=\"40\"/><path d=\"M34 172v40M48 172v40M62 172v40M76 172v40\"/>\n<rect x=\"250\" y=\"172\" width=\"70\" height=\"40\"/><path d=\"M264 172v40M278 172v40M292 172v40M306 172v40\"/></g>\n<text x=\"55\" y=\"226\" text-anchor=\"middle\" font-size=\"9\">前樓梯 → 一樓交誼廳</text>\n<text x=\"285\" y=\"226\" text-anchor=\"middle\" font-size=\"9\">後樓梯 → 後門、器材室、廚房</text>\n<circle cx=\"24\" cy=\"240\" r=\"4\" fill=\"#a3302a\"/><text x=\"32\" y=\"243\" font-size=\"8.5\">屋內型瓦斯熱水器的排氣口</text>\n</svg>"},{"id":"A8","role":"A","stage":2,"icon":"pen","title":"房務紀錄簿","sub":"潘秀蘭手寫・1/16","body":"<div class=\"hd\"><div><div class=\"org\">雲杉山莊</div><h2>房務紀錄簿（1/16 下午，警察離開後）</h2></div><span class=\"tag\">原件</span></div><p class=\"hand\">205：床有人睡過。高先生的行李在裡面。</p><p class=\"hand\">203：浴缸一缸冷水沒放。洗手台上一副黑框眼鏡，鏡片很厚。拿去還高先生，高先生說不是他的。窗戶開著，雪飄進來，我入冬封的防寒膠條被撕開了。浴室地板很濕。</p><p class=\"hand\">204：沈醫師自己整理得很乾淨。</p><p class=\"hand\">帳房天花板有一大塊水漬，燈罩裡也有水。老闆說是屋頂融雪。</p>"},{"id":"B6","role":"B","stage":2,"icon":"finger","title":"2026 血液複驗","sub":"法醫研究所","body":"<div class=\"hd\"><div><div class=\"org\">法務部法醫研究所（2026 年）</div><h2>留存血液檢體　毒藥物複驗報告</h2></div><span class=\"tag\">新事證</span></div><table><tr><th>項目</th><th>結果</th></tr><tr><td>一氧化碳血紅素（COHb）</td><td><b>58%</b>（致死濃度）</td></tr><tr><td>安眠鎮靜藥物</td><td>未檢出</td></tr></table><p><b>意見：</b>死因應為<b>一氧化碳中毒</b>，非低體溫症。達此濃度者已喪失行動能力，不可能自行步行至戶外；開放戶外亦無法累積此濃度。</p><p>屍斑固定於背側，表示死者死後<b>仰臥至少一至兩小時</b>，之後才被改為俯臥。</p>"},{"id":"B7","role":"B","stage":2,"icon":"finger","title":"2026 熱水設備勘驗","sub":"雲杉山莊舊址","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>雲杉山莊舊址　熱水設備勘驗</h2></div><span class=\"tag\">新事證</span></div><table><tr><th>房號</th><th>熱水設備</th></tr><tr><td>201、202、204、205</td><td>電熱水器（2009 年更新）</td></tr><tr><td><b>203</b></td><td><b>屋內型瓦斯熱水器</b>，裝於浴室內，排氣管穿牆通往後側維修陽台。浴室附浴缸。</td></tr><tr><td>206</td><td>同 203 型式，瓦斯已拆除，未使用。</td></tr></table><p>此型熱水器若排氣受阻，於密閉浴室內約 20–30 分鐘即可累積致命濃度之一氧化碳。203 浴室窗框殘留防寒膠條，<b>自室內側撕開</b>。</p>"},{"id":"B8","role":"B","stage":2,"icon":"map","title":"一樓平面圖","sub":"雲杉山莊","body":"<div class=\"hd\"><div><div class=\"org\">雲杉山莊</div><h2>一樓平面配置圖</h2></div><span class=\"tag\">附件</span></div><svg viewBox=\"0 0 340 200\" font-family=\"Noto Sans TC,sans-serif\" font-size=\"10\" fill=\"#2a2420\">\n<text x=\"170\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6b5a48\">（北側：後門外為步道口，約 80 公尺）</text>\n<g stroke=\"#2a2420\" stroke-width=\"1.5\" fill=\"none\"><rect x=\"20\" y=\"20\" width=\"100\" height=\"90\"/><rect x=\"120\" y=\"20\" width=\"60\" height=\"90\"/>\n<rect x=\"180\" y=\"20\" width=\"70\" height=\"90\"/><rect x=\"250\" y=\"20\" width=\"70\" height=\"90\"/><rect x=\"20\" y=\"110\" width=\"300\" height=\"70\"/></g>\n<text x=\"70\" y=\"62\" text-anchor=\"middle\" font-weight=\"700\">交誼廳</text><text x=\"70\" y=\"78\" text-anchor=\"middle\" font-size=\"8\">（壁爐）</text>\n<text x=\"150\" y=\"58\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"9\">帳房兼</text><text x=\"150\" y=\"72\" text-anchor=\"middle\" font-weight=\"700\" font-size=\"9\">無線電室</text>\n<text x=\"150\" y=\"92\" text-anchor=\"middle\" font-size=\"7.5\" fill=\"#a3302a\">（203 正下方）</text>\n<text x=\"215\" y=\"62\" text-anchor=\"middle\" font-weight=\"700\">廚房</text><text x=\"215\" y=\"78\" text-anchor=\"middle\" font-size=\"8\">北窗面向步道</text>\n<text x=\"285\" y=\"62\" text-anchor=\"middle\" font-weight=\"700\">器材室</text><text x=\"285\" y=\"78\" text-anchor=\"middle\" font-size=\"8\">旁為後門</text>\n<text x=\"170\" y=\"150\" text-anchor=\"middle\">101 許正雄　102 潘秀蘭　大廳　前門</text>\n<rect x=\"310\" y=\"40\" width=\"10\" height=\"20\" fill=\"#efe6d2\" stroke=\"#a3302a\"/><text x=\"322\" y=\"36\" font-size=\"8\" fill=\"#a3302a\">後門</text>\n</svg><p class=\"small\">後樓梯下樓即為廚房、器材室與後門。</p>"},{"id":"A9","role":"A","stage":3,"icon":"pen","title":"方雅琪的日記","sub":"2010/9 隨遺骸尋獲","body":"<div class=\"hd\"><div><div class=\"org\">證物影本　1996 年南稜山難</div><h2>方雅琪　登山日記（最後數頁）</h2></div><span class=\"tag\">影本</span></div><p class=\"hand\"><b>第 4 天</b>　我摔下去了，右腿斷了。志遠說這條路沒有申請，不能讓人知道我們走南稜。他說他下去求救，叫大家都跟他走。佩珊哭著不肯走，志遠把她拉走了。建宏把他的睡袋留給我。</p><p class=\"hand\"><b>第 6 天</b>　聽到直升機，在北邊，很遠很遠。他們為什麼在那邊找？</p><p class=\"hand\"><b>第 9 天</b>　今天沒有聲音。很安靜。佩珊，不是妳的錯。</p>"},{"id":"A10","role":"A","stage":3,"icon":"cash","title":"山莊股權與借款文件","sub":"2008–2010","body":"<div class=\"hd\"><div><div class=\"org\">證物　許正雄提供</div><h2>雲杉山莊股權及借款協議（摘要）</h2></div><span class=\"tag\">影本</span></div><table><tr><th>持股</th><td>許正雄 55%、高志遠 45%</td></tr><tr><th>借款</th><td>2008 年許正雄向高志遠借款 420 萬元，以其持股設質</td></tr><tr><th>到期日</th><td>2011 年 1 月 17 日</td></tr><tr><th>違約</th><td>屆期未清償，高志遠得取得許正雄全部持股</td></tr></table><p><b>另附：</b>南投縣政府 2010 年 11 月函：雲杉山莊 203、206 號房屋內型瓦斯熱水器不符規定，<b>限 2011 年 3 月前汰換</b>，逾期勒令停業。</p>"},{"id":"A11","role":"A","stage":3,"icon":"photo","title":"山莊宣傳照（器材室）","sub":"2010 年 12 月","body":"<div class=\"hd\"><div><div class=\"org\">雲杉山莊　部落格宣傳照</div><h2>器材室一角（許正雄攝）</h2></div><span class=\"tag\">照片</span></div><figure class=\"ev\"><svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Serif TC,serif\">\n<rect width=\"400\" height=\"260\" fill=\"#6b5640\"/>\n<g stroke=\"#5a4634\" stroke-width=\"1.2\"><path d=\"M0 0V200\"/><path d=\"M20 0V200\"/><path d=\"M40 0V200\"/><path d=\"M60 0V200\"/><path d=\"M80 0V200\"/><path d=\"M100 0V200\"/><path d=\"M120 0V200\"/><path d=\"M140 0V200\"/><path d=\"M160 0V200\"/><path d=\"M180 0V200\"/><path d=\"M200 0V200\"/><path d=\"M220 0V200\"/><path d=\"M240 0V200\"/><path d=\"M260 0V200\"/><path d=\"M280 0V200\"/><path d=\"M300 0V200\"/><path d=\"M320 0V200\"/><path d=\"M340 0V200\"/><path d=\"M360 0V200\"/><path d=\"M380 0V200\"/></g>\n<rect y=\"200\" width=\"400\" height=\"60\" fill=\"#46392c\"/>\n<g stroke=\"#2a2a2a\" stroke-width=\"3\"><path d=\"M40 40V170\"/><path d=\"M62 40V170\"/><path d=\"M84 40V170\"/></g>\n<g fill=\"#6f6f6f\"><path d=\"M31 170h18l-4 22h-10z\"/><path d=\"M53 170h18l-4 22h-10z\"/><path d=\"M75 170h18l-4 22h-10z\"/></g>\n<path d=\"M150 210L188 40L246 40L230 210z\" fill=\"#e0662a\" stroke=\"#9a3f12\" stroke-width=\"2\"/>\n<path d=\"M170 196L200 56M206 196L224 56\" stroke=\"#b9501d\" stroke-width=\"2\"/>\n<rect x=\"282\" y=\"150\" width=\"86\" height=\"60\" fill=\"#8a6d4c\" stroke=\"#4a3a2a\" stroke-width=\"2\"/><rect x=\"282\" y=\"120\" width=\"86\" height=\"30\" fill=\"#9a7c58\" stroke=\"#4a3a2a\" stroke-width=\"2\"/>\n<text x=\"325\" y=\"186\" text-anchor=\"middle\" font-size=\"9\" fill=\"#2a1f16\">補給</text>\n<path d=\"M232 140C252 136 268 140 282 150M282 156C300 162 340 162 368 154\" stroke=\"#b6a37e\" stroke-width=\"2.6\" fill=\"none\"/>\n<g transform=\"translate(282 150) scale(0.42)\" fill=\"none\" stroke-linecap=\"round\">\n<path d=\"M-30 18C-18 8-8 4 0 0C8 4 18 8 30 18\" stroke=\"#7a6a52\" stroke-width=\"3.2\"/>\n<ellipse cx=\"0\" cy=\"0\" rx=\"9\" ry=\"6\" fill=\"#8a7a60\" stroke=\"#5a4a36\" stroke-width=\"1.4\"/>\n<path d=\"M-6-3C-2 2 2 2 6-3M-6 3C-2-2 2-2 6 3\" stroke=\"#5a4a36\" stroke-width=\"1\"/>\n<path d=\"M6 2C16 6 20 14 16 20C12 24 6 20 3 4\" stroke=\"#8a7a60\" stroke-width=\"2.6\"/>\n<path d=\"M3 4L1 1\" stroke=\"#5a4a36\" stroke-width=\"1.2\"/>\n<path d=\"M-6 2C-14 8-18 16-22 22\" stroke=\"#8a7a60\" stroke-width=\"2.6\"/>\n</g>\n<g fill=\"#c9c9c9\"><rect x=\"300\" y=\"60\" width=\"12\" height=\"40\" rx=\"2\"/><rect x=\"320\" y=\"60\" width=\"12\" height=\"40\" rx=\"2\"/><rect x=\"340\" y=\"60\" width=\"12\" height=\"40\" rx=\"2\"/></g>\n<text x=\"394\" y=\"252\" text-anchor=\"end\" font-size=\"8\" fill=\"#efe6d2\">雲杉山莊　器材室　2010.12</text>\n</svg><figcaption>橘色救難拖板，旁為補給箱。<span>🔍 點擊放大</span></figcaption></figure>"},{"id":"A12","role":"A","stage":3,"icon":"folder","title":"許正雄 搜救隊資料","sub":"南投縣山難搜救協會","body":"<div class=\"hd\"><div><div class=\"org\">南投縣山難搜救協會</div><h2>隊員資料</h2></div><span class=\"tag\">資料</span></div><table><tr><th>姓名</th><td>許正雄</td></tr><tr><th>年資</th><td>1990–2010</td></tr><tr><th>傷病</th><td>1995 年救援時凍傷，左腳截去兩趾，行走微跛</td></tr><tr><th>專長</th><td>雪地拖運、繩索。協會教材〈繩結篇〉由其示範：打完結後<b>將繩尾反穿回結內收尾</b>，防止拖運途中鬆脫。</td></tr></table>"},{"id":"B9","role":"B","stage":3,"icon":"note","title":"1996 山難搜救報告","sub":"南投縣消防局","body":"<div class=\"hd\"><div><div class=\"org\">南投縣消防局（1996 年）</div><h2>○○大學登山社山難　搜救結案報告</h2></div><span class=\"tag\">結案</span></div><table><tr><th>日期</th><th>經過</th></tr><tr><td>8/5</td><td>五人入山（領隊高志遠；隊員羅建宏、沈佩珊、方雅琪等）</td></tr><tr><td>8/8</td><td>方雅琪墜落受傷</td></tr><tr><td>8/9</td><td>領隊高志遠報案，回報傷者位置：「北溪源頭營地上方」</td></tr><tr><td>8/10–8/12</td><td>於北溪流域搜索三日，無所獲，因颱風終止</td></tr><tr><td>8/14–8/16</td><td>羅建宏不顧勸阻，自行返山搜尋三日</td></tr></table><div class=\"note\">2010 年 9 月補註：遺骸於<b>南稜岩窪</b>尋獲，距回報位置約 2.6 公里，分屬不同溪谷。南稜於 1996 年為未開放路線。</div>"},{"id":"B10","role":"B","stage":3,"icon":"photo","title":"照片 7　鞋帶","sub":"2011 相驗附件","body":"<div class=\"hd\"><div><div class=\"org\">仁愛分局　偵查隊</div><h2>照片 7　死者左腳鞋帶</h2></div><span class=\"tag\">照片</span></div><figure class=\"ev\"><svg viewBox=\"0 0 300 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Serif TC,serif\">\n<rect width=\"300\" height=\"220\" fill=\"#d9dde2\"/>\n<path d=\"M90 210C70 150 80 60 120 30C150 10 190 14 206 46C224 84 226 160 210 210z\" fill=\"#4a3a2c\" stroke=\"#2a1f16\" stroke-width=\"2\"/>\n<path d=\"M118 44C140 34 176 34 192 52\" stroke=\"#2a1f16\" stroke-width=\"5\" fill=\"none\"/>\n<g stroke=\"#a89878\" stroke-width=\"3\"><path d=\"M120 70L186 88M186 70L120 88\"/><path d=\"M119 92L187 110M187 92L119 110\"/><path d=\"M118 114L188 132M188 114L118 132\"/><path d=\"M117 136L189 154M189 136L117 154\"/></g>\n<g fill=\"#cfc4ae\"><circle cx=\"118\" cy=\"70\" r=\"3\"/><circle cx=\"188\" cy=\"70\" r=\"3\"/><circle cx=\"118\" cy=\"92\" r=\"3\"/><circle cx=\"188\" cy=\"92\" r=\"3\"/><circle cx=\"118\" cy=\"114\" r=\"3\"/><circle cx=\"188\" cy=\"114\" r=\"3\"/><circle cx=\"118\" cy=\"136\" r=\"3\"/><circle cx=\"188\" cy=\"136\" r=\"3\"/><circle cx=\"118\" cy=\"154\" r=\"3\"/><circle cx=\"188\" cy=\"154\" r=\"3\"/></g>\n<g transform=\"translate(153 58) scale(1)\" fill=\"none\" stroke-linecap=\"round\">\n<path d=\"M-30 18C-18 8-8 4 0 0C8 4 18 8 30 18\" stroke=\"#7a6a52\" stroke-width=\"3.2\"/>\n<ellipse cx=\"0\" cy=\"0\" rx=\"9\" ry=\"6\" fill=\"#8a7a60\" stroke=\"#5a4a36\" stroke-width=\"1.4\"/>\n<path d=\"M-6-3C-2 2 2 2 6-3M-6 3C-2-2 2-2 6 3\" stroke=\"#5a4a36\" stroke-width=\"1\"/>\n<path d=\"M6 2C16 6 20 14 16 20C12 24 6 20 3 4\" stroke=\"#8a7a60\" stroke-width=\"2.6\"/>\n<path d=\"M3 4L1 1\" stroke=\"#5a4a36\" stroke-width=\"1.2\"/>\n<path d=\"M-6 2C-14 8-18 16-22 22\" stroke=\"#8a7a60\" stroke-width=\"2.6\"/>\n</g>\n<rect x=\"10\" y=\"10\" width=\"54\" height=\"20\" fill=\"#efe6d2\"/><text x=\"37\" y=\"24\" text-anchor=\"middle\" font-size=\"10\" fill=\"#a3302a\">照片 7</text>\n</svg><figcaption>左腳鞋帶繩結特寫。<span>🔍 點擊放大</span></figcaption></figure><p class=\"small\">死者生前照片中可辨識鞋帶者共 14 張，均為一般蝴蝶結。</p>"},{"id":"B11","role":"B","stage":3,"icon":"note","title":"無線電通聯紀錄","sub":"合歡山管理站・1/16 凌晨","body":"<div class=\"hd\"><div><div class=\"org\">合歡山管理站</div><h2>無線電通聯紀錄簿（2011/1/16）</h2></div><span class=\"tag\">紀錄</span></div><table><tr><th>時間</th><th>對象</th><th>內容</th></tr><tr><td>00:20</td><td>雲杉山莊（許）</td><td>回報積雪</td></tr><tr><td>00:48</td><td>管理站</td><td>呼叫雲杉，<b>無回應</b></td></tr><tr><td>01:05</td><td>管理站</td><td>呼叫雲杉，<b>無回應</b></td></tr><tr><td>01:22</td><td>管理站</td><td>呼叫雲杉，<b>無回應</b></td></tr><tr><td>01:40</td><td>雲杉山莊（許）</td><td>回應，稱「剛才去巡屋頂」</td></tr><tr><td>01:40–02:20</td><td>雲杉山莊（許）</td><td>協助確認受困車輛座標，全程應答無中斷，背景有女性複誦數字</td></tr></table>"},{"id":"B12","role":"B","stage":3,"icon":"pen","title":"山莊維修紀錄","sub":"許正雄手寫","body":"<div class=\"hd\"><div><div class=\"org\">雲杉山莊</div><h2>維修紀錄簿（節錄）</h2></div><span class=\"tag\">原件</span></div><p class=\"hand\">2010/11/20　縣府來函，203、206 熱水器要換。錢呢？</p><p class=\"hand\">2011/1/15　15:30　高先生說 205 熱水器不熱。關電源，明天叫人上來修。</p>"},{"id":"A13","role":"A","stage":4,"icon":"note","title":"電子郵件往來","sub":"2011/1・羅建宏信箱","body":"<div class=\"hd\"><div><div class=\"org\">證物　《山岳視野》雜誌社提供（2026）</div><h2>羅建宏與高志遠之電子郵件</h2></div><span class=\"tag\">列印</span></div><p><b>羅建宏 → 高志遠　2011/1/8</b></p><p>學長，我拿到 1996 年搜救隊的無線電錄音了。你報的是北溪。雅琪在南稜多活了五天。二月號會刊出，我想在山上先聽你親口說。</p><p><b>高志遠 → 羅建宏　2011/1/9</b></p><p>見面談。山上冷，記得帶厚外套。雅婷不知道這件事吧？先別跟她說。</p><p class=\"small\">另：志遠戶外原定 2011 年 3 月股票上櫃，同年 2 月宣布延後。</p>"},{"id":"A14","role":"A","stage":4,"icon":"folder","title":"志遠戶外 樣品領用簿","sub":"2026 年調閱","body":"<div class=\"hd\"><div><div class=\"org\">志遠戶外股份有限公司</div><h2>產品開發部　樣品領用簿（節錄）</h2></div><span class=\"tag\">影本</span></div><table><tr><th>編號</th><th>品名</th><th>領用人</th><th>日期</th></tr><tr><td>S-03</td><td>雪地靴原型（<b>菱格紋大底</b>，28 號）</td><td>董事長 高志遠</td><td>2010/12/10</td></tr><tr><td>S-07</td><td>極地防水收納袋原型（<b>橘色</b>）</td><td>董事長 高志遠</td><td>2010/12/28</td></tr><tr><td>—</td><td>防水收納袋量產款（<b>藍色</b>）×6</td><td>董事長室（贈品）</td><td>2011/1/12</td></tr></table>"},{"id":"B13","role":"B","stage":4,"icon":"photo","title":"2026 排氣管勘驗","sub":"203 號房","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>203 號房熱水器排氣管　拆解勘驗</h2></div><span class=\"tag\">新事證</span></div><figure class=\"ev\"><svg viewBox=\"0 0 300 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Serif TC,serif\">\n<defs><radialGradient id=\"soot\" cx=\".45\" cy=\".5\" r=\".6\"><stop offset=\"0\" stop-color=\"#d4692a\"/><stop offset=\".55\" stop-color=\"#8a3a14\"/><stop offset=\"1\" stop-color=\"#1d120c\"/></radialGradient></defs>\n<rect width=\"300\" height=\"220\" fill=\"#e9e6df\"/>\n<path d=\"M60 70l26-18 30 10 24-14 34 12 22-6 30 26-8 26 14 30-20 22-36-4-24 16-30-10-26 12-28-20 6-24-18-22z\" fill=\"url(#soot)\"/>\n<g transform=\"rotate(-8 150 120)\"><rect x=\"120\" y=\"104\" width=\"48\" height=\"22\" fill=\"#f4f1ea\" opacity=\".9\"/>\n<rect x=\"120\" y=\"104\" width=\"48\" height=\"22\" fill=\"none\" stroke=\"#2a2420\" stroke-width=\".4\"/>\n<text x=\"144\" y=\"112\" text-anchor=\"middle\" font-size=\"3.4\" fill=\"#2a2420\">志遠戶外　KAO OUTDOOR</text>\n<text x=\"144\" y=\"119\" text-anchor=\"middle\" font-size=\"3.2\" fill=\"#2a2420\">樣品　S-07</text>\n<rect x=\"152\" y=\"104\" width=\"16\" height=\"22\" fill=\"#1d120c\" opacity=\".55\"/></g>\n<path d=\"M20 200h40\" stroke=\"#2a2420\" stroke-width=\"2\"/><text x=\"40\" y=\"196\" text-anchor=\"middle\" font-size=\"8\" fill=\"#2a2420\">1 cm</text>\n<text x=\"290\" y=\"212\" text-anchor=\"end\" font-size=\"8\" fill=\"#6b5a48\">殘片 V-1（203 排氣管彎頭）</text>\n</svg><figcaption>排氣管外側彎頭內取出之織物殘片。<span>🔍 點擊放大</span></figcaption></figure><p>殘片為尼龍防水布，嚴重燻黑，邊緣撕裂，研判有人自排氣口外側將塞入之物拉出時斷裂殘留。排氣口位於陽台牆面，離地約 150 cm，站立即可觸及。206 排氣管內無異物。</p>"},{"id":"B14","role":"B","stage":4,"icon":"finger","title":"2026 205 熱水器拆解","sub":"雲杉山莊舊址","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>205 號房電熱水器　拆解報告</h2></div><span class=\"tag\">新事證</span></div><p>溫控器兩條接線<b>整齊切斷</b>，斷面平滑，非燒毀或老化。研判以剪鉗類工具人為剪斷。</p>"},{"id":"X1","role":"S","stage":1,"lock":"x1","icon":"mic","title":"潘秀蘭 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：潘秀蘭（65 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：登記表上 203 是高先生。</p><p class=\"a\">答：他們換房間了。十點半在交誼廳，羅先生說 205 沒熱水，高先生說：「我那間有浴缸，你去泡，我睡 205。」我在旁邊收杯子，聽得很清楚。方小姐也在。</p><p class=\"q\">問：那浴巾呢？</p><p class=\"a\">答：十點四十分我拿兩條浴巾到 203，是羅先生開的門。</p><p class=\"q\">問：誰知道他們換了房間？</p><p class=\"a\">答：我、方小姐，還有他們兩個。沈醫師九點半就上樓了，老闆那時候在外面弄發電機。</p><p class=\"q\">問：那晚二樓有沒有什麼不尋常？</p><p class=\"a\">答：九點四十五分我送毯子到 202，出來的時候看到走廊地毯上有一排濕腳印，是雪水，從最西邊陽台門那裡進來，往東走，到 203、204 那邊就看不清楚了。</p><p class=\"q\">問：腳印長什麼樣子？</p><p class=\"a\">答：很大，鞋底是一格一格的菱形。那時候樓上應該只有沈醫師，可是那不是女生的腳。</p>"},{"id":"X2","role":"S","stage":1,"lock":"x2","icon":"mic","title":"許正雄 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：許正雄（75 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：照片 7 的鞋帶，和你器材室的繩結一樣。</p><p class=\"a\">答：……是我綁的。我搬了他。可是我沒有殺他，我發誓。</p><p class=\"q\">問：從頭說。</p><p class=\"a\">答：十二點五十分左右，帳房天花板開始滴水，燈罩裡都是水。我上二樓，203 的浴缸在溢水，羅先生躺在裡面，一股瓦斯臭味。我關了瓦斯、關了水，撕開窗戶的膠條通風。他已經沒氣了。</p><p class=\"q\">問：你為什麼不叫人？</p><p class=\"a\">答：那台熱水器縣府叫我三月前換，我沒錢換。客人死在我違規的熱水器底下，我要坐牢，山莊要關，後天高志遠還要來收我的股份。我那時候只想到，讓它看起來不是在屋子裡出的事。</p><p class=\"q\">問：然後呢？</p><p class=\"a\">答：我把他擦乾，門後掛著一件外套，我以為是他的，就給他穿上。衣服穿反了我也沒注意，眼鏡忘在洗手台上。我從後樓梯把他扛下去，用器材室的拖板拖到步道口，讓他趴著。回來大概一點三十五分，管理站一直在呼叫，我說我去巡屋頂。</p><p class=\"q\">問：排氣口呢？</p><p class=\"a\">答：排氣口？我沒去陽台。我一直以為是那台老機器自己出問題。</p>"},{"id":"X3","role":"S","stage":1,"lock":"x3","icon":"mic","title":"沈佩珊 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：沈佩珊（54 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：你是急診醫師。鮮紅色的屍斑，你不會只想到失溫。</p><p class=\"a\">答：……我想到了一氧化碳。可是他在戶外，那不合理。我告訴自己，低溫也會這樣。</p><p class=\"q\">問：你當年說九點半吃了安眠藥，一覺到天亮。</p><p class=\"a\">答：我沒吃。我睡不著。一點十分左右頭痛得厲害，從後樓梯下去廚房燒熱水，大概待到一點四十五分。</p><p class=\"q\">問：在廚房看到什麼？</p><p class=\"a\">答：一點二十分左右，北邊窗外，雪地裡有個人拖著那塊橘色的拖板往步道口走。走路一跛一跛的。我以為是老闆在處理什麼東西。</p><p class=\"q\">問：你為什麼隱瞞？</p><p class=\"a\">答：隔天早上，屍體就在我看到那個人走去的地方。我讀過雅琪的日記，我恨高志遠，那天晚上我又不在房間裡。我說了，第一個被懷疑的會是我。</p><p class=\"q\">問：你知道他們換房間嗎？</p><p class=\"a\">答：不知道。我一直以為 203 是志遠的房間。</p>"},{"id":"X4","role":"S","stage":1,"lock":"x4","icon":"mic","title":"方雅婷 2026 補充筆錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：方雅婷（49 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：羅建宏要給你看的東西，你現在知道了。</p><p class=\"a\">答：他要給我看那捲錄音。高志遠報錯了位置，我姊姊多活了五天。</p><p class=\"q\">問：那晚高志遠有什麼不尋常？</p><p class=\"a\">答：他整晚都在跟我講他當年「做了最正確的決定」。我覺得他一直在看時鐘。</p><p class=\"q\">問：兩點四十分之後呢？</p><p class=\"a\">答：我們一起上樓。他走進 205。我在 202 睡不著，大概兩點五十分，聽到陽台門那種很刺耳的吱呀聲，開了又關。陽台門就在我房間旁邊。然後有腳步聲往東走回去。</p><p class=\"q\">問：你當年為什麼沒說？</p><p class=\"a\">答：警察說他是在外面凍死的，我以為陽台門跟這件事沒有關係。</p>"}],"suspects":[{"id":"kao","name":"高志遠","desc":"前登山隊領隊，56 歲。戶外用品公司董事長。","deflect":["這跟建宏的死有什麼關係？","我沒有什麼好隱瞞的。","都十五年了，你們到底想查什麼。"]},{"id":"shen","name":"沈佩珊","desc":"前急診科醫師，54 歲。2012 年離職，在偏鄉衛生所兼診。","deflect":["這個我不清楚。","我當年的筆錄寫得很清楚了。","（她看著窗外，沒有回答。）"]},{"id":"fang","name":"方雅婷","desc":"委託人，49 歲。1996 年山難罹難者方雅琪之妹。","deflect":["這個我真的不知道。","如果我知道，十五年前就說了。","對不起，我幫不上忙。"]},{"id":"hsu","name":"許正雄","desc":"前山莊負責人，75 歲。山莊 2011 年 2 月歇業，現在埔里種茶。","deflect":["這個你問我我問誰。","山上的事，我只知道我看到的。","喝茶啦，這個我不會答。"]},{"id":"pan","name":"潘秀蘭","desc":"前山莊員工，65 歲。","deflect":["這個我看不懂啦。","我只是煮飯打掃的。","你們要不要去問老闆？"]}],"bts":[{"id":"x1","sus":"pan","docs":["A7","B7"],"minGate":1,"code":"6184","reply":"她看了很久。「203？……那天晚上，他們換了房間啊。你們不知道嗎？」"},{"id":"x2","sus":"hsu","docs":["A11","B10","A12"],"minGate":2,"code":"9027","reply":"他盯著那個繩結，手開始發抖。「……二十年的習慣，改不掉。」"},{"id":"x3","sus":"shen","docs":["B6"],"minGate":1,"code":"1358","reply":"她看到那個數字，閉上了眼睛。「……58%。我那天早上就應該說的。」"},{"id":"x4","sus":"fang","docs":["A13"],"minGate":3,"code":"7741","reply":"她讀完那封信，手捂住嘴。「羅大哥要給我看的……就是這個。」"}],"gates":[{"q":"羅建宏的遺體，是從<b>幾點</b>開始就躺在那片雪地上的？（四位數，例如 0430）","hints":["雪停之後就不會再積。他背上積了多少雪，要從照片上讀。","比例尺的數字很小，放大看雪面停在哪一格。","從雪停的時間往回算，最後一段不一定是整小時。"],"ok":"凌晨一點二十分，他就已經在那裡了。","h":["487784b8"]},{"q":"羅建宏真正死亡的地點，是山莊的<b>幾號房</b>？","hints":["先確定死因，再想：山莊裡哪裡會產生那種氣體？","只有某些房間有那種設備。","房務紀錄裡，有一間房出現了不該出現的東西。"],"ok":"他死在 203 號房的浴缸裡。","h":["458aad87"]},{"text":true,"q":"把羅建宏搬到雪地上的人是誰？（輸入姓名）","hints":["照片 7 的繩結，和另一張照片裡的某個繩結很像。","有一份資料說明了那種收尾法是誰的習慣。","還要確認：這個人在一點二十分前後，有沒有不在場證明？"],"ok":"許正雄。他承認搬了遺體，但堅持沒有殺人。","h":["7827c2f5"]},{"text":true,"q":"塞進 203 排氣管的那樣東西，原本屬於誰？（輸入姓名）","hints":["殘片上有一個很小的標籤。","贈品是什麼顏色？殘片是什麼顏色？","有一本領用簿記錄了每個編號給了誰。"],"ok":"高志遠。","h":["98282a5"]}],"final":[{"k":"q1","l":"一、造成羅建宏死亡的人是？","o":[["kao","高志遠"],["shen","沈佩珊"],["fang","方雅婷"],["hsu","許正雄"],["pan","潘秀蘭"],["none","沒有人，是設備老舊的意外"]],"h":["e2ac1f23"]},{"k":"q2","l":"二、兇手想殺的人是？","o":[["lo","羅建宏"],["kao","高志遠"],["fang","方雅婷"],["hsu","許正雄"]],"h":["8c090738"]},{"k":"q3","l":"三、手法是？","o":[["swap","先剪斷 205 熱水器的線，讓羅建宏沒熱水；再堵住 203 排氣口，把自己的浴室「讓」給他"],["kaotarget","在 203 排氣口塞東西，想殺每晚十一點泡澡的高志遠"],["drug","在酒裡下藥後把他帶到屋外"],["cold","關掉暖氣讓他在房間裡失溫"]],"h":["58ae00ab"]},{"k":"q4","l":"四、把遺體搬到雪地上的人是？","o":[["hsu","許正雄"],["shen","沈佩珊"],["kao","高志遠"],["pan","潘秀蘭"]],"h":["2247211d"]},{"k":"q5","l":"五、搬運遺體的原因是？","o":[["hide","怕違規的瓦斯熱水器害死客人被追究、山莊被勒令停業"],["help","受高志遠指使，替他滅證"],["frame","想嫁禍沈佩珊"],["save","想把他送下山急救"]],"h":["ff86f446"]},{"k":"q6","t":"num","l":"六、遺體被放到雪地上的時間（四位數）","ph":"例如 0430","h":["b6a6be28"]},{"k":"q7","l":"七、沈佩珊當年隱瞞了什麼？","o":[["saw","她沒睡，凌晨在廚房看到有人拖著救難拖板走向步道口"],["block","是她堵住了排氣口"],["move","是她搬了遺體"],["lie","她和高志遠串供"]],"h":["891f1ac9"]},{"k":"q8","l":"八、動機是？","o":[["1996","羅建宏取得錄音，要在雜誌揭露 1996 年高志遠謊報位置"],["share","山莊股權與 420 萬借款"],["sis","替方雅琪報仇"],["love","感情糾紛"]],"h":["8e7a0526"]},{"k":"q9","l":"九、排氣管裡的東西，是什麼時候、被誰拉出來的？","o":[["after","凌晨兩點五十分左右，高志遠從陽台拉出，殘片斷在管內"],["hsu","許正雄開窗通風時順手拉出"],["morning","隔天早上警察勘察時"],["shen","沈佩珊凌晨下樓前"]],"h":["a4066bd0"]}],"confront":{"who":"高志遠","title":"對質","intro":"<p>結案報告送出了。</p><p>高志遠帶著律師來。他是被害人眼中的「學長」，是讓出自己房間的好人，是差點被殺的那一個。他準備好了每一個答案。</p><p>兩組卷宗已經合併。一句一句，拆掉他的說法。</p>","fail":["「這份文件，跟我剛才說的有什麼關係？」","「請不要用臆測問話。」律師說。","「（他笑了一下）你們確定要用這個？」"],"rounds":[{"say":"我把自己的房間讓給建宏。如果真的有人設了陷阱，要害的人是我。你們應該保護我才對。","docs":["B12","A7","B14"],"hint":"205 的熱水器，是什麼時候、被誰說壞掉的？那時候羅建宏到了嗎？","ok":"「我只是先幫大家看看房間。主辦人本來就該這樣。」"},{"say":"我整晚都在交誼廳，雅婷可以作證。我根本沒有機會去陽台。","docs":["A1","X1","A14"],"hint":"他真的一整晚都沒離開嗎？還有九點四十五分走廊上的腳印。","ok":"「……上樓拿個菸也有罪？」他第一次沒有看律師。"},{"say":"排氣管裡卡著什麼布？那種收納袋我們公司一年賣十幾萬個，那天我還送了每個人一個。","docs":["B13","A14"],"hint":"送給大家的是什麼顏色？殘片又是什麼顏色、什麼編號？","ok":"（他沉默了很久。）「……那個樣品，我以為我扯乾淨了。」"},{"say":"就算是這樣。我為什麼要害建宏？他是我學弟，二十年的交情。","docs":["A13","X4"],"hint":"羅建宏是攝影記者。出事前一週，他寫了一封信。","ok":"「他要把我毀掉。公司三月上櫃，四百個員工。為了一個十五年前的錯誤。」"},{"say":"我沒有搬他。我兩點四十分才上樓。你們不能把雪地的事也算在我頭上。","docs":["X2","X3","A12","A11","B10"],"hint":"搬遺體的人，和堵排氣口的人，是同一個人嗎？","ok":"「……兩點五十分我走進 203。浴缸是空的，窗戶開著，人不見了。我跑去陽台把東西拉出來，扯斷了。我在那個房間站了好久。我到今天都不知道，那天晚上是誰替我收的尾。」"}]},"ending":"CjxwPjxiPuWFh+aJi++8mumrmOW/l+mBoOOAguS7luaDs+auuueahO+8jOWwseaYr+e+heW7uuWuj+OAgjwvYj48L3A+CjxwPjxiPuWLleapnzwvYj7jgIAxOTk2IOW5tO+8jOmgmOmaiumrmOW/l+mBoOeCuuS6humaseeenuacqueUs+iri+eahOWNl+eonOi3r+e3mu+8jOWQkeaQnOaVkemaiuisiuWgseS9jee9rueCuuOAjOWMl+a6quOAjeOAguaWuembheeQquWcqOWNl+eonOWkmua0u+S6huS6lOWkqeOAgjIwMTEg5bm0IDEg5pyI77yM5pSd5b2x6KiY6ICF576F5bu65a6P5ou/5Yiw55W25bm055qE54Sh57ea6Zu76YyE6Z+z77yM5rqW5YKZ5Zyo5LqM5pyI6Jmf6Zuc6KqM5YiK5Ye644CC5b+X6YGg5oi25aSW5LiJ5pyI5bCx6KaB5LiK5quD44CCPC9wPgo8cD48Yj7kvYjlsYA8L2I+44CA6auY5b+X6YGg5Lul6IKh5p2x6Lqr5YiG6KiC5oi/77yM5oqK6Ieq5bex5o6S6YCy5ZSv5LiA5pyJ5rW057y444CB5L2/55So5bGL5YWn5Z6L55Om5pav54ax5rC05Zmo55qEIDIwM++8jOaKiue+heW7uuWuj+aOkumAsiAyMDXjgIIxNDo1MCDku5bnrKzkuIDlgIvkuIrlsbHvvIzliarmlrcgMjA1IOeGseawtOWZqOeahOa6q+aOp+e3mu+8jDE1OjMwIOWQkeioseato+mbhOOAjOWgseS/ruOAje+8jOmCo+aZgue+heW7uuWuj+mChOaykuWIsOOAguaZmumkkOaZgu+8jOWkp+WutueskeS7luavj+aZmuWNgeS4gOm7nuS4gOWumuimgeazoea+oeOAgjwvcD4KPHA+PGI+MjE6NDA8L2I+44CA5LuW6Kqq5LiK5qiT5ou/6I+477yM5b6e6KW/5YG06Zm95Y "林淑芬","蘇柏翰","鄭進財","陳滿","其他"],"chapters":["河邊的包包","另一個月台","台東","只有數字的明信片"],"prologue":"<p>1997 年 10 月 17 日，花東縱谷，颱風前夕。</p><p>二十二歲的代課老師江曉雯，在霧溪車站的候車室等末班車。站長離開了十分鐘。回來的時候，長椅上只剩一圈水漬。</p><p>隔天早上，她的包包出現在暴漲的溪邊。沒有人找到她。</p><p>鎮上的人很快就有了答案：那天傍晚，有人看到她和男朋友在橋頭大吵。</p><p>那個男孩今年五十三歲。他被叫了二十九年的殺人犯。</p>","chapterIntro":["<p>清晨六點以後。</p><p>溪水退了之後，才有人把那個包包端端正正放上護岸。</p><p>那不是一個落水的人留下的，是有人想讓全鎮看到的東西。</p><p>鐵路局的舊資料調出來了。</p>","<p>371 次，南下普快。</p><p>全鎮的人都在北上的月台找她，而那天晚上，有一個穿黃雨衣的人去了對面。</p><p>老站長的女兒帶來了一個鐵盒。現在也可以去找當年的人當面談了。</p>","<p>台東。</p><p>票上寫的是枋寮，那個人卻在台東就下了車。</p><p>那天晚上搭上南下列車的，是誰？</p><p>鐵盒的最底層，還有三張明信片。</p>","<p>「我一直在家。」</p><p>請兩位把整件事拼起來，提交結案報告。</p>"],"docs":[{"id":"S0","role":"S","stage":1,"icon":"note","title":"調查委託信","sub":"2026 年・蘇柏翰","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組・收件紀錄</div><h2>調查委託</h2></div><span class=\"tag\">優先</span></div><p class=\"hand\">我叫蘇柏翰，在霧溪開機車行。</p><p class=\"hand\">二十九年前，我女朋友江曉雯不見了。警察沒有抓我，因為沒有屍體。可是鎮上每個人都知道「是我做的」。我媽去市場，人家不賣她菜。</p><p class=\"hand\">我沒有離開霧溪。萬一她回來，要有人在。</p><p class=\"hand\">上個月，老站長的女兒怡君來找我。她拿來幾張寄到車站的明信片，上面只有數字。她說她爸爸過世前，一直說他「對不起阿翰」。</p><p class=\"hand\">我媽今年八十四歲。我想在她走之前，讓她知道她兒子沒有殺人。也想知道曉雯到底怎麼了。不管答案是什麼。</p><div class=\"note\"><b>任務說明</b><br>兩人分屬<b>證詞組</b>與<b>鑑識組</b>，各自只拿到一半卷宗。請用通話或訊息交換資訊，<b>只能用說的或打字描述，不要截圖給對方</b>。<br>本案共四章，每章破解一道密碼才會開啟下一批卷宗。<br>照片類證物可以<b>點開放大</b>，有些細節只有放大才看得見。<br>卷宗裡出現的時間（例如 22:40）可以點一下，加入「線索板」的時間軸。<br>結案報告共九題，其中一題要自己填寫。</div>"},{"id":"S1","role":"S","stage":1,"icon":"folder","title":"案件摘要（1997）","sub":"花蓮縣警察局","body":"<div class=\"hd\"><div><div class=\"org\">花蓮縣警察局　玉里分局</div><h2>霧溪站女教師失蹤案　摘要</h2></div><span class=\"tag\">未結</span></div><table><tr><th style=\"width:26%\">失蹤人</th><td>江曉雯，22 歲，霧溪國小代課教師</td></tr><tr><th>最後行蹤</th><td>1997/10/17（星期五）21:40 前後，霧溪車站候車室（站長周福生目擊）</td></tr><tr><th>物證</th><td>10/18 08:10，河川巡守員於霧溪護岸發現失蹤人之手提包</td></tr><tr><th>天候</th><td>颱風外圍環流，10/17 入夜後豪雨，霧溪暴漲。10/18 起南迴線停駛三日。</td></tr></table><p><b>研判：</b>（一）失蹤人於候車期間離站，在溪邊失足落水；或（二）遭人殺害後棄於溪中。下游及出海口搜索十日，未尋獲遺體。</p><p><b>關係人：</b>蘇柏翰（男友，24 歲）。當日 19:30 與失蹤人在霧溪橋頭激烈爭吵；衣物有血跡。</p><p><b>備註：</b>蘇柏翰於 10/17 23:20 因酒後在麵店鬥毆，被帶回霧溪派出所留置至 10/18 09:00。</p><p>2005 年，繼父江國棟聲請死亡宣告獲准。江國棟於 2024 年病逝。</p>"},{"id":"A1","role":"A","stage":1,"icon":"mic","title":"蘇柏翰 筆錄","sub":"男友・1997/10/18","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：蘇柏翰（24 歲，機車行學徒）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨天和江曉雯見面的情形？</p><p class=\"a\">答：七點半她約我在橋頭，說要分手，叫我以後不要再找她。我問為什麼，她不講，只說「你跟我在一起不會有好日子」。我很大聲，我承認。她哭著走了。</p><p class=\"q\">問：之後你去哪裡？</p><p class=\"a\">答：騎車亂繞。後來在霧溪橋下躲雨，喝了半瓶米酒。</p><p class=\"q\">問：有人看到你嗎？</p><p class=\"a\">答：沒有吧。那麼大的雨。</p><p class=\"q\">問：你衣服上的血？</p><p class=\"a\">答：十一點多我去麵店，有人講曉雯的閒話，我就打過去。鼻血是我自己的。</p><p class=\"q\">問：她平常有什麼習慣？</p><p class=\"a\">答：她不戴錶。她說看月台的大鐘就好。她手上常常有瘀青，我問，她都說是學生撞的。</p>"},{"id":"A2","role":"A","stage":1,"icon":"mic","title":"江國棟 筆錄","sub":"繼父・1997/10/18","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：江國棟（51 歲，鄉民代表、碾米廠負責人）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：你和失蹤人的關係？</p><p class=\"a\">答：她是我太太帶過來的女兒，我讓她跟我姓，當親生的養。她媽媽前年過世以後，就我們父女兩個。</p><p class=\"q\">問：昨晚你在哪裡？</p><p class=\"a\">答：代表會開會到九點，之後就回家了，一整晚都在家。她沒回來，我以為又跑去找那個修車的。</p><p class=\"q\">問：她最近有什麼異狀？</p><p class=\"a\">答：情緒很不穩。那個姓蘇的沒前途，我叫她分手，她跟我鬧。</p><p class=\"q\">問：家裡有遺失物品嗎？</p><p class=\"a\">答：（停頓）沒有。</p><p class=\"q\">問：你認為她可能去哪裡？</p><p class=\"a\">答：我看是凶多吉少。你們應該好好查那個姓蘇的。</p>"},{"id":"A3","role":"A","stage":1,"icon":"mic","title":"周福生 筆錄","sub":"霧溪站站長・1997/10/18","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：周福生（55 歲，霧溪站站長）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨晚的情形？</p><p class=\"a\">答：曉雯九點半來買票，一張到花蓮，北上末班車。她說要去花蓮找同學住幾天。然後就坐在候車室等。</p><p class=\"q\">問：之後呢？</p><p class=\"a\">答：九點四十左右，雨太大，我去巡北邊的轉轍器，怕積水。大概十分鐘回來，候車室就沒人了。</p><p class=\"q\">問：北上末班車來的時候？</p><p class=\"a\">答：十點零五分，我在第一月台接車。沒有人上車。</p><p class=\"q\">問：站裡還有別人嗎？</p><p class=\"a\">答：夜班就我一個。</p><p class=\"q\">問：你有看到蘇柏翰嗎？</p><p class=\"a\">答：沒有。阿翰整晚都沒來過車站，這個我可以保證。</p><p class=\"q\">問：你和失蹤人熟嗎？</p><p class=\"a\">答：她媽媽是我小學同學。這孩子從小在月台上寫功課。（沉默）是個好孩子。</p>"},{"id":"A4","role":"A","stage":1,"icon":"mic","title":"陳滿 筆錄","sub":"站前雜貨店・1997/10/18","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：陳滿（56 歲，站前雜貨店負責人）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：昨晚你看到什麼？</p><p class=\"a\">答：雨那麼大，沒什麼人。九點半左右，一台黑色賓士停在站前，引擎沒熄，停幾分鐘又開走。全鄉只有鄭進財有那種車。</p><p class=\"q\">問：有看到江曉雯嗎？</p><p class=\"a\">答：九點多她從我店門口走過去，沒撐傘，抱著包包。</p><p class=\"q\">問：還有呢？</p><p class=\"a\">答：快九點五十吧，我看到一個穿黃色雨衣的人，走平交跨越道到對面第二月台。帽子戴著，看不到臉。</p><p class=\"q\">問：那個人的身形？</p><p class=\"a\">答：不高，比周站長矮一個頭。</p><p class=\"q\">問：後來呢？</p><p class=\"a\">答：南下的車停了一下就開走了。十點多那班北上的才來。</p>"},{"id":"A5","role":"A","stage":1,"icon":"mic","title":"高金水 筆錄","sub":"河川巡守員・1997/10/18","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：高金水（47 歲，霧溪河川巡守員）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：發現經過？</p><p class=\"a\">答：早上八點十分，我去護岸看水退了沒。那個包包就放在護岸的台階上，很顯眼。</p><p class=\"q\">問：確切位置？</p><p class=\"a\">答：水尺旁邊。我每天抄水位，看得很清楚，包包放的那一階剛好對著水尺 <b>42.0 公尺</b>的刻度。</p><p class=\"q\">問：包包的狀況？</p><p class=\"a\">答：立著放的，拉鍊拉好。底部有一點濕，上面是乾的。裡面的課本都乾乾的，沒有泥巴。</p><p class=\"q\">問：昨晚水有多大？</p><p class=\"a\">答：半夜最大的時候，護岸下面好幾階都淹掉了，水尺上的泥線看得出來。</p>"},{"id":"A6","role":"A","stage":1,"icon":"mic","title":"林淑芬 筆錄","sub":"同事・1997/10/20","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：林淑芬（32 歲，霧溪國小教師）</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：你和江曉雯的關係？</p><p class=\"a\">答：學校裡跟她最好的就是我。</p><p class=\"q\">問：她有跟你提過要去哪裡嗎？</p><p class=\"a\">答：她說過想去花蓮找大學同學住一陣子。</p><p class=\"q\">問：10 月 17 日晚上你在哪裡？</p><p class=\"a\">答：在家改作業。颱風天，誰也沒出門。</p><p class=\"q\">問：她最近的狀況？</p><p class=\"a\">答：心情很差。她跟男朋友常常吵架。</p>"},{"id":"B1","role":"B","stage":1,"icon":"finger","title":"手提包鑑識報告","sub":"1997","body":"<div class=\"hd\"><div><div class=\"org\">花蓮縣警察局　鑑識課</div><h2>失蹤人手提包及內容物　鑑識報告</h2></div><span class=\"tag\">鑑識</span></div><table><tr><th>項目</th><th>記錄</th></tr><tr><td>外觀</td><td>米色帆布手提包。底部潮濕，側面及頂部乾燥。表面無泥沙附著。</td></tr><tr><td>背帶</td><td>內側有一處深色油漬，約 3×2 cm（疑為機油；關係人蘇柏翰為機車行學徒）。</td></tr><tr><td>皮夾</td><td>身分證、教師證、現金 300 元</td></tr><tr><td>書籍</td><td>三年級國語課本一冊、《霧溪國小校刊》第 12 期一冊。均乾燥。</td></tr><tr><td>其他</td><td>鑰匙一串、折疊傘（未使用）</td></tr><tr><td>未見</td><td>存摺、印章、換洗衣物</td></tr></table>"},{"id":"B2","role":"B","stage":1,"icon":"note","title":"霧溪水位站逐時紀錄","sub":"第九河川局","body":"<div class=\"hd\"><div><div class=\"org\">經濟部水利署　第九河川局</div><h2>霧溪護岸水位站　逐時水位（1997/10/17–18）</h2></div><span class=\"tag\">紀錄</span></div><table><tr><th>時間</th><th>水位（m）</th><th>時間</th><th>水位（m）</th></tr><tr><td>10/17 21:00</td><td>41.0</td><td>10/18 03:00</td><td>43.0</td></tr><tr><td>22:00</td><td>41.4</td><td>04:00</td><td>42.6</td></tr><tr><td>23:00</td><td>41.9</td><td>05:00</td><td>42.3</td></tr><tr><td>10/18 00:00</td><td>42.3</td><td>06:00</td><td>42.0</td></tr><tr><td>01:00</td><td>42.8</td><td>07:00</td><td>41.8</td></tr><tr><td>02:00</td><td><b>43.3（洪峰）</b></td><td>08:00</td><td>41.6</td></tr></table><p>備註：水位讀數對應護岸水尺刻度。洪水挾帶大量泥沙，淹沒範圍留有泥線。</p>"},{"id":"B3","role":"B","stage":1,"icon":"finger","title":"蘇柏翰衣物血跡鑑定","sub":"1997","body":"<div class=\"hd\"><div><div class=\"org\">花蓮縣警察局　鑑識課</div><h2>關係人衣物血跡鑑定</h2></div><span class=\"tag\">鑑識</span></div><p>白色汗衫前胸滴落狀血跡：O 型。蘇柏翰 O 型；江曉雯（教師體檢紀錄）A 型。</p><p><b>結果：</b>與蘇柏翰本人相符，符合鼻部出血。</p>"},{"id":"B4","role":"B","stage":1,"icon":"map","title":"霧溪站周邊平面圖","sub":"現場圖","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　偵查隊</div><h2>霧溪車站周邊現場圖</h2></div><span class=\"tag\">附圖</span></div><svg viewBox=\"0 0 340 270\" font-family=\"Noto Sans TC,sans-serif\" font-size=\"10\" fill=\"#2a2420\">\n<text x=\"12\" y=\"14\" font-size=\"9\" fill=\"#6b5a48\">↑ 北（往花蓮）</text><text x=\"12\" y=\"262\" font-size=\"9\" fill=\"#6b5a48\">↓ 南（往台東、枋寮）</text>\n<g stroke=\"#2a2420\" stroke-width=\"2\"><path d=\"M150 10v250M158 10v250M196 10v250M204 10v250\"/></g>\n<g stroke=\"#2a2420\" stroke-width=\".6\"><path d=\"M146 30h16M192 30h16\"/><path d=\"M146 60h16M192 60h16\"/><path d=\"M146 90h16M192 90h16\"/><path d=\"M146 120h16M192 120h16\"/><path d=\"M146 150h16M192 150h16\"/><path d=\"M146 180h16M192 180h16\"/><path d=\"M146 210h16M192 210h16\"/><path d=\"M146 240h16M192 240h16\"/></g>\n<rect x=\"118\" y=\"70\" width=\"26\" height=\"130\" fill=\"rgba(160,120,70,.15)\" stroke=\"#2a2420\"/><text x=\"131\" y=\"140\" text-anchor=\"middle\" font-size=\"9\" transform=\"rotate(-90 131 140)\">第一月台（北上）</text>\n<rect x=\"210\" y=\"70\" width=\"26\" height=\"130\" fill=\"rgba(160,120,70,.15)\" stroke=\"#2a2420\"/><text x=\"223\" y=\"140\" text-anchor=\"middle\" font-size=\"9\" transform=\"rotate(90 223 140)\">第二月台（南下）</text>\n<path d=\"M144 190h66\" stroke=\"#a3302a\" stroke-dasharray=\"3 3\"/><text x=\"177\" y=\"186\" text-anchor=\"middle\" font-size=\"8\" fill=\"#a3302a\">平交跨越道</text>\n<rect x=\"50\" y=\"90\" width=\"68\" height=\"80\" fill=\"none\" stroke=\"#2a2420\" stroke-width=\"1.5\"/><path d=\"M50 130h68\" stroke=\"#2a2420\"/>\n<text x=\"84\" y=\"114\" text-anchor=\"middle\" font-weight=\"700\">候車室</text><text x=\"84\" y=\"150\" text-anchor=\"middle\" font-weight=\"700\">站長室</text>\n<rect x=\"96\" y=\"156\" width=\"10\" height=\"8\" fill=\"#6b5a48\"/><text x=\"101\" y=\"168\" text-anchor=\"middle\" font-size=\"6\">暖爐</text>\n<rect x=\"64\" y=\"168\" width=\"14\" height=\"5\" fill=\"#efe6d2\" stroke=\"#2a2420\"/><text x=\"71\" y=\"182\" text-anchor=\"middle\" font-size=\"7.5\">後門</text>\n<rect x=\"50\" y=\"186\" width=\"68\" height=\"30\" fill=\"rgba(120,90,50,.12)\" stroke=\"#2a2420\" stroke-dasharray=\"3 2\"/><text x=\"84\" y=\"205\" text-anchor=\"middle\" font-size=\"8.5\">貨運月台</text>\n<path d=\"M20 216h96\" stroke=\"#6b5a48\" stroke-width=\"5\" opacity=\".35\"/><text x=\"30\" y=\"232\" font-size=\"8\" fill=\"#6b5a48\">產業道路（往碾米廠）</text>\n<rect x=\"8\" y=\"100\" width=\"34\" height=\"40\" fill=\"none\" stroke=\"#2a2420\"/><text x=\"25\" y=\"118\" text-anchor=\"middle\" font-size=\"8.5\">阿滿</text><text x=\"25\" y=\"130\" text-anchor=\"middle\" font-size=\"8.5\">雜貨店</text>\n<text x=\"46\" y=\"84\" font-size=\"8\" fill=\"#6b5a48\">站前廣場</text>\n<path d=\"M285 10c-12 60 14 120 -4 250\" fill=\"none\" stroke=\"#4a6a8a\" stroke-width=\"10\" opacity=\".45\"/><text x=\"310\" y=\"60\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4a6a8a\">霧溪</text>\n<path d=\"M236 160q20 14 36 8\" fill=\"none\" stroke=\"#2a2420\" stroke-dasharray=\"2 3\"/><text x=\"258\" y=\"184\" text-anchor=\"middle\" font-size=\"8\">小路 300 m</text>\n<g stroke=\"#a3302a\" stroke-width=\"2\"><path d=\"M268 160l8 8M276 160l-8 8\"/></g><text x=\"300\" y=\"150\" text-anchor=\"middle\" font-size=\"8\" fill=\"#a3302a\">護岸・水尺</text>\n</svg><p class=\"small\">站長室有後門通往貨運月台，貨運月台旁為產業道路。第二月台須走平交跨越道。護岸距車站約 300 公尺。</p>"},{"id":"A7","role":"A","stage":2,"icon":"mic","title":"北上 652 次列車長 筆錄","sub":"1997/10/20","body":"<div class=\"hd\"><div><div class=\"org\">玉里分局　調查筆錄</div><h2>關係人：652 次列車長</h2></div><span class=\"tag\">筆錄</span></div><p class=\"q\">問：10 月 17 日晚上，霧溪站有旅客上車嗎？</p><p class=\"a\">答：沒有。月台上只有周站長一個人。</p><p class=\"q\">問：站長有什麼異狀嗎？</p><p class=\"a\">答：他全身都濕了，雨衣也沒穿。我問他雨衣咧？他說借人了。</p>"},{"id":"A8","role":"A","stage":2,"icon":"mic","title":"退休列車長 訪談","sub":"2026 年","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：退休列車長 邱○榮（78 歲）</h2></div><span class=\"tag\">新事證</span></div><p class=\"q\">問：1997 年 10 月 17 日晚上，您值哪一班車？</p><p class=\"a\">答：南下的普快。隔天南迴就停駛了，所以我記得。</p><p class=\"q\">問：經過霧溪站時，有人上車嗎？</p><p class=\"a\">答：有一個。我正要吹哨，周站長帶一個人從跨越道跑過來，穿站上的黃色雨衣。他說是「員工眷屬」，票他開了，叫我不用查。</p><p class=\"q\">問：那位旅客的樣子？</p><p class=\"a\">答：瘦瘦小小，帽子一直沒拿下來，整路沒講話，好像在哭。上車的時候左手抓著扶手，手腕上一支錶，車廂燈一照很亮，我還想說小姐的錶真漂亮。</p><p class=\"q\">問：她在哪一站下車？</p><p class=\"a\">答：這我就不記得了，我在台東交班。</p>"},{"id":"A9","role":"A","stage":2,"icon":"mic","title":"林淑芬 2026 訪談","sub":"退休教師","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：林淑芬（61 歲，霧溪國小退休教師）</h2></div><span class=\"tag\">新事證</span></div><p class=\"q\">問：你是江曉雯在學校最好的朋友。</p><p class=\"a\">答：是。她夏天也穿長袖，我知道為什麼。</p><p class=\"q\">問：她失蹤前跟你說過什麼？</p><p class=\"a\">答：10 月 16 日她跟我借了五千塊，說：「淑芬姊，如果有一天我不見了，不要找我。」我以為她要尋短，抱著她哭。她說：「我不是要去死，我是要去活。」</p><p class=\"q\">問：那你當年為什麼跟警察說她去花蓮？</p><p class=\"a\">答：她叫我這樣說的。我想，讓大家以為她去了北邊，說不定才是保護她。</p><p class=\"q\">問：10 月 17 日晚上你在哪裡？</p><p class=\"a\">答：在家改作業。</p><p class=\"small\">訪談員註記：受訪者左腕戴一支舊式女錶，自述「戴了快三十年」。</p>"},{"id":"B5","role":"B","stage":2,"icon":"note","title":"霧溪站時刻表（1997）","sub":"鐵路局","body":"<div class=\"hd\"><div><div class=\"org\">臺灣鐵路管理局</div><h2>霧溪站　晚間列車時刻（1997 年 10 月）</h2></div><span class=\"tag\">時刻表</span></div><table><tr><th>車次</th><th>車種</th><th>方向</th><th>霧溪開</th><th>月台</th></tr><tr><td>648</td><td>普通</td><td>北上</td><td>19:12</td><td>一</td></tr><tr><td>363</td><td>普快</td><td>南下</td><td>19:40</td><td>二</td></tr><tr><td>650</td><td>普通</td><td>北上</td><td>20:31</td><td>一</td></tr><tr><td>7603</td><td>貨物</td><td>北上</td><td>通過不停</td><td>—</td></tr><tr><td>371</td><td>普快</td><td>南下（經台東、南迴線往高雄）</td><td>21:52</td><td>二</td></tr><tr><td>652</td><td>普通</td><td>北上（往花蓮）末班</td><td>22:05</td><td>一</td></tr></table>"},{"id":"B6","role":"B","stage":2,"icon":"cash","title":"售票日報表","sub":"霧溪站・10/17","body":"<div class=\"hd\"><div><div class=\"org\">臺灣鐵路管理局　霧溪站</div><h2>售票日報表（1997/10/17 晚間）</h2></div><span class=\"tag\">報表</span></div><table><tr><th>票號</th><th>時間</th><th>區間</th><th>票價</th></tr><tr><td>0416</td><td>19:05</td><td>霧溪→玉里</td><td>22</td></tr><tr><td>0417</td><td>20:20</td><td>霧溪→花蓮</td><td>96</td></tr><tr><td>0418</td><td>21:30</td><td>霧溪→花蓮</td><td>96</td></tr></table><p>當日南下 363、371 次：無售票紀錄。10 月份手寫「代用票」登帳數：0 張。</p>"},{"id":"B7","role":"B","stage":2,"icon":"finger","title":"2026 背帶油漬分析","sub":"重新鑑定","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>手提包背帶油漬　成分分析</h2></div><span class=\"tag\">新事證</span></div><p><b>結果：</b>鋰基極壓潤滑脂，含石墨添加物，為<b>鐵路轉轍器專用潤滑脂</b>，非機車用油。</p><p><b>意見：</b>油漬應來自接觸過轉轍設備之人的手部。1997 年「疑為機油」之記載應予更正。</p>"},{"id":"B8","role":"B","stage":2,"icon":"finger","title":"衛生所就診紀錄","sub":"1997 年","body":"<div class=\"hd\"><div><div class=\"org\">霧溪鄉衛生所</div><h2>就診紀錄（2026 年依法調閱）</h2></div><span class=\"tag\">病歷</span></div><table><tr><th>日期</th><th>記錄</th></tr><tr><td>1997/6/3</td><td>左前臂挫傷。自述跌倒。</td></tr><tr><td>1997/8/21</td><td>右肩、背部多處瘀傷，新舊不一。自述騎車摔倒。</td></tr><tr><td>1997/10/14</td><td>左臉頰腫脹，左上臂環狀指痕。自述撞到門。</td></tr></table><p class=\"hand\">護理人員註記（10/14）：傷勢與自述不符。問她要不要報警，她搖頭，說「他是代表，沒有人會信」。</p>"},{"id":"A10","role":"A","stage":3,"icon":"pen","title":"周站長的鐵盒（一）","sub":"周怡君提供","body":"<div class=\"hd\"><div><div class=\"org\">證物　周怡君提供</div><h2>周福生遺物：代用票存根、私人日誌</h2></div><span class=\"tag\">原件</span></div><figure class=\"ev\"><svg viewBox=\"0 0 380 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Serif TC,serif\">\n<rect width=\"380\" height=\"210\" fill=\"#3a3129\"/>\n<rect x=\"16\" y=\"14\" width=\"348\" height=\"182\" fill=\"#ebe1c8\" stroke=\"#8c7a5c\"/>\n<text x=\"190\" y=\"38\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2a2420\" letter-spacing=\"2\">臺灣鐵路管理局　車站代用票　存根</text>\n<text x=\"352\" y=\"28\" text-anchor=\"end\" font-size=\"3.6\" fill=\"#2a2420\">No. 0032</text>\n<g font-size=\"9\" fill=\"#2a2420\"><text x=\"34\" y=\"66\">日期：86 年 10 月 17 日</text><text x=\"34\" y=\"88\">車種：普快　　人數：1</text>\n<text x=\"34\" y=\"110\">起站：霧溪</text><text x=\"190\" y=\"110\">迄站：</text><text x=\"34\" y=\"132\">票價：211 元</text></g>\n<rect x=\"222\" y=\"100\" width=\"64\" height=\"14\" fill=\"#1d1a16\"/>\n<text x=\"34\" y=\"164\" font-size=\"11\" fill=\"#1e3a6e\">備註：未入帳。自付。</text>\n<text x=\"352\" y=\"188\" text-anchor=\"end\" font-size=\"7\" fill=\"#6b5a48\">站長　周福生</text>\n</svg><figcaption>鐵盒內的代用票存根。<span>🔍 點擊放大</span></figcaption></figure><p class=\"hand\">10/17　她媽媽走之前叫我看著這孩子。我看了兩年，什麼都沒做。今天晚上她站在售票口，捲起袖子給我看。我叫她在站長室等，把門閂上，我巡完轉轍器就回來帶她過去。她說：「伯伯，如果我走了，天亮把我的包包放到河邊，他們就不會再找了。」</p><p class=\"hand\">10/18　等天亮了、水退了，去了一趟河邊。回來洗手，洗不掉那個油。站長室的暖爐被挪過，地上濕成一片。雨太大了吧。</p><p class=\"hand\">10/25　他們把阿翰叫去問了三次。我能說的只有這麼多，多說一句，那孩子就白跑了。</p><p class=\"hand\">87/3/2　收到了。平安就好。</p>"},{"id":"A11","role":"A","stage":3,"icon":"cash","title":"借據與土地謄本","sub":"2026 年調閱","body":"<div class=\"hd\"><div><div class=\"org\">證物　地政事務所／鄭進財提供</div><h2>借據及土地登記沿革</h2></div><span class=\"tag\">影本</span></div><p><b>借據（1996/11）</b>：江國棟向鄭進財借款 320 萬元，月息三分。<span class=\"hand\">「以霧溪段 214 地號土地抵償」</span></p><table><tr><th>年</th><th>所有權人</th><th>原因</th></tr><tr><td>1995</td><td><b>江曉雯</b></td><td>遺贈（母　林秋月）</td></tr><tr><td>2006</td><td>江國棟</td><td>繼承（死亡宣告）</td></tr><tr><td>2007</td><td>進財砂石</td><td>買賣</td></tr></table><p class=\"small\">214 地號權狀及江曉雯印鑑章，1997 年 10 月後下落不明。</p>"},{"id":"A12","role":"A","stage":3,"icon":"pen","title":"江曉雯的教學日誌","sub":"教室抽屜・1997","body":"<div class=\"hd\"><div><div class=\"org\">證物　霧溪國小保存</div><h2>三年乙班　教學日誌（最後一頁）</h2></div><span class=\"tag\">原件</span></div><p class=\"hand\">10/16（四）聯絡簿全部改完了，每一本都多寫了幾句。</p><p class=\"hand\">小傑的注音還是會把ㄅ和ㄉ寫反，請接手的老師多一點耐心。</p><p class=\"hand\">教室後面的盆栽三天澆一次。</p><p class=\"hand\">孩子們，老師對不起你們。有些地方，要先離開，才回得去。</p>"},{"id":"B9","role":"B","stage":3,"icon":"note","title":"普快票價里程表","sub":"鐵路局・1997","body":"<div class=\"hd\"><div><div class=\"org\">臺灣鐵路管理局</div><h2>霧溪站起　南下普快票價表（1997 年）</h2></div><span class=\"tag\">票價表</span></div><table><tr><th>到站</th><th>里程</th><th>票價</th><th>站碼</th></tr><tr><td>池上</td><td>31 km</td><td>38</td><td>0612</td></tr><tr><td>關山</td><td>44 km</td><td>52</td><td>0618</td></tr><tr><td>台東</td><td>78 km</td><td>89</td><td>0704</td></tr><tr><td>大武</td><td>133 km</td><td>142</td><td>0811</td></tr><tr><td>枋寮</td><td>176 km</td><td>211</td><td>0907</td></tr><tr><td>高雄</td><td>258 km</td><td>281</td><td>0920</td></tr></table>"},{"id":"B10","role":"B","stage":3,"icon":"note","title":"出站收回車票紀錄","sub":"1997/10/17 南下 371 次","body":"<div class=\"hd\"><div><div class=\"org\">臺灣鐵路管理局　稽核室（檔案調閱）</div><h2>南下 371 次（1997/10/17）沿線出站收回之手寫代用票</h2></div><span class=\"tag\">紀錄</span></div><table><tr><th>代用票號</th><th>發票站</th><th>票面迄站</th><th>收回站</th><th>時間</th></tr><tr><td>0029</ table><p class=\"small\">本期主編：林淑芬。行號為鑑識人員所加。</p>"},{"id":"B12","role":"B","stage":4,"icon":"finger","title":"明信片筆跡鑑定","sub":"2026 年","body":"<div class=\"hd\"><div><div class=\"org\">刑事警察局　鑑識科（2026 年）</div><h2>明信片數字筆跡　比對報告</h2></div><span class=\"tag\">新事證</span></div><figure class=\"ev\"><svg viewBox=\"0 0 400 280\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Serif TC,serif\">\n<rect width=\"400\" height=\"280\" fill=\"#2f2822\"/>\n<rect x=\"12\" y=\"10\" width=\"376\" height=\"124\" fill=\"#f2ead6\"/>\n<text x=\"24\" y=\"28\" font-size=\"9\" fill=\"#2a2420\">樣本 A　江曉雯　1997 年教學日誌（成績欄）</text>\n<g stroke=\"#b9c8de\" stroke-width=\".6\"><path d=\"M24 90H376M24 120H376\"/></g>\n<g fill=\"none\" stroke=\"#1e2f5c\" stroke-width=\"0.95\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 5C0.2 4 0.6 0 3 0C5.4 0 5.8 4 3 5C0 6 0.4 10 3 10C5.6 10 6 6 3 5\" transform=\"translate(32.00 59.01) scale(2.600) rotate(-0.8 3 5)\"/><path d=\"M3.4 0L0.4 6.6L6 6.6M4.7 2.8L4.7 10\" transform=\"translate(52.80 58.82) scale(2.600) rotate(0.2 3 5)\"/><path d=\"M0.4 0.6L6 0.6L2.4 10M1.4 5.2L5 5.2\" transform=\"translate(102.20 57.69) scale(2.600) rotate(0.5 3 5)\"/><path d=\"M5 0.4C2 0 0 4 0.5 7.5C1 10.5 5.6 10.5 5.6 7C5.6 4.4 1.4 4.4 0.8 7\" transform=\"translate(123.00 57.10) scale(2.600) rotate(-4.3 3 5)\"/><path d=\"M3.4 0L0.4 6.6L6 6.6M4.7 2.8L4.7 10\" transform=\"translate(172.40 57.86) scale(2.600) rotate(4.3 3 5)\"/><path d=\"M0.4 0.6L6 0.6L2.4 10M1.4 5.2L5 5.2\" transform=\"translate(193.20 58.65) scale(2.600) rotate(-3.4 3 5)\"/><path d=\"M5.6 3C5.6 0 0.4 0 0.4 3C0.4 5.6 5 5.6 5.6 3L5 10\" transform=\"translate(242.60 58.92) scale(2.600) rotate(0.1 3 5)\"/><path d=\"M1.8 2.2L3.6 0L3.6 10\" transform=\"translate(263.40 58.33) scale(2.600) rotate(-3.6 3 5)\"/><path d=\"M0.4 0.6L6 0.6L2.4 10M1.4 5.2L5 5.2\" transform=\"translate(312.80 57.86) scale(2.600) rotate(2.6 3 5)\"/><path d=\"M3.4 0L0.4 6.6L6 6.6M4.7 2.8L4.7 10\" transform=\"translate(333.60 57.54) sca iv class=\"org\">台東縣警察局　旅館臨檢紀錄（檔案）</div><h2>寶桑旅社　旅客登記簿（1997/10/17–10/20）</h2></div><span class=\"tag\">紀錄</span></div><table><tr><th>入住</th><th>姓名</th><th>年齡</th><th>住址</th><th>退房</th></tr><tr><td>10/17 23:58</td><td>林淑芬</td><td>32</td><td>花蓮縣霧溪鄉</td><td>10/20</td></tr><tr><td>10/18 00:30</td><td>陳○○</td><td>45</td><td>屏東縣</td><td>10/21</td></tr></table>"},{"id":"B14","role":"B","stage":4,"icon":"finger","title":"水泥訂單與透地雷達","sub":"1997／2026","body":"<div class=\"hd\"><div><div class=\"org\">進財砂石／刑事警察局</div><h2>預拌混凝土訂單（1997）及透地雷達掃描報告（2026）</h2></div><span class=\"tag\">新事證</span></div><p><b>訂單</b>：1997/10/18 07:10 電話訂貨，訂購人江國棟，三立方米，送至江家碾米廠新倉庫，用途「地坪」，備註「颱風天也要送，急件」。10/19 送達灌漿。</p><p><b>2026 掃描</b>：碾米廠舊倉庫（2007 年後閒置）地坪下約 0.9 m 處，有一處長約 1.7 m、寬約 0.6 m 之異常回波，與周邊回填土層不連續。<b>已申請開挖。</b></p>"},{"id":"X1","role":"S","stage":1,"lock":"x1","icon":"mic","title":"鄭進財 2026 偵訊紀錄","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 偵訊紀錄</div><h2>關係人：鄭進財（77 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：1997 年 10 月 17 日晚上九點半，你的賓士停在霧溪站前。</p><p class=\"a\">答：江國棟叫我去的。他說女兒要跑，叫我幫忙堵車站。我在站前看了一眼，候車室有人，我就先開走，去橋那邊繞。</p><p class=\"q\">問：你看到什麼？</p><p class=\"a\">答：九點四十五分左右，霧溪橋下有個人坐在機車旁邊淋雨喝酒，是那個姓蘇的。離車站兩公里。</p><p class=\"q\">問：還有呢？</p><p class=\"a\">答：我繞回來的時候，九點五十分前後，江國棟碾米廠那台小貨車從車站後面的產業道路開出來，沒開大燈。我按喇叭，他沒停。那台車他從來不借人。</p><p class=\"q\">問：之後呢？</p><p class=\"a\">答：隔天一大早他打電話跟我訂三米水泥，說倉庫地坪要灌，颱風天也要送。我罵他瘋了，他還是要。</p><p class=\"q\">問：你為什麼當年不說？</p><p class=\"a\">答：說了，警察就會問我颱風夜去堵一個小姐做什麼。（低頭）那個姓蘇的年輕人，我欠他。</p>"},{"id":"X2","role":"S","stage":1,"lock":"x2","icon":"mic","title":"周怡君 2026 補充訪談","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：周怡君（52 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：包包上的油，是轉轍器專用的。</p><p class=\"a\">答：我爸晚年說過：「包包是我放的。是她自己交代的，說天亮放到河邊，他們就不會再追了。」</p><p class=\"q\">問：他還說了什麼？</p><p class=\"a\">答：他最後那幾個月一直重複一句話：「她上車的時候，手腕在發亮。」我問他什麼意思，他說：「曉雯從來不戴錶的。」我以為他糊塗了。</p><p class=\"q\">問：他有懷疑過什麼嗎？</p><p class=\"a\">答：明信片寄來的時候，他很高興。可是第二張之後，他有一次喝醉了說：「她的字……怎麼越寫越像別人。」</p>"},{"id":"X3","role":"S","stage":1,"lock":"x3","icon":"mic","title":"蘇柏翰 2026 訪談","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>委託人：蘇柏翰（53 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：這些數字是什麼意思？</p><p class=\"a\">答：以前我們不能讓她繼父知道，就用這個傳紙條。前面是第幾行，後面是那一行的第幾個字，標點不算。要兩個人有同一篇東西才對得出來。</p><p class=\"q\">問：你們用哪一篇？</p><p class=\"a\">答：她寫過一首詩，登在校刊上，叫〈月台〉。她說那是寫給站長伯伯的。</p><p class=\"q\">問：還有誰知道這個方法？</p><p class=\"a\">答：紙條有時候是淑芬姊幫忙傳的。她看過。</p><p class=\"q\">問：你說「這不是她寫的」。</p><p class=\"a\">答：曉雯寫 4，上面是開口的，不會封起來。她說像一面小旗子。這幾張的 4 是封起來的。</p>"},{"id":"X4","role":"S","stage":1,"lock":"x4","icon":"mic","title":"陳滿 2026 補充訪談","sub":"偵訊突破","body":"<div class=\"hd\"><div><div class=\"org\">舊案重啟小組　2026 訪談紀錄</div><h2>關係人：陳滿（85 歲）</h2></div><span class=\"tag\">突破</span></div><p class=\"q\">問：那天晚上還看到什麼？</p><p class=\"a\">答：九點四十分左右，貨運月台旁邊停了一台小貨車，碾米廠的，車斗蓋著帆布。我以為是要載貨。</p><p class=\"q\">問：之後呢？</p><p class=\"a\">答：快九點五十，它沒開大燈就開走了，往碾米廠那邊。差不多同時，那個穿黃雨衣的人從站長室那邊走出來，過跨越道。</p><p class=\"q\">問：為什麼當年沒說？</p><p class=\"a\">答：江代表是什麼人，我一個賣雜貨的，哪敢講。</p>"}],"suspects":[{"id":"su","name":"蘇柏翰","desc":"委託人，53 歲。當年的男友，在霧溪開機車行。","deflect":["這個我看不懂。","我那天真的沒有去車站。","你們問什麼我都講，可是這個我不知道。"]},{"id":"cheng","name":"鄭進財","desc":"砂石業者，77 歲。當年的債主。","deflect":["我跟這件事沒有關係。","年代久遠，不記得了。","有事找我律師。"]},{"id":"chou","name":"周怡君","desc":"已故站長周福生之女，52 歲。","deflect":["這個我不清楚，我那時候在台北念書。","我爸很少講工作的事。","對不起，我幫不上忙。"]},{"id":"man","name":"陳滿","desc":"阿滿姨，85 歲。站前雜貨店還開著。","deflect":["阿姨老了，看不懂這個啦。","我看到的當年都講了。","你們要不要吃茶葉蛋？"]},{"id":"lin","name":"林淑芬","desc":"霧溪國小退休教師，61 歲。失蹤人當年的同事。","deflect":["這個我不清楚。","曉雯是很好的老師，孩子們都喜歡她。","（她搖頭，摸了摸手腕上的錶。）"]}],"bts":[{"id":"x1","sus":"cheng","docs":["A4","A11"],"minGate":2,"code":"5290","reply":"他把老花眼鏡摘下來，很久沒有說話。「……那天晚上，我看到的不只那個姓蘇的。」"},{"id":"x2","sus":"chou","docs":["B7","A10"],"minGate":2,"code":"8436","reply":"她的眼眶紅了。「所以，包包真的是他放的。……他到最後一直在講一件事。」"},{"id":"x3","sus":"su","docs":["A13"],"minGate":3,"code":"1175","reply":"他把卡片拿得很近，看了很久。「……這不是她寫的。」"},{"id":"x4","sus":"man","docs":["A10","B4"],"minGate":2,"code":"6602","reply":"她放下手上的茶葉蛋。「站長室的後門啊……那天晚上，其實我還看到一台車。」"}],"gates":[{"q":"那個包包，最早是在<b>幾點以後</b>才被放到護岸上的？（四位數，例如 2140）","hints":["包包裡面是乾的，也沒有泥沙。","包包放在水尺的某個刻度上。","水位要退到那個刻度以下，包包才不會被淹過。"],"ok":"清晨六點以後，溪水退了，才有人把包包放上去。","h":["25026530"]},{"q":"穿黃雨衣的人，搭上的是<b>哪一個車次</b>？","hints":["有人看到黃雨衣走去另一個月台。","另一個月台的車往哪個方向？","時刻表上，九點五十分前後，從那個月台開出的是哪一班？"],"ok":"371 次，南下普快，21:52。","h":["914476fc"]},{"q":"站長開的那張代用票，最後在哪一站被收走？請輸入該站的<b>站碼</b>。","hints":["存根上的票號很小，要放大。","鐵路局有一份紀錄，列出那班車沿線收回的手寫代用票。","站碼在票價表上。"],"ok":"台東。票面寫的是枋寮（211 元），那個人卻在台東就出站了。","h":["c296aed9"]},{"text":true,"q":"解開<b>第三張</b>明信片。上面寫的是什麼？","hints":["每組數字是「第幾行－第幾個字」。","需要一篇寄件人和站長都有的文字。","那篇文字就在她的包包裡。"],"ok":"「我一直在家。」","h":["b25ffae","82bf74f3"]}],"final":[{"k":"q1","l":"一、1997 年 10 月 17 日晚上，江曉雯發生了什麼事？","o":[["left","依照計畫搭車離開霧溪"],["killed","在站長室遇害"],["river","在溪邊失足落水"],["su","被男友殺害後棄屍"]],"h":["c767ca64"]},{"k":"q2","l":"二、殺害她的人是？","o":[["jiang","江國棟（繼父）"],["cheng","鄭進財（債主）"],["lin","林淑芬（同事）"],["chou","周福生（站長）"],["su","蘇柏翰（男友）"]],"h":["a9958765"]},{"k":"q3","l":"三、穿黃雨衣搭上南下列車的人是？","o":[["xw","江曉雯"],["lin","林淑芬"],["man","陳滿"],["none","沒有人上車"]],"h":["7dae31fe"]},{"k":"q4","t":"num","l":"四、那個人實際出站的車站（站碼四位數）","ph":"例如 0612","h":["c8088365"]},{"k":"q5","l":"五、河邊的包包是誰放的？","o":[["chou","周福生，照曉雯事先的交代，他以為她已經逃走"],["jiang","江國棟，偽裝成落水"],["lin","林淑芬，讓人以為她死了"],["xw","江曉雯自己"]],"h":["e65dcc3a"]},{"k":"q6","l":"六、三張明信片是誰寄的？","o":[["xw","江曉雯"],["lin","林淑芬"],["chou","周怡君"],["su","蘇柏翰"]],"h":["9d1a4639"]},{"k":"q7","l":"七、她現在在哪裡？","o":[["liu","屏東小琉球"],["mill","江家碾米廠倉庫的水泥地坪下"],["river","霧溪下游"],["land","霧溪段 214 地號"]],"h":["877aae9d"]},{"k":"q8","l":"八、林淑芬為什麼幫忙？","o":[["lover","她是江國棟的情人，向他通風報信，以為債務解決後就能和他結婚"],["money","被鄭進財收買"],["jealous","嫉妒蘇柏翰"],["threat","被蘇柏翰威脅"]],"h":["6af3c81e"]},{"k":"q9","l":"九、蘇柏翰與這件事的關係？","o":[["clear","無關。他兩次都在別處：21:45 在橋下，清晨被留置在派出所"],["help","他暗中幫她離開"],["kill","他是兇手"],["unk","無法判斷"]],"h":["83c05a16"]}],"confron var TRE=/([01]?\d|2[0-4])[:：]([0-5]\d)/g;
function tagTimes(root,docId){
 var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){var p=n.parentNode;while(p&&p!==root){if(p.nodeName==='svg'||p.nodeName==='FIGURE'||(p.classList&&p.classList.contains('codebar')))return NodeFilter.FILTER_REJECT;p=p.parentNode;}return /\d[:：]\d\d/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
 var nodes=[];while(w.nextNode())nodes.push(w.currentNode);
 nodes.forEach(function(n){var t=n.nodeValue,frag=document.createDocumentFragment(),last=0,m;TRE.lastIndex=0;
  while((m=TRE.exec(t))){if(m.index>0&&/\d/.test(t.charAt(m.index-1)))continue;if(/\d/.test(t.charAt(m.index+m[0].length)))continue;
   frag.appendChild(document.createTextNode(t.slice(last,m.index)));var sp=document.createElement('span');sp.className='tm';sp.textContent=m[0];
   var hh=('0'+m[1]).slice(-2)+':'+m[2];sp.onclick=(function(tt,el){return function(e){e.stopPropagation();var blk=el.parentElement.closest('tr,p,li,div')||el.parentElement;tlAdd({t:tt,src:docId,x:blk.textContent.replace(/\s+/g,' ').trim().slice(0,90)});};})(hh,sp);
   frag.appendChild(sp);last=m.index+m[0].length;}
  if(last){frag.appendChild(document.createTextNode(t.slice(last)));n.parentNode.replaceChild(frag,n);}});}

var Z=1,pin=null,lastTap=0;
function zOpen(svg){$('zin').innerHTML=svg;Z=1;$('zin').style.width='100%';$('zl').textContent='1×';$('zoom').classList.add('on');$('zsc').scrollTop=0;$('zsc').scrollLeft=0;}
function zClose(){$('zoom').classList.remove('on');$('zin').innerHTML='';}
function zSet(z,cx,cy){var sc=$('zsc'),inr=$('zin');z=Math.max(1,Math.min(8,z));
 var rx=cx==null?sc.clientWidth/2:cx,ry=cy==null?sc.clientHeight/2:cy;
 var px=(sc.scrollLeft+rx)/inr.offsetWidth,py=(sc.scrollTop+ry)/Math.max(1,inr.offsetHeight);
 Z=z;inr.style.width=(z*100)+'%';$('zl').textContent=(Math.round(z*10)/10)+'×';
 sc.scrollLeft=px*inr.offsetWidth-rx;sc.scrollTop=py*inr.offsetHeight-ry;}
function zStep(d){var L=[1,1.5,2,3,4,6,8],i=0;while(i<L.length-1&&L[i]<=Z+0.01)i++;if(d<0){i=L.length-1;while(i>0&&L[i]>=Z-0.01)i--;}zSet(L[i]);}
(function(){var sc=$('zsc');
 sc.addEventListener('touchstart',function(e){if(e.touches.length===2){var a=e.touches[0],b=e.touches[1],r=sc.getBoundingClientRect();pin={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:Z,cx:(a.clientX+b.clientX)/2-r.left,cy:(a.clientY+b.clientY)/2-r.top};}
  else if(e.touches.length===1){var now=Date.now(),t=e.touches[0],r2=sc.getBoundingClientRect();if(now-lastTap<300){e.preventDefault();zSet(Z<2.5?3:1,t.clientX-r2.left,t.clientY-r2.top);lastTap=0;}else lastTap=now;}},{passive:false});
 sc.addEventListener('touchmove',function(e){if(pin&&e.touches.length===2){e.preventDefault();var a=e.touches[0],b=e.touches[1];zSet(pin.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pin.d,pin.cx,pin.cy);}},{passive:false});
 sc.addEventListener('touchend',function(e){if(e.touches.length<2)pin=null;});
 sc.addEventListener('dblclick',function(e){var r=sc.getBoundingClientRect();zSet(Z<2.5?3:1,e.clientX-r.left,e.clientY-r.top);});
 var drag=null;sc.addEventListener('mousedown',function(e){drag={x:e.clientX,y:e.clientY,l:sc.scrollLeft,t:sc.scrollTop};});
 window.addEventListener('mousemove',function(e){if(drag){sc.scrollLeft=drag.l-(e.clientX-drag.x);sc.scrollTop=drag.t-(e.clientY-drag.y);}});
 window.addEventListener('mouseup',function(){drag=null;});
 sc.addEventListener('wheel',function(e){if(e.ctrlKey){e.preventDefault();var r=sc.getBoundingClientRect();zSet(Z*(e.deltaY<0?1.15:0.87),e.clientX-r.left,e.clientY-r.top);}},{passive:false});})();

function syncPush(){if(!SY.db||!C||!S||S.role==='X'||!S.role||!SY.canW||SY.path!==roomPath())return;
 var p=JSON.stringify(payload());if(p===SY.last)return;if(SY.busy){SY.dirty=true;return;}
 SY.busy=true;SY.last=p;var done=function(){SY.busy=false;if(SY.dirty){SY.dirty=false;try{syncPush();}catch(e){}}};
 try{SY.db.collection(SY.path).doc(SY.uid).set(JSON.parse(p)).then(done,function(e){var c=e&&e.code;SY.busy=false;SY.last='';if(c!=='unavailable'&&c!=='resource_exhausted'){SY.canW=false;roomUp();}});}catch(e){SY.busy=false;}}
function syncClose(){if(SY.unsub){try{SY.unsub();}catch(e){}}SY.unsub=null;SY.path=null;SY.peers={};SY.last='';clearTimeout(SY.tm);}
function syncOpen(){if(!SY.db||!SY.uid||!C||!S||!S.role||S.role==='X')return;if(!S.room){S.room=newRoom();try{localStorage.setItem(C.key,JSON.stringify(S));}catch(e){}}
 var path=roomPath();if(SY.path===path)return;syncClose();SY.path=path;SY.st='conn';
 SY.tm=setTimeout(function(){if(SY.st==='conn'){SY.st='slow';roomUp();}},10000);
 try{SY.unsub=SY.db.collection(path).onSnapshot(onSnap,function(){SY.st='err';roomUp();});}catch(e){SY.st='err';}
 syncPush();}
function onSnap(q){if(!C||!S||SY.path!==roomPath())return;if(!q.metadata||!q.metadata.fromCache){clearTimeout(SY.tm);SY.st='on';}
 var peers={};try{q.docs.forEach(function(d){if(d.id===SY.uid||!d.exists)return;var o=d.data();if(o&&typeof o==='object')peers[d.id]=o;});}catch(e){return;}
 SY.peers=peers;var ev={};for(var id in peers)merge(peers[id],ev);
 if(ev.any){save();
  if(ev.nb){sfx('ok');toast('🔓 夥伴問出了新的偵訊紀錄');}
  if(ev.adv){toast('夥伴解開了密碼');if(modalOn())SY.q=true;else{render();gateStory();return;}}
  if(ev.fin){toast('結案報告通過，進入對質');if(modalOn())SY.fq=true;else{render();window.scrollTo(0,0);story('最終章',C.confront.title,C.confront.intro,'開始');return;}}
  if(ev.win){sfx('win');toast('結案');}
 }
 roomUp();if(S.tab==='board'&&S.bsub!=='notes')soft();checkReveal();}
function livePeers(){if(!S)return [];var a=[];for(var id in SY.peers){var o=SY.peers[id];if((+o.ep||0)===(S.ep||0)&&(o.role==='A'||o.role==='B'||o.role==='X'))a.push(o);}return a;}
function peerPick(g){if(!S||S.role==='X')return null;var a=livePeers();for(var i=0;i<a.length;i++){if(a[i].picks&&a[i].picks[g]!==undefined)return a[i];}return null;}
function merge(o,ev){var ep=+o.ep||0,my=S.ep||0;if(ep<my)return;
 if(ep>my){var role=S.role,room=S.room;S=blank();S.role=role;S.room=room;S.ep=ep;S.t0=Date.now();SY.q=false;SY.fq=false;pendPick=false;
  if(modalOn()){$('modal').classList.remove('on');document.body.style.overflow='';}$('dlg').classList.remove('on');closeSheet();toast('夥伴重置了本案');ev.any=true;}
 var n=nG(),g=o.gate|0;
 if(o.un&&typeof o.un==='object')C.bts.forEach(function(b){if(o.un[b.id]&&!S.un[b.id]){S.un[b.id]=1;ev.nb=ev.any=true;}});
 if(g>S.gate&&g<=n){S.gate=g;ev.adv=ev.any=true;}
 if(o.finalOk&&!S.finalOk&&S.gate>=n&&C.confront){S.finalOk=true;S.conf=0;S.cw=0;S.tab='final';ev.fin=ev.any=true;}
 if(S.finalOk&&C.confront&&(o.conf|0)>S.conf){S.conf=Math.min(o.conf|0,C.confront.rounds.length);S.cw=0;ev.any=true;}
 if(o.solved&&!S.solved&&S.finalOk){S.solved=true;S.conf=C.confront?C.confront.rounds.length:0;S.t1=Date.now();S.rank=rank()[0];ev.win=ev.any=true;}
 if(ev.any&&!ev.adv&&!ev.fin)setTimeout(soft,0);}
function checkReveal(){if(!C||!S||S.role==='X'||!SY.db)return;if($('dlg').classList.contains('on')||modalOn())return;
 for(var g=1;g<=nG();g++){if(S.picks[g]===undefined||S.rev[g])continue;var o=peerPick(g);if(!o)continue;S.rev[g]=1;try{localStorage.setItem(C.key,JSON.stringify(S));}catch(e){}
  var same=(o.picks[g]||'')===(S.picks[g]||'');sfx('stamp');
  dlgShow('<div class="who">第'+NUM[g-1]+'章・同時揭曉</div><div class="stats" style="grid-template-columns:1fr 1fr;margin:6px 0 14px"><div>你<b style="font-size:18px;margin-top:4px">'+pkName(S.picks[g])+'</b></div><div>夥伴<b style="font-size:18px;margin-top:4px">'+pkName(o.picks[g])+'</b></div></div><p class="small" style="margin:0 0 12px;text-align:center">'+(same?'你們想的一樣。':'你們看法不同。說服對方試試看。')+'</p><button class="btn" style="width:100%" onclick="dlgHide()">繼續</button>');return;}}
function roomCard(){if(!S||S.role==='X')return '';
 if(SY.none)return '<div class="room"><div class="rs"><i></i><b style="color:#e9d3a8">這個版本沒有即時同步。</b>偵訊問出新證詞後，紀錄下方會顯示四位數代碼，念給夥伴在「偵訊」頁輸入。密碼和結案報告，兩人各自輸入。</div></div>';
 if(!SY.db)return '<div class="room"><div class="rs wait"><i></i>正在檢查能否連線…</div></div>';
 var a=livePeers(),st;
 if(SY.st==='err')st='<div class="rs"><i></i>同步中斷。請改用代碼交換偵訊紀錄。</div>';
 else if(SY.st==='conn')st='<div class="rs wait"><i></i>連線中…</div>';
 else if(!a.length)st='<div class="rs wait"><i></i>'+(SY.st==='slow'?'還連不上，資料可能不是最新。':'等待夥伴加入這個房間。')+'</div>';
 else{var o=a[0],g=o.gate|0;st='<div class="rs on"><i></i>已和夥伴連線：'+(ROLES[o.role]?ROLES[o.role].name:'')+'，'+(o.solved?'已結案':g>=nG()?'結案階段':'第'+NUM[g]+'章')+(o.role===S.role?'　⚠ 你們選了同一組':'')+'</div>';}
 if(!SY.canW)st+='<div class="rs">你的帳號只能接收夥伴的進度，無法送出。請改用代碼。</div>';
 var h='<div class="room"><div class="small">房間代碼（把這組念給夥伴）</div><div class="rc">'+esc(S.room)+'</div>'+st;
 if(!a.length)h+='<div class="small" style="margin-top:10px">或輸入夥伴的房間代碼：</div><div class="row" style="margin-top:6px"><input class="inp txt" id="rj" maxlength="4" placeholder="ABCD" style="text-transform:uppercase;letter-spacing:.3em"><button class="btn" onclick="joinRoom()">加入</button></div><div class="msg" id="rjm"></div>';
 return h+'</div>';}
function roomUp(){if(!S||!C||S.tab!=='docs'||modalOn())return;var a=document.activeElement;if(a&&a.id==='rj')return;soft();}
function joinRoom(){var v=($('rj').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(v.length!==4){$('rjm').className='msg err';$('rjm').textContent='房間代碼是 4 個字。';return;}
 if(v===S.room)return;S.room=v;S.ep=0;try{localStorage.setItem(C.key,JSON.stringify(S));}catch(e){}SY.last='';syncOpen();toast('已加入房間 '+v);render();}
(function(){try{if(!window.claude||!window.claude.use){SY.none=true;return;}
 Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){if(!r[0]){SY.none=true;if(C&&S)soft();return;}
  var u=r[1];return Promise.resolve(u?u.id():null).then(function(id){SY.uid=id||lid();SY.db=r[0];if(C&&S&&S.role){syncOpen();soft();}});}).catch(function(){SY.none=true;});}catch(e){SY.none=true;}})();
home();
</script>
</body>
